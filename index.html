    <ul class="lic-list">${libs.map(([n, d, u]) => `<li><strong>${esc(n)}</strong><span>${esc(d)} · Apache License 2.0</span><a class="lic-url" href="${u}" target="_blank" rel="noopener">${esc(u.replace('https://', ''))}</a></li>`).join('')}</ul>
    <details class="lic-details"><summary>Lizenztext: Apache License 2.0</summary><div class="lic-text">${APACHE_2_0_HTML}</div></details>
  </article>`;
}

/* ===================== 9. NAVIGATION ===================== */
const App = {
  products: [], today: DateUtil.today(), route: { view: 'dashboard', id: null },
  dashQuery: '', listState: { query: '', status: 'all', category: '', sort: 'end' },
  form: null, stack: []
};
const PARENT = { product: 'dashboard', edit: 'dashboard', duplicate: 'dashboard', settings: 'dashboard', privacy: 'settings', licenses: 'settings', add: 'dashboard' };
const NAV_OF = { dashboard: 'dashboard', products: 'products', product: 'products', edit: 'products', duplicate: 'products', add: 'add', stats: 'stats', settings: 'settings', privacy: 'settings', licenses: 'settings' };

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const i = h.indexOf('/');
  const view = (i < 0 ? h : h.slice(0, i)) || 'dashboard';
  const id = i < 0 ? null : decodeURIComponent(h.slice(i + 1));
  return { view, id };
}
function go(path, { replace = false } = {}) {
  const hash = '#/' + path;
  if (replace) {
    history.replaceState(null, '', hash);
    App.stack[App.stack.length - 1] = hash;
    render();
  } else if (location.hash === hash) render();
  else location.hash = hash;
}
function goBack() {
  if (App.stack.length > 1) history.back();
  else go(PARENT[App.route.view] || 'dashboard', { replace: true });
}
async function reload() {
  const raw = await Store.getAllProducts();
  App.products = raw.map(sanitizeProduct).filter(Boolean);
  ReminderBridge.sync(App.products, App.today);
  Cloud.schedule();
}

function renderTopbar(r, title) {
  const back = ['product', 'edit', 'duplicate', 'settings', 'privacy', 'licenses', 'add'].includes(r.view);
  const bar = $('#topbar');
  if (r.view === 'dashboard') {
    bar.innerHTML = `<div class="topbar-inner"><div class="brand">${ICON.logo}<span class="brand-name">Beleg<b>wächter</b></span></div><a class="icon-btn" href="#/settings" aria-label="Einstellungen">${ICON.gear}</a></div>`;
  } else {
    const more = r.view === 'product' && App.products.some(p => p.id === r.id)
      ? `<button class="icon-btn" type="button" data-action="detail-menu" data-id="${esc(r.id)}" aria-label="Weitere Aktionen">${ICON.more}</button>` : '';
    bar.innerHTML = `<div class="topbar-inner${back ? ' has-back' : ''}">${back ? `<button class="icon-btn" type="button" data-action="back" aria-label="Zurück">${ICON.back}</button>` : ''}<h1 class="title">${esc(title)}</h1>${more}</div>`;
  }
  document.querySelectorAll('.nav-item').forEach(a => {
    const on = a.dataset.nav === (NAV_OF[r.view] || '');
    a.classList.toggle('active', on);
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
}

/** Rendert die aktuelle Route komplett neu. */
function render() {
  Overlay.removeAll();
  if (App.form && App.form.thumbUrl) URL.revokeObjectURL(App.form.thumbUrl);
  App.form = null;
  const r = parseHash();
  App.route = r;
  let title = '', html = '', after = null;
  const src = r.id ? App.products.find(p => p.id === r.id) : null;
  switch (r.view) {
    case 'dashboard': html = viewDashboard(); break;
    case 'products': case 'stats': go('dashboard', { replace: true }); return;
    case 'product': title = src ? src.name : 'Produkt'; html = viewDetail(r.id); break;
    case 'add': title = 'Produkt hinzufügen'; html = viewForm('add', null); after = () => mountForm('add', null); break;
    case 'edit':
    case 'duplicate':
      title = r.view === 'edit' ? 'Produkt bearbeiten' : 'Produkt duplizieren';
      if (src) { html = viewForm(r.view, src); after = () => mountForm(r.view, src); }
      else html = viewDetail(r.id);
      break;
    case 'settings': title = 'Einstellungen'; html = viewSettings(); after = () => { if (Cloud.enabled()) Cloud.load().then(() => Cloud.refreshUI()).catch(() => {}); }; break;
    case 'privacy': title = 'Datenschutz'; html = viewPrivacy(); break;
    case 'licenses': title = 'Lizenzen'; html = viewLicenses(); break;
    default: go('dashboard', { replace: true }); return;
  }
  renderTopbar(r, title);
  $('#app').innerHTML = `<div class="view">${html}</div>`;
  document.title = title ? title + ' – Belegwächter' : 'Belegwächter';
  window.scrollTo(0, 0);
  if (after) after();
}
/** Teil-Neuaufbau ohne Scroll-Sprung (z. B. nach Filterwechsel). */
function renderView() {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

/* ===================== 10. AKTIONEN & START ===================== */
const Actions = {
  back: () => { if (App.form) Draft.clear(); goBack(); },
  'draft-discard': async () => { await Draft.clear(); render(); },
  'dash-filter': el => {
    const s = el.dataset.status;
    App.listState = { query: '', status: s === 'all' ? 'all' : s, category: '', sort: 'end' };
    go('dashboard');
  },
  'set-status': el => { App.listState.status = el.dataset.status; renderView(); },
  'reset-filters': () => { App.listState = { query: '', status: 'all', category: '', sort: App.listState.sort }; renderView(); },
  ack: async el => {
    const p = App.products.find(x => x.id === el.dataset.id);
    if (!p) return;
    try {
      await Store.saveProduct({ ...p, reminderAcks: Reminders.ackValues(p, App.today) });
      await reload(); renderView();
    } catch (e) { UI.toast(storageErrorMessage(e), 'error'); }
  },
  'open-receipt': el => { const p = App.products.find(x => x.id === el.dataset.id); if (p && p.receipt) openReceiptViewer(p.receipt); },
  'replace-receipt': async el => {
    const p = App.products.find(x => x.id === el.dataset.id);
    if (!p) return;
    const file = await Picker.pick('file');
    if (!file) return;
    UI.toast('Rechnung wird gespeichert …');
    try {
      const prep = await Receipts.prepare(file);
      const now = new Date().toISOString();
      const rec = { id: newId(), productId: p.id, name: prep.name, type: prep.type, size: prep.size, addedAt: now, blob: prep.blob };
      const updated = { ...p, receipt: { id: rec.id, name: rec.name, type: rec.type, size: rec.size, addedAt: now }, updatedAt: now };
      await Store.saveProduct(updated, { putReceipt: rec, deleteReceiptId: p.receipt ? p.receipt.id : null });
      await reload(); requestPersistOnce();
      UI.toast(p.receipt ? 'Rechnung ersetzt' : 'Rechnung gespeichert');
      if (App.route.view === 'product' && App.route.id === p.id) renderView();
    } catch (e) {
      console.error(e);
      UI.toast(e instanceof UserError ? e.message : storageErrorMessage(e), 'error');
    }
  },
  delete: async el => {
    const p = App.products.find(x => x.id === el.dataset.id);
    if (!p) return;
    const ok = await UI.confirm({
      title: 'Produkt löschen?',
      html: `<p><strong>${esc(p.name)}</strong>${p.receipt ? ' und die gespeicherte Rechnung werden' : ' wird'} dauerhaft von diesem Gerät gelöscht.</p><p class="muted">Das kann nicht rückgängig gemacht werden.</p>`,
      confirmLabel: 'Produkt löschen', danger: true
    });
    if (!ok) return;
    try {
      await Store.deleteProduct(p.id, p.receipt ? p.receipt.id : null);
      await reload();
      UI.toast('Produkt gelöscht');
      go('dashboard', { replace: true });
    } catch (e) { UI.toast('Löschen fehlgeschlagen. Bitte versuche es erneut.', 'error'); }
  },
  'form-pick': el => { Draft.saveNow(); formPick(el.dataset.kind); },
  'scan-undo': () => Scan.undo(),
  'live-scan': async () => {
    const F = App.form; if (!F || F.busy) return;
    Draft.saveNow();
    const file = await LiveScan.open();
    if (file && App.form === F) await Scan.upload(F, file);
  },
  'scan-paste': () => Scan.paste(),
  'pdf-export': () => PdfReport.askAndExport(),
  'notify-toggle': async () => { if (Notify.on()) { await Notify.disable(); UI.toast('Benachrichtigungen ausgeschaltet'); } else if (await Notify.enable()) UI.toast('Benachrichtigungen sind aktiv.'); renderView(); },
  'notify-test': () => Notify.test(),
  'cloud-signin': () => Cloud.signIn(),
  'cloud-now': () => {
    if (!App.products.length) { UI.toast('Auf diesem Gerät sind keine Produkte, die gesichert werden können.'); return; }
    Cloud.upload(true);
  },
  'cloud-restore': async () => {
    let remote;
    try { remote = await Cloud.fetchData(); } catch (e) { Cloud.fail(e); UI.toast(Cloud.errorText(e), 'error'); return; }
    if (!remote || !remote.products.length) { UI.toast('In deinem Konto gibt es noch keine Sicherung.'); return; }
    if (App.products.length) {
      const ok = await UI.confirm({
        title: 'Sicherung wiederherstellen?',
        html: `<p>Die Daten auf diesem Gerät werden durch die Sicherung vom <strong>${esc(Cloud.when(remote.savedAt))}</strong> (${remote.products.length} ${plural(remote.products.length, 'Produkt', 'Produkte')}) ersetzt.</p>`,
        confirmLabel: 'Wiederherstellen'
      });
      if (!ok) return;
    }
    Cloud.restore(remote);
  },
  'cloud-signout': () => Cloud.signOut(),
  'cloud-delete': () => Cloud.deleteAll(),
  calendar: el => { const p = App.products.find(x => x.id === el.dataset.id); if (p) CalendarExport.ask(p); },
  /** ⋮-Menü der Detailseite: seltene Aktionen. */
  'detail-menu': async el => {
    const p = App.products.find(x => x.id === el.dataset.id);
    if (!p) return;
    const v = await UI.modal({
      title: p.name,
      actions: [
        { label: 'Als PDF speichern', value: 'pdf', kind: 'secondary', icon: 'pdf' },
        { label: 'Duplizieren', value: 'dup', kind: 'secondary', icon: 'copy' },
        { label: 'Löschen', value: 'del', kind: 'danger-soft', icon: 'trash' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (v === 'pdf') PdfReport.run(() => PdfReport.productPdf(p));
    else if (v === 'dup') go('duplicate/' + encodeURIComponent(p.id));
    else if (v === 'del') Actions.delete({ dataset: { id: p.id } });
  },
  'pdf-product': el => { const p = App.products.find(x => x.id === el.dataset.id); if (p) PdfReport.run(() => PdfReport.productPdf(p)); },
  'form-remove-receipt': () => {
    const F = App.form; if (!F || F.busy) return;
    if (F.pending) { if (F.pendingFromDraft) Draft.dropReceipt(); F.pending = null; F.pendingFromDraft = false; } else F.removeExisting = true;
    renderFormReceipt(); Draft.saveNow();
  },
  'form-undo-remove': () => { const F = App.form; if (F) { F.removeExisting = false; renderFormReceipt(); Draft.saveNow(); } },
  theme: el => { Prefs.set('theme', el.dataset.theme); Theme.apply(el.dataset.theme); renderView(); },
  backup: () => Backup.download(true),
  restore: async () => {
    // Eine App darf aus Datenschutzgründen nicht selbst in den Dateien des Handys suchen –
    // deshalb vorher kurz erklären, welche Datei gemeint ist und wo sie meistens liegt.
    const last = Prefs.get('lastBackupFile', null);
    const v = await UI.modal({
      title: 'Backup wiederherstellen',
      html: `<p>Wähle im nächsten Schritt deine Backup-Datei aus.</p>
        <div class="cal-preview"><span class="pt-ico">${ico('file', '')}</span><span><strong>${esc(last || 'belegwaechter-backup-….json')}</strong>
        <span>${last ? 'Dein letztes Backup' : 'So heißen Backup-Dateien'}, meist im Ordner <strong>Download</strong></span></span></div>
        <p class="small muted">Hast du die Datei woanders gespeichert, z. B. in Google Drive, findest du sie dort. Tipp: In der Dateiauswahl oben auf die Suche tippen und „belegwaechter“ eingeben.</p>`,
      actions: [
        { label: 'Datei auswählen', value: 'pick', kind: 'primary', icon: 'upload' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (v === 'pick') Backup.importFlow('Backup wiederherstellen');
  },

  wipe: async () => {
    if (!App.products.length) { UI.toast('Es sind keine Produkte gespeichert.'); return; }
    const n = App.products.length;
    const ok1 = await UI.confirm({ title: 'Alle Daten löschen?', html: `<p>${n} ${plural(n, 'Produkt', 'Produkte')} und alle Rechnungen werden von diesem Gerät gelöscht.</p><p class="muted">Tipp: Erstelle vorher ein Backup.</p>`, confirmLabel: 'Weiter', danger: true });
    if (!ok1) return;
    const ok2 = await UI.confirm({ title: 'Endgültig löschen?', html: '<p>Dieser Schritt kann nicht rückgängig gemacht werden.</p>', confirmLabel: 'Endgültig löschen', danger: true });
    if (!ok2) return;
    try { await Store.replaceAll([], []); await Draft.clear(); await reload(); UI.toast('Alle Daten wurden gelöscht.'); go('dashboard', { replace: true }); }
    catch (e) { UI.toast('Löschen fehlgeschlagen.', 'error'); }
  }
};

const Theme = {
  apply(mode) {
    const root = document.documentElement;
    if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
    requestAnimationFrame(() => {
      const bg = getComputedStyle(document.body).backgroundColor;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta && bg) meta.setAttribute('content', bg);
    });
  }
};

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || !Actions[el.dataset.action]) return;
    e.preventDefault();
    Actions[el.dataset.action](el, e);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'dash-search') { App.dashQuery = t.value; $('#dash-results').innerHTML = dashResults(); return; }
    if (t.id === 'list-search') { App.listState.query = t.value; $('#list-results').innerHTML = listResults(); return; }
    if (t.classList && t.classList.contains('date-proxy')) return; // Kalender: siehe change
    if (t.closest && t.closest('#product-form')) {
      if (t.id === 'f-purchaseDate' || t.id === 'f-customEnd') DateInput.onInput(t, e);
      const k = t.id.replace(/^f-/, '');
      const err = $('#err-' + k);
      if (err && !err.hidden) { err.hidden = true; t.removeAttribute('aria-invalid'); }
      t.classList.remove('autofilled');
      if (t.id === 'f-name' && App.form && !App.form.catTouched) {
        const g = ReceiptParser.typeOf(t.value), sel = $('#f-category');
        if (sel) sel.value = g || 'Sonstiges';
      }
      if (['f-purchaseDate', 'f-duration', 'f-customEnd'].includes(t.id)) updateWarrantyPreview();
      Draft.schedule();
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'list-category') { App.listState.category = t.value; $('#list-results').innerHTML = listResults(); }
    if (t.id === 'list-sort') { App.listState.sort = t.value; $('#list-results').innerHTML = listResults(); }
    if (t.id === 'f-duration') {
      // Beim Wechsel auf "Benutzerdefiniert" das bisher berechnete Ende vorschlagen.
      const ce = $('#f-customEnd');
      if (t.value === 'custom' && !ce.value.trim() && App.form && App.form.lastEnd) DateInput.set('f-customEnd', App.form.lastEnd);
      updateWarrantyPreview();
    }
    if (t.classList && t.classList.contains('date-proxy')) {
      const target = $('#' + t.dataset.for);
      if (target && DateUtil.isValid(t.value)) {
        DateInput.set(target.id, t.value);
        target.classList.remove('autofilled');
        const err = $('#err-' + target.id.replace(/^f-/, '')); if (err) { err.hidden = true; target.removeAttribute('aria-invalid'); }
      }
      updateWarrantyPreview(); Draft.schedule();
      return;
    }
    if (t.id === 'f-purchaseDate' || t.id === 'f-customEnd') updateWarrantyPreview();
    if (t.id === 'f-category' && App.form) { App.form.catTouched = true; t.classList.remove('autofilled'); }
    if (t.closest && t.closest('#product-form')) Draft.schedule();
  });
  // Datumsfelder: beim Verlassen einheitlich formatieren; Kalender mit dem aktuellen Wert öffnen.
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (t && (t.id === 'f-purchaseDate' || t.id === 'f-customEnd')) DateInput.normalize(t);
  });
  const prepProxy = e => {
    const p = e.target && e.target.closest && e.target.closest('.date-proxy');
    if (!p) return;
    const iso = DateInput.get(p.dataset.for);
    p.value = DateUtil.isValid(iso) ? iso : '';
  };
  document.addEventListener('pointerdown', prepProxy, true);
  document.addEventListener('focusin', prepProxy, true);
  document.addEventListener('click', e => {
    const p = e.target && e.target.closest && e.target.closest('.date-proxy');
    if (p && typeof p.showPicker === 'function') { try { p.showPicker(); } catch (err) { /* Gerät öffnet selbst */ } }
  });
  // Bevor Android den Tab in den Hintergrund legt (Kamera, App-Wechsel), Entwurf sofort sichern.
  document.addEventListener('visibilitychange', () => { if (document.hidden && Draft.timer) Draft.saveNow(); });
  window.addEventListener('pagehide', () => { if (Draft.timer) Draft.saveNow(); });
  document.addEventListener('submit', e => {
    if (e.target.id === 'product-form') { e.preventDefault(); saveForm(); }
  });
  // Bottom-Navigation ausblenden, solange die Bildschirmtastatur offen ist.
  const isText = el => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|email|number|tel)$/.test(el.type)));
  document.addEventListener('focusin', e => { if (isText(e.target) && window.innerWidth < 700) document.body.classList.add('kb-open'); });
  document.addEventListener('focusout', () => setTimeout(() => { if (!isText(document.activeElement)) document.body.classList.remove('kb-open'); }, 80));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && Overlay.stack.length) Overlay.closeTop(); });

  window.addEventListener('popstate', () => Overlay.onPopState());
  window.addEventListener('hashchange', () => {
    const h = location.hash, st = App.stack;
    if (st.length > 1 && st[st.length - 2] === h) st.pop(); else st.push(h);
    if (st.length > 60) st.shift();
    render();
  });
  // Tageswechsel (z. B. App über Nacht offen): Anzeige aktualisieren, aber keine offenen Formulare verwerfen.
  const checkDay = () => {
    const t = DateUtil.today();
    if (t === App.today) return;
    App.today = t;
    if (!App.form && !Overlay.stack.length) renderView();
  };
  setInterval(checkDay, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (Prefs.get('theme', 'system') === 'system') Theme.apply('system'); };
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
  }
}

async function boot() {
  Theme.apply(Prefs.get('theme', 'system'));
  bindEvents();
  try {
    await Store.open();
    await reload();
  } catch (e) {
    console.error(e);
    $('#topbar').innerHTML = `<div class="topbar-inner"><div class="brand">${ICON.logo}<span class="brand-name">Beleg<b>wächter</b></span></div></div>`;
    $('#app').innerHTML = `<div class="fatal"><h2>Speichern nicht möglich</h2>
      <p class="muted">Belegwächter kann auf diesem Gerät keine Daten speichern. Das passiert z. B. im privaten Modus oder wenn das Speichern von Website-Daten blockiert ist.</p>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Erneut versuchen</button></div>`;
    return;
  }
  if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', '#/dashboard');
  App.stack = [location.hash];
  render();
  Cloud.init();
  registerServiceWorker();
  TessOCR.probe().then(() => {
    const h = $('#scan-hint'); if (h) h.textContent = TextRecognition.hint();
    if (App.route.view === 'settings') renderView();
  });
}
/** Offline-Betrieb und Hintergrundprüfung für Benachrichtigungen (nur über https://). */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
    if (reg.active) reg.active.postMessage({ type: 'warm-ocr' });
    if (Notify.on()) Notify.sync();
  }).catch(e => console.warn('Service Worker', e));
}
boot();
</script>
