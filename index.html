"ausschließlich im lokalen Speicher der App auf Ihrem Gerät. Ich habe keinen Zugriff auf diese Daten.": "exclusivement dans le stockage local de l’application sur votre appareil. Je n’ai pas accès à ces données.",
"Speicherdauer:": "Durée de conservation :",
"bis Sie die Daten löschen, z. B. einzeln, über „Alle Daten löschen“ in den Einstellungen oder durch Deinstallation der App bzw. Löschen der Website-Daten im Browser.": "jusqu’à ce que vous supprimiez les données, p. ex. individuellement, via « Supprimer toutes les données » dans les paramètres, en désinstallant l’application ou en effaçant les données du site dans le navigateur.",
"Zusätzlich speichert die App einige Einstellungen auf Ihrem Gerät, z. B. das gewählte Farbschema und den Zeitpunkt des letzten Backups. Diese Einstellungen werden ausschließlich lokal auf Ihrem Gerät gespeichert und dienen der Bereitstellung und Personalisierung der von Ihnen gewünschten Funktionen. Cookies werden nicht verwendet.": "L’application enregistre également quelques paramètres sur votre appareil, p. ex. le thème choisi, la langue et la date de la dernière sauvegarde. Ces paramètres sont enregistrés exclusivement en local sur votre appareil et servent à fournir et personnaliser les fonctions que vous demandez. Aucun cookie n’est utilisé.",
"4. Erfassung von Rechnungen (Kamera, Dateien, Texterkennung)": "4. Saisie des factures (appareil photo, fichiers, reconnaissance de texte)",
"Die App greift nur dann auf die Kamera oder auf Dateien zu, wenn Sie selbst eine Rechnung scannen oder hochladen. Für den Zugriff auf die Kamera ist Ihre Erlaubnis im Android-System erforderlich, die Sie jederzeit in den Android-Einstellungen widerrufen können. Beim Scannen wird das Kamerabild ausschließlich auf Ihrem Gerät ausgewertet; gespeichert wird nur das aufgenommene Foto als Rechnung.": "L’application n’accède à l’appareil photo ou aux fichiers que lorsque vous scannez ou importez vous-même une facture. L’accès à l’appareil photo nécessite votre autorisation dans le système Android, que vous pouvez révoquer à tout moment dans les paramètres Android. Lors du scan, l’image de l’appareil photo est analysée exclusivement sur votre appareil ; seule la photo prise est enregistrée comme facture.",
"Die Texterkennung, mit der Angaben aus Rechnungen automatisch eingetragen werden, läuft vollständig auf Ihrem Gerät. Fotos und PDF-Dateien werden dafür nicht übertragen. In der Android-App sind die Programmdateien der Texterkennung (Tesseract) bereits enthalten; dafür wird keine Internetverbindung benötigt. In der Web-Version werden sie beim ersten Gebrauch einmalig vom selben Server geladen wie die App selbst (siehe Abschnitt 7) und anschließend auf Ihrem Gerät zwischengespeichert. In beiden Fällen werden keine anderen Server kontaktiert und keine Nutzungs- oder Diagnosedaten übermittelt.": "La reconnaissance de texte, qui remplit automatiquement les informations des factures, fonctionne entièrement sur votre appareil. Les photos et fichiers PDF ne sont pas transmis à cet effet. Dans l’application Android, les fichiers de la reconnaissance de texte (Tesseract) sont déjà inclus ; aucune connexion Internet n’est nécessaire. Dans la version web, ils sont chargés une seule fois lors de la première utilisation depuis le même serveur que l’application (voir section 7), puis mis en cache sur votre appareil. Dans les deux cas, aucun autre serveur n’est contacté et aucune donnée d’utilisation ou de diagnostic n’est transmise.",
"Fügen Sie Text aus einer anderen App ein, z. B. aus Google Lens, gelten für die dortige Verarbeitung die Datenschutzbestimmungen des jeweiligen Anbieters.": "Si vous collez du texte provenant d’une autre application, p. ex. Google Lens, la politique de confidentialité de ce fournisseur s’applique au traitement qui y est effectué.",
"5. Erinnerungen und Benachrichtigungen": "5. Rappels et notifications",
"Wenn Sie Benachrichtigungen erlauben, erinnert Sie die App vor dem Ende einer Garantie. In der Android-App plant Android diese Erinnerungen auf Ihrem Gerät und prüft dafür etwa zweimal am Tag im Hintergrund die gespeicherten Termine. In der Web-Version übernimmt das Ihr Browser. Dafür werden keine Daten an einen Server gesendet. Sie können die Erlaubnis jederzeit in der App oder in den Einstellungen Ihres Geräts bzw. Browsers widerrufen.": "Si vous autorisez les notifications, l’application vous rappelle la fin d’une garantie. Dans l’application Android, Android planifie ces rappels sur votre appareil et vérifie pour cela environ deux fois par jour en arrière-plan les dates enregistrées. Dans la version web, c’est votre navigateur qui s’en charge. Aucune donnée n’est envoyée à un serveur. Vous pouvez révoquer l’autorisation à tout moment dans l’application ou dans les paramètres de votre appareil ou navigateur.",
"Zusätzlich können Sie einen Termin als Kalenderdatei speichern und in Ihren Kalender übernehmen (siehe Abschnitt 6). Für den Kalender gelten die Bestimmungen des jeweiligen Anbieters.": "Vous pouvez aussi enregistrer une date sous forme de fichier calendrier et l’ajouter à votre calendrier (voir section 6). Les conditions du fournisseur concerné s’appliquent au calendrier.",
"6. Backups, PDF-Export und Kalenderdateien": "6. Sauvegardes, export PDF et fichiers calendrier",
"Backups, PDF-Exporte und Kalenderdateien werden nur auf Ihre Veranlassung erstellt und dort gespeichert, wo Sie es festlegen, in der Regel im Ordner „Download“ Ihres Geräts. Backup-Dateien sind nicht verschlüsselt; wer eine solche Datei besitzt, kann die darin enthaltenen Einträge einsehen. Bitte bewahren Sie diese Dateien daher sorgfältig auf. Speichern Sie Dateien bei einem Cloud-Dienst wie Google Drive oder geben Sie sie an Dritte weiter, gelten die Bestimmungen des jeweiligen Anbieters. Wenn Sie in der Android-App eine Datei teilen oder in einer anderen App öffnen, wird sie nur an die von Ihnen gewählte App übergeben; für die weitere Verarbeitung ist deren Anbieter verantwortlich.": "Les sauvegardes, exports PDF et fichiers calendrier ne sont créés qu’à votre demande et enregistrés à l’endroit que vous choisissez, en général dans le dossier « Download » de votre appareil. Les fichiers de sauvegarde ne sont pas chiffrés ; toute personne qui possède un tel fichier peut consulter les entrées qu’il contient. Conservez donc ces fichiers avec soin. Si vous enregistrez des fichiers dans un service cloud comme Google Drive ou les transmettez à des tiers, les conditions du fournisseur concerné s’appliquent. Si vous partagez un fichier ou l’ouvrez dans une autre application depuis l’application Android, il est uniquement transmis à l’application que vous choisissez ; son fournisseur est responsable du traitement ultérieur.",
"7. Bereitstellung der App (Hosting)": "7. Mise à disposition de l’application (hébergement)",
"Die Android-App enthält alle Dateien, die sie zum Betrieb benötigt, und ruft bei der Nutzung keine Server auf. Dieser Abschnitt betrifft daher nur die Web-Version sowie den Abruf dieser Datenschutzerklärung im Browser.": "L’application Android contient tous les fichiers nécessaires à son fonctionnement et ne contacte aucun serveur pendant l’utilisation. Cette section concerne donc uniquement la version web ainsi que la consultation de cette politique de confidentialité dans le navigateur.",
"Die Dateien der Web-Version werden über GitHub Pages bereitgestellt, einen Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Abruf der App verarbeitet GitHub technisch notwendige Zugriffsdaten, insbesondere Ihre IP-Adresse, Datum und Uhrzeit des Abrufs sowie Angaben zu Browser und Betriebssystem, um die Dateien auszuliefern und die Sicherheit des Dienstes zu gewährleisten. Diese Zugriffsdaten werden mir von GitHub nicht als personenbezogene Nutzerdaten zur Verfügung gestellt; GitHub Pages stellt Seitenbetreibern keine Zugriffsprotokolle oder Besucherstatistiken bereit.": "Les fichiers de la version web sont fournis via GitHub Pages, un service de GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis. Lors de l’accès à l’application, GitHub traite les données d’accès techniquement nécessaires, notamment votre adresse IP, la date et l’heure de l’accès ainsi que des informations sur le navigateur et le système d’exploitation, afin de livrer les fichiers et d’assurer la sécurité du service. GitHub ne me met pas ces données d’accès à disposition en tant que données personnelles d’utilisateurs ; GitHub Pages ne fournit aux exploitants de sites ni journaux d’accès ni statistiques de visiteurs.",
"Rechtsgrundlage ist mein berechtigtes Interesse an einer sicheren und zuverlässigen Bereitstellung der App (Art. 6 Abs. 1 lit. f DSGVO). Dabei können Daten in die USA übermittelt werden. GitHub stützt solche Übermittlungen nach eigenen Angaben auf das EU-US Data Privacy Framework sowie auf Standardvertragsklauseln der Europäischen Kommission. Weitere Informationen finden Sie in der": "La base juridique est mon intérêt légitime à fournir l’application de manière sûre et fiable (art. 6, par. 1, point f du RGPD). Des données peuvent être transférées vers les États-Unis. Selon ses propres indications, GitHub fonde ces transferts sur le EU-US Data Privacy Framework ainsi que sur les clauses contractuelles types de la Commission européenne. Pour plus d’informations, consultez la",
"Datenschutzerklärung von GitHub": "Déclaration de confidentialité de GitHub",
"8. Google Play": "8. Google Play",
"Wenn Sie die App über Google Play installieren, verarbeitet Google dabei Daten in eigener Verantwortung, z. B. für Download, Aktualisierungen und gegebenenfalls Zahlungen. Über die Google Play Console stellt Google mir zusammengefasste und technische Informationen zu meiner App zur Verfügung, beispielsweise Installationszahlen und technische Stabilitätsdaten wie Absturz- und ANR-Daten. Diese Daten enthalten keine Inhalte Ihrer in der App gespeicherten Einträge. Eigene Analyse-, Tracking- oder Absturzdienste (z. B. Google Analytics oder Firebase Crashlytics) sind in der App nicht eingebunden. Weitere Informationen finden Sie in der": "Si vous installez l’application via Google Play, Google traite des données sous sa propre responsabilité, p. ex. pour le téléchargement, les mises à jour et, le cas échéant, les paiements. Via la Google Play Console, Google me fournit des informations agrégées et techniques sur mon application, par exemple le nombre d’installations et des données techniques de stabilité comme les plantages et les ANR. Ces données ne contiennent aucun contenu de vos entrées enregistrées dans l’application. Aucun service propre d’analyse, de suivi ou de rapport de plantage (p. ex. Google Analytics ou Firebase Crashlytics) n’est intégré à l’application. Pour plus d’informations, consultez les",
"Datenschutzerklärung von Google": "Règles de confidentialité de Google",
"9. Kontaktaufnahme per E-Mail": "9. Contact par e-mail",
"Wenn Sie mich per E-Mail kontaktieren, verarbeite ich Ihre E-Mail-Adresse und den Inhalt Ihrer Nachricht, um Ihre Anfrage zu bearbeiten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, soweit Ihre Anfrage die Nutzung der App betrifft, im Übrigen mein berechtigtes Interesse an der Beantwortung von Anfragen (Art. 6 Abs. 1 lit. f DSGVO). Ihre Nachricht wird gelöscht, sobald die Anfrage abschließend bearbeitet ist und keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Das E-Mail-Postfach wird von Google (Gmail) bereitgestellt.": "Si vous me contactez par e-mail, je traite votre adresse e-mail et le contenu de votre message afin de répondre à votre demande. La base juridique est l’art. 6, par. 1, point b du RGPD si votre demande concerne l’utilisation de l’application, sinon mon intérêt légitime à répondre aux demandes (art. 6, par. 1, point f du RGPD). Votre message est supprimé dès que la demande est entièrement traitée et qu’aucune obligation légale de conservation ne s’y oppose. La boîte e-mail est fournie par Google (Gmail).",
"10. Empfänger, automatisierte Entscheidungen und Datensicherheit": "10. Destinataires, décisions automatisées et sécurité des données",
"Über die in dieser Erklärung genannten Dienstleister hinaus werden keine personenbezogenen Daten an Dritte weitergegeben oder verkauft. Eine automatisierte Entscheidungsfindung einschließlich Profiling (Art. 22 DSGVO) findet nicht statt.": "Au-delà des prestataires mentionnés dans cette politique, aucune donnée personnelle n’est transmise ni vendue à des tiers. Il n’y a pas de prise de décision automatisée, y compris de profilage (art. 22 du RGPD).",

const Receipts = {
  /**
   * Prüft eine gewählte Datei und liest sie vollständig ein.
   * Große Fotos werden auf max. 2400 px (JPEG) verkleinert – die Rechnung bleibt gut lesbar,
   * belegt aber deutlich weniger Speicher und macht Backups kleiner.
   */
  async prepare(file) {
    if (!file) throw new UserError('Keine Datei ausgewählt.');
    const name0 = file.name || 'Rechnung';
    let type = (file.type || '').toLowerCase();
    if (!type) {
      const ext = (name0.split('.').pop() || '').toLowerCase();
      type = ext === 'pdf' ? 'application/pdf' : ext === 'png' ? 'image/png' : (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : '';
    }
    if (type === 'image/jpg') type = 'image/jpeg';
    const isImage = type.startsWith('image/');
    if (!RECEIPT_TYPES.includes(type) && !isImage) throw new UserError('Dieses Dateiformat wird nicht unterstützt. Bitte wähle JPG, PNG oder PDF.');
    if (file.size === 0) throw new UserError('Die Datei ist leer.');
    if (file.size > MAX_RECEIPT_BYTES) throw new UserError('Die Datei ist zu groß (maximal 25 MB).');

    let blob = new Blob([await file.arrayBuffer()], { type });
    let name = name0;
    const mustConvert = isImage && !RECEIPT_TYPES.includes(type); // z. B. WebP/HEIC von manchen Kameras
    if (isImage && (mustConvert || blob.size > COMPRESS_THRESHOLD)) {
      try {
        const out = await Receipts.compress(blob);
        if (out && (mustConvert || out.size < blob.size)) {
          blob = out; type = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg';
        }
      } catch (e) { /* Original behalten, falls unterstützt */ }
    }
    if (!RECEIPT_TYPES.includes(type)) throw new UserError('Dieses Bildformat kann nicht gelesen werden. Bitte wähle JPG, PNG oder PDF.');
    if (!/\.[a-z0-9]{2,4}$/i.test(name)) name += type === 'application/pdf' ? '.pdf' : type === 'image/png' ? '.png' : '.jpg';
    return { blob, name, type, size: blob.size };
  },
  compress(blob, maxDim = 2400, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('toBlob')); }, 'image/jpeg', quality);
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild nicht lesbar')); };
      img.src = url;
    });
  },
  blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  },
  dataURLToBlob(dataUrl) {
    const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(dataUrl);
    if (!m) throw new Error('Ungültige Dateidaten');
    const type = m[1] || 'application/octet-stream';
    if (!m[2]) return new Blob([decodeURIComponent(m[3])], { type });
    const bin = atob(m[3]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }
};

/**
 * Dateiformat (JSON):
 *   { app: "Belegwächter", kind: "backup" | "export", version: 1, createdAt, products: [...], receipts: [...] }
 *   - export: nur Produktdaten, ohne Rechnungsdateien (klein, gut lesbar)

 * Beide Dateien können über "Importieren" und "Backup wiederherstellen" eingelesen werden.

/**
 * Nur zum Öffnen älterer, mit Passwort geschützter Backups (Versionen vor 2.7.1).
 * Neue Backups werden ohne Verschlüsselung erstellt.
 * Format alter Dateien: PBKDF2-SHA-256 → AES-256-GCM (Web Crypto, offline).
 */
/**
 * Backups älterer Versionen, die mit Passwort verschlüsselt wurden (PBKDF2-SHA-256 + AES-256-GCM),
 * können weiterhin geöffnet werden. Neue Backups werden nicht verschlüsselt.
 */
const LegacyBackup = {
  available() { return !!(window.isSecureContext !== false && window.crypto && crypto.subtle); },
  isEncrypted(obj) { return !!(obj && typeof obj === 'object' && APP_IDS.includes(obj.app) && obj.kind === 'backup-encrypted'); },
  fromB64(str) {
    const bin = atob(str), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  async decrypt(obj, password) {
    if (!LegacyBackup.available()) throw new UserError('Passwortgeschützte Backups können auf diesem Gerät nicht geöffnet werden.');
    const k = obj.kdf || {}, iterations = Number(k.iterations);
    if (obj.cipher !== 'AES-256-GCM' || k.name !== 'PBKDF2' || k.hash !== 'SHA-256' || !Number.isInteger(iterations) || iterations < 100000 || iterations > 10000000
        || typeof k.salt !== 'string' || typeof obj.iv !== 'string' || typeof obj.data !== 'string') {
      throw new UserError('Die Backup-Datei ist beschädigt.');
    }
    let salt, iv, data;
    try { salt = LegacyBackup.fromB64(k.salt); iv = LegacyBackup.fromB64(obj.iv); data = LegacyBackup.fromB64(obj.data); }
    catch (e) { throw new UserError('Die Backup-Datei ist beschädigt.'); }
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data); }
    catch (e) { throw new UserError('Falsches Passwort oder beschädigte Datei.'); }
    return new TextDecoder().decode(plain);
  }
};

const Backup = {
  FORMAT_VERSION: 2,
  /** SHA-256 über Produkte und Rechnungen – erkennt beim Wiederherstellen beschädigte oder unvollständige Dateien. */
  async checksum(products, receipts) {
    if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify({ products, receipts })));
    return 'sha256:' + Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  },
  NAMES: { de: ['belegwaechter-backup', 'belegwaechter-export'], en: ['receipt-warden-backup', 'receipt-warden-export'], fr: ['gardien-des-recus-sauvegarde', 'gardien-des-recus-export'], es: ['guardian-de-recibos-copia', 'guardian-de-recibos-exportacion'] },
  prefix(i) { return (Backup.NAMES[I18N.lang] || Backup.NAMES.de)[i]; },
  fileName(date = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `${Backup.prefix(0)}-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}-${p(date.getHours())}${p(date.getMinutes())}.json`;
  },
  async build(withReceipts) {
    const products = App.products.map(p => ({ ...p, receipt: withReceipts ? p.receipt : null }));
    const out = { app: APP_NAME, kind: withReceipts ? 'backup' : 'export', version: Backup.FORMAT_VERSION, appVersion: APP_VERSION, createdAt: new Date().toISOString(), counts: null, checksum: null, products, receipts: [] };
    if (withReceipts) {
      const used = new Set(products.filter(p => p.receipt).map(p => p.receipt.id));
      for (const r of await Store.getAllReceipts()) {
        if (!r.blob || !used.has(r.id)) continue;
        out.receipts.push({ id: r.id, productId: r.productId, name: r.name, type: r.type, size: r.size, addedAt: r.addedAt, dataUrl: await Receipts.blobToDataURL(r.blob) });
      }
    }
    out.counts = { products: out.products.length, receipts: out.receipts.length };
    out.checksum = await Backup.checksum(out.products, out.receipts);
    return out;
  },
  async download(withReceipts) {
    if (!App.products.length) { UI.toast('Es sind noch keine Produkte gespeichert.'); return; }
    UI.toast(withReceipts ? 'Backup wird erstellt …' : 'Export wird erstellt …');
    try {
      const data = await Backup.build(withReceipts);
      const blob = new Blob([JSON.stringify(data, null, withReceipts ? 0 : 2)], { type: 'application/json' });
      const file = withReceipts ? Backup.fileName() : Backup.prefix(1) + '-' + App.today + '.json';
      downloadBlob(blob, file);
      if (withReceipts) { Prefs.set('lastBackup', data.createdAt); Prefs.set('lastBackupFile', file); Prefs.set('lastBackupCount', data.counts.products); }
      UI.toast(withReceipts ? `Backup gespeichert: ${file}` : 'Export heruntergeladen', 'info', withReceipts ? 5000 : 0);
      if (App.route.view === 'settings') renderView();
    } catch (e) {
      console.error(e);
      UI.toast('Die Datei konnte nicht erstellt werden.', 'error');
    }
  },
  /** Liest und prüft eine Importdatei. Fehlerhafte Einträge werden gezählt und übersprungen. */
  /** Prüft Prüfsumme (ab Format 2) und Mengenangaben. */
  async verify(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data) || !data.checksum) return;
    const sum = await Backup.checksum(data.products, data.receipts || []);
    if (sum && sum !== data.checksum) throw new UserError('Die Backup-Datei ist beschädigt oder unvollständig. Bitte verwende eine andere Sicherung.');
  },
  parse(input) {
    let data = input;
    if (typeof input === 'string') {
      try { data = JSON.parse(input); } catch (e) { throw new UserError('Diese Datei kann nicht gelesen werden.'); }
    }
    if (LegacyBackup.isEncrypted(data)) throw new UserError('Das Backup ist verschlüsselt.');
    const isObj = data && typeof data === 'object' && !Array.isArray(data);
    if (isObj && data.app && !APP_IDS.includes(data.app)) throw new UserError('Die Datei stammt nicht von Belegwächter.');
    const arr = Array.isArray(data) ? data : (isObj && Array.isArray(data.products) ? data.products : null);
    if (!arr) throw new UserError('Die Datei enthält keine Belegwächter-Daten.');
    const recMap = new Map();
    for (const r of (isObj && Array.isArray(data.receipts) ? data.receipts : [])) {
      if (!r || typeof r.id !== 'string' || typeof r.dataUrl !== 'string') continue;
      try {
        const b = Receipts.dataURLToBlob(r.dataUrl);
        const type = RECEIPT_TYPES.includes(b.type) ? b.type : RECEIPT_TYPES.includes(r.type) ? r.type : null;
        if (!type || !b.size) continue;
        recMap.set(r.id, {
          id: r.id, name: typeof r.name === 'string' && r.name ? r.name.slice(0, 200) : 'Rechnung', type, size: b.size,
          addedAt: typeof r.addedAt === 'string' ? r.addedAt : new Date().toISOString(),
          blob: b.type === type ? b : new Blob([b], { type })
        });
      } catch (e) { /* defekte Datei überspringen */ }
    }
    const products = [], receipts = [];
    let skipped = 0;
    for (const raw of arr) {
      const p = sanitizeProduct(raw);
      if (!p) { skipped++; continue; }
      const rec = p.receipt && recMap.get(p.receipt.id);
      if (rec) {
        p.receipt = { id: rec.id, name: rec.name, type: rec.type, size: rec.size, addedAt: rec.addedAt };
        receipts.push({ ...rec, productId: p.id });
        recMap.delete(rec.id);
      } else p.receipt = null;
      products.push(p);
    }
    const meta = isObj ? { createdAt: typeof data.createdAt === 'string' ? data.createdAt : null, appVersion: typeof data.appVersion === 'string' ? data.appVersion : null } : {};
    return { products, receipts, skipped, meta };
  },
  /** Übernimmt geprüfte Daten. "add" überspringt identische Einträge und vergibt bei Kollisionen neue IDs. */
  async apply(parsed, mode) {
    if (mode === 'replace') {
      await Store.replaceAll(parsed.products, parsed.receipts);
      return { added: parsed.products.length, dup: 0 };
    }
    const existing = new Map(App.products.map(p => [p.id, p]));
    const recById = new Map(parsed.receipts.map(r => [r.id, r]));
    const prods = [], recs = [];
    let dup = 0;
    for (const p of parsed.products) {
      const ex = existing.get(p.id);
      if (ex && ex.updatedAt === p.updatedAt && ex.name === p.name) { dup++; continue; }
      const np = { ...p, id: ex ? newId() : p.id };
      const rec = p.receipt && recById.get(p.receipt.id);
      if (rec) {
        const rid = newId();
        recs.push({ ...rec, id: rid, productId: np.id });
        np.receipt = { ...p.receipt, id: rid };
      } else np.receipt = null;
      prods.push(np);
    }
    if (prods.length) await Store.addMany(prods, recs);
    return { added: prods.length, dup };
  },
  /** Ablauf: Datei wählen → prüfen → Warnung mit Auswahl (ersetzen / hinzufügen) → übernehmen. */
  async importFlow(title) {
    const file = await Picker.pick('json');
    if (file) await Backup.importFile(title, file);
  },
  async importFile(title, file) {
    let parsed;
    try {
      const text = file.text ? await file.text() : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
      let obj;
      try { obj = JSON.parse(text); } catch (e) { throw new UserError('Diese Datei kann nicht gelesen werden.'); }
      if (LegacyBackup.isEncrypted(obj)) {
        if (!LegacyBackup.available()) throw new UserError('Verschlüsselte Backups können auf diesem Gerät nicht geöffnet werden.');
        const res = await UI.modal({
          title: 'Passwortgeschütztes Backup',
          html: `<p>Dieses Backup wurde mit einer älteren Version mit Passwort gesichert. Gib das Passwort ein, um es zu öffnen.</p>
            <div class="field"><label for="bk-pw">Passwort</label><input class="input" id="bk-pw" type="password" autocomplete="current-password"></div>`,
          actions: [
            { label: 'Entschlüsseln', value: 'ok', kind: 'primary', busy: 'Wird entschlüsselt …' },
            { label: 'Abbrechen', value: null, kind: 'ghost' }
          ],
          check: async (value, el) => {
            const pw = el.querySelector('#bk-pw').value;
            if (!pw) return { error: 'Bitte gib das Passwort ein.' };
            const plain = await LegacyBackup.decrypt(obj, pw);
            try { return { data: JSON.parse(plain) }; } catch (e) { return { error: 'Der entschlüsselte Inhalt ist beschädigt.' }; }
          }
        });
        if (!res.value) return;
        obj = res.data;
      }
      await Backup.verify(obj);
      parsed = Backup.parse(obj);
    } catch (e) {
      UI.toast(e instanceof UserError ? e.message : 'Die Datei konnte nicht gelesen werden.', 'error');
      return;
    }
    await Backup.importParsed(title, parsed);
  },
  async importParsed(title, parsed) {
    if (!parsed.products.length) { UI.toast('In der Datei wurden keine gültigen Produkte gefunden.', 'error'); return; }
    const n = parsed.products.length, r = parsed.receipts.length;
    const choice = await UI.modal({
      title,
      html: `<div class="notice notice-warn">Der Import kann vorhandene Daten überschreiben.</div>
        ${parsed.meta && parsed.meta.createdAt && !isNaN(new Date(parsed.meta.createdAt)) ? `<p class="small muted">Sicherung vom ${esc(new Date(parsed.meta.createdAt).toLocaleString(I18N.locale, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }))} Uhr</p>` : ''}
        <p>Gefunden: <strong>${n} ${plural(n, 'Produkt', 'Produkte')}</strong>${r ? ` und <strong>${r} ${plural(r, 'Rechnung', 'Rechnungen')}</strong>` : ', keine Rechnungsdateien'}.${parsed.skipped ? ` ${parsed.skipped} fehlerhafte ${plural(parsed.skipped, 'Eintrag wird', 'Einträge werden')} übersprungen.` : ''}</p>
        <p class="small"><strong>Ersetzen:</strong> Deine aktuellen Daten werden gelöscht und durch die Datei ersetzt.</p>
        <p class="small"><strong>Hinzufügen:</strong> Die Einträge aus der Datei kommen dazu, doppelte werden übersprungen.</p>`,
      actions: [
        { label: 'Daten hinzufügen', value: 'add', kind: 'primary' },
        { label: 'Daten ersetzen', value: 'replace', kind: 'danger-soft' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (!choice) return;
    if (choice === 'replace' && App.products.length) {
      const ok = await UI.confirm({
        title: 'Vorhandene Daten ersetzen?',
        html: `<p>${App.products.length} ${plural(App.products.length, 'gespeichertes Produkt wird', 'gespeicherte Produkte werden')} mit allen Rechnungen gelöscht.</p><p class="muted">Das kann nicht rückgängig gemacht werden.</p>`,
        confirmLabel: 'Daten ersetzen', danger: true
      });
      if (!ok) return;
    }
    try {
      const res = await Backup.apply(parsed, choice);
      await reload();
      requestPersistOnce();
      let msg = choice === 'replace' ? `${res.added} ${plural(res.added, 'Produkt', 'Produkte')} wiederhergestellt` : `${res.added} ${plural(res.added, 'Produkt', 'Produkte')} hinzugefügt`;
      if (res.dup) msg += `, ${res.dup} bereits vorhanden`;
      UI.toast(msg);
      go('dashboard', { replace: App.route.view === 'dashboard' });
    } catch (e) {
      console.error(e);
      UI.toast(storageErrorMessage(e) + ' Es wurden keine Daten geändert.', 'error');
    }
  }
};

/** Android-App: Dateien in einer anderen App öffnen oder teilen (über AndroidBridge). */
const NativeFile = {
  can(fn) { return !!(window.AndroidBridge && typeof AndroidBridge[fn] === 'function'); },
  b64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1] || '');
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  },
  async open(blob, name) {
    try { AndroidBridge.openBase64(name, await NativeFile.b64(blob), blob.type || ''); }
    catch (e) { UI.toast('Die Datei konnte nicht geöffnet werden.', 'error'); }
  },
  async share(blob, name) {
    try { AndroidBridge.shareBase64(name, await NativeFile.b64(blob), blob.type || ''); }
    catch (e) { UI.toast('Teilen ist nicht möglich.', 'error'); }
  }
};

function downloadBlob(blob, filename) {
  if (window.AndroidBridge && typeof AndroidBridge.saveBase64 === 'function') {
    const r = new FileReader();
    r.onload = () => AndroidBridge.saveBase64(filename, String(r.result).split(',')[1] || '');
    r.onerror = () => UI.toast('Speichern nicht möglich', 'error');
    r.readAsDataURL(blob);
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/**
 * ReminderBridge – Schnittstelle für echte Android-Benachrichtigungen (später).
 *
 * Was eine reine HTML-Datei NICHT kann: Benachrichtigungen zu einem Zeitpunkt planen, an dem die App
 * geschlossen ist. Dafür bräuchte es einen Service Worker plus Push-Server (widerspricht "kein Server")
 * oder eine native Schicht. In Android-Chrome ist zudem `new Notification()` nicht erlaubt.
 * Deshalb zeigt Belegwächter fällige Erinnerungen beim Öffnen der App an (Dashboard).
 *
 * Für echte Notifications später:
 *   - WebView-Wrapper (empfohlen für diesen Fall): In Kotlin ein Objekt per
 *     webView.addJavascriptInterface(obj, "GarantieBoxNative") registrieren, das die Methode
 *     scheduleReminders(json: String) bereitstellt und die Termine mit WorkManager/AlarmManager +
 *     NotificationManager plant (bei jedem Aufruf alte Termine verwerfen und neu anlegen).
 *   - TWA (Trusted Web Activity): bietet keine JavaScript-Bridge. Geplante lokale Notifications wären nur
 *     über zusätzliche native Komponenten oder Web Push mit eigenem Server möglich.
 *
 * Diese Funktion ruft die native Methode NUR auf, wenn sie wirklich existiert. Ohne native Schicht passiert nichts.
 * Übergabeformat: [{ productId, name, warrantyEnd, daysBefore, date }]
 */
const ReminderBridge = {
  target() {
    if (window.AndroidBridge && typeof AndroidBridge.scheduleReminders === 'function') return AndroidBridge;
    if (window.GarantieBoxNative && typeof window.GarantieBoxNative.scheduleReminders === 'function') return window.GarantieBoxNative;
    return null;
  },
  available() { return !!ReminderBridge.target(); },
  sync(products, today) {
    const t = ReminderBridge.target();
    if (!t) return false;
    const payload = [];
    // In der Android-App nur planen, wenn Benachrichtigungen eingeschaltet sind (sonst leere Liste = alles abbestellen)
    if (t !== window.AndroidBridge || Notify.on()) {
      products.forEach(p => Reminders.schedule(p, today).forEach(s =>
        payload.push({ productId: p.id, name: p.name, warrantyEnd: p.warrantyEnd, daysBefore: s.daysBefore, date: s.date, endText: DateUtil.format(p.warrantyEnd), tToday: tx('Die Garantie endet heute.'), tTomorrow: tx('Die Garantie endet morgen ({date}).'), tDays: tx('Die Garantie endet in {n} Tagen ({date}).'), lang: I18N.lang })));
    }
    try { t.scheduleReminders(JSON.stringify(payload)); return true; }
    catch (e) { console.warn('ReminderBridge', e); return false; }
  }
};

/* ===================== 6b. RECHNUNG SCANNEN ===================== */
/**
 * Liest die Textebene digitaler PDF-Rechnungen (z. B. per E-Mail erhaltene Rechnungen) – ohne externe Bibliothek.
 * Unterstützt: FlateDecode/ASCIIHex/ASCII85, Objekt-Streams, ToUnicode-CMaps, WinAnsi/MacRoman/Differences,
 * Type0-Schriften (2-Byte-Codes), Form-XObjects, Text-/Grafikmatrix für die Zeilenreihenfolge.
 * Nicht unterstützt: verschlüsselte PDFs, eingescannte PDFs ohne Textebene (das sind nur Bilder).
 * Das Ergebnis ist Text Zeile für Zeile, für die anschließende Auswertung durch ReceiptParser.
 */
const PdfText = {
  bin(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return s; },
  binToBytes(s) { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; },

  async inflate(bytes, raw) {
    const ds = new DecompressionStream(raw ? 'deflate-raw' : 'deflate');
    const w = ds.writable.getWriter();
    w.write(bytes).catch(() => {}); w.close().catch(() => {});
    const r = ds.readable.getReader(), chunks = [];
    let total = 0;
    try { for (;;) { const { done, value } = await r.read(); if (done) break; chunks.push(value); total += value.length; if (total > 60e6) break; } }
    catch (e) { if (!total) throw e; } // abgeschnittene Streams: bisher Gelesenes behalten
    const out = new Uint8Array(total); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  },
  asciiHex(u8) {
    const s = PdfText.bin(u8).replace(/[^0-9a-f>]/gi, '');
    const h = s.split('>')[0], out = new Uint8Array(Math.ceil(h.length / 2));
    for (let i = 0; i < out.length; i++) out[i] = parseInt((h.substr(i * 2, 2) + '0').slice(0, 2), 16);
    return out;
  },
  ascii85(u8) {
    let s = PdfText.bin(u8).replace(/\s/g, ''); if (s.startsWith('<~')) s = s.slice(2);
    const end = s.indexOf('~>'); if (end >= 0) s = s.slice(0, end);
    const out = []; let grp = [];
    for (const ch of s) {
      if (ch === 'z' && !grp.length) { out.push(0, 0, 0, 0); continue; }
      grp.push(ch.charCodeAt(0) - 33);
      if (grp.length === 5) { let v = 0; for (const g of grp) v = v * 85 + g; out.push(v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255); grp = []; }
    }
    if (grp.length) { const n = grp.length; while (grp.length < 5) grp.push(84); let v = 0; for (const g of grp) v = v * 85 + g; const b = [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255]; out.push(...b.slice(0, n - 1)); }
    return new Uint8Array(out);
  },

  /* ---------- Objekt-Parser ---------- */
  WS: /[\x00\t\n\f\r ]/,
  DELIM: /[()<>\[\]{}\/%\x00\t\n\f\r ]/,
  skipWs(s, i) {
    for (;;) {
      while (i < s.length && PdfText.WS.test(s[i])) i++;
      if (s[i] === '%') { while (i < s.length && s[i] !== '\n' && s[i] !== '\r') i++; continue; }
      return i;
    }
  },
  /** Liest einen Wert ab Position i. Rückgabe [wert, neuePosition]. */
  parse(s, i) {
    i = PdfText.skipWs(s, i);
    const c = s[i];
    if (c === '<' && s[i + 1] === '<') {
      i += 2; const d = { t: 'd', v: Object.create(null) };
      for (;;) {
        i = PdfText.skipWs(s, i);
        if (i >= s.length) return [d, i];
        if (s[i] === '>' && s[i + 1] === '>') return [d, i + 2];
        const [k, j] = PdfText.parse(s, i);
        if (!k || k.n === undefined) { i = j > i ? j : i + 1; continue; }
        const [v, j2] = PdfText.parse(s, j);
        d.v[k.n] = v; i = j2;
      }
    }
    if (c === '<') {
      const e = s.indexOf('>', i); const h = s.slice(i + 1, e < 0 ? s.length : e).replace(/[^0-9a-f]/gi, '');
      let out = ''; for (let k = 0; k < h.length; k += 2) out += String.fromCharCode(parseInt((h.substr(k, 2) + '0').slice(0, 2), 16));
      return [{ s: out }, e < 0 ? s.length : e + 1];
    }
    if (c === '(') {
      let depth = 1, out = ''; i++;
      while (i < s.length && depth) {
        const ch = s[i];
        if (ch === '\\') {
          const n = s[i + 1];
          const map = { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', '(': '(', ')': ')', '\\': '\\' };
          if (n in map) { out += map[n]; i += 2; }
          else if (/[0-7]/.test(n)) { let o = ''; let k = i + 1; while (k < i + 4 && /[0-7]/.test(s[k])) o += s[k++]; out += String.fromCharCode(parseInt(o, 8) & 255); i = k; }
          else if (n === '\r') { i += s[i + 2] === '\n' ? 3 : 2; }
          else if (n === '\n') { i += 2; }
          else { i += 1; }
          continue;
        }
        if (ch === '(') depth++;
        else if (ch === ')') { depth--; if (!depth) { i++; break; } }
        out += ch; i++;
      }
      return [{ s: out }, i];
    }
    if (c === '[') {
      const a = []; i++;
      for (;;) {
        i = PdfText.skipWs(s, i);
        if (i >= s.length) return [a, i];
        if (s[i] === ']') return [a, i + 1];
        const [v, j] = PdfText.parse(s, i);
        if (j <= i) { i++; continue; }
        a.push(v); i = j;
      }
    }
    if (c === '/') {
      let j = i + 1; while (j < s.length && !PdfText.DELIM.test(s[j])) j++;
      return [{ n: s.slice(i + 1, j).replace(/#([0-9a-f]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16))) }, j];
    }
    const num = /^[+-]?(\d+\.?\d*|\.\d+)/.exec(s.slice(i, i + 32));
    if (num) {
      const j = i + num[0].length;
      // Referenz "12 0 R"
      const ref = /^\s+(\d+)\s+R(?![A-Za-z])/.exec(s.slice(j, j + 24));
      if (ref && /^\d+$/.test(num[0])) return [{ r: +num[0] }, j + ref[0].length];
      return [parseFloat(num[0]), j];
    }
    let j = i; while (j < s.length && !PdfText.DELIM.test(s[j])) j++;
    if (j === i) return [null, i + 1];
    const w = s.slice(i, j);
    if (w === 'true') return [true, j]; if (w === 'false') return [false, j]; if (w === 'null') return [null, j];
    return [{ op: w }, j];
  },

  /* ---------- Dokument laden ---------- */
  async load(u8) {
    const s = PdfText.bin(u8);
    if (!/^%PDF-/.test(s.slice(0, 1024).trimStart()) && s.indexOf('%PDF-') < 0) throw new UserError('Die Datei ist keine gültige PDF.');
    const objs = new Map();
    const re = /(\d+)\s+(\d+)\s+obj\b/g;
    let m;
    while ((m = re.exec(s))) {
      let [v, i] = PdfText.parse(s, m.index + m[0].length);
      const o = { v, raw: null };
      i = PdfText.skipWs(s, i);
      if (s.startsWith('stream', i)) {
        let ds = i + 6; if (s[ds] === '\r') ds++; if (s[ds] === '\n') ds++;
        let len = v && v.t === 'd' ? v.v.Length : null;

  findModel(text) {
    const m = /(?:modell(?:nummer|-?nr\.?|bezeichnung)?|model(?:\s*(?:no\.?|number))?|r[ée]f[ée]rence|mod[èe]le|modelo|typ(?:e)?(?:nummer)?)\s*[:#]\s*([A-Z0-9][A-Z0-9\-\/.]{3,39})/i.exec(text);
    return m ? m[1].toUpperCase().replace(/[.\-\/]+$/, '') : null;
  },
  isModelToken(t) {
    if (/^[A-HJ-NPR-Z0-9]{17}$/i.test(t) && /\d/.test(t) && /[a-z]/i.test(t)) return false; // FIN gehört zur Seriennummer
    return t.length >= 6 && t.length <= 24 && /^[A-Z0-9][A-Z0-9\-\/]*$/i.test(t) && (t.match(/\d/g) || []).length >= 2
      && (t.match(/[A-Z]/gi) || []).length >= 2 && !/^\d+(gb|tb|mb|mah|wh|kw|w|v|l|kg|cm|mm|zoll|hz|u\/min|upm)$/i.test(t)
      && !/^\d{6,}$/.test(t);
  },

  /* ---------- Produktname ---------- */
  NOT_PRODUCT: /facture|ticket|caisse|\bcaja\b|factura|merci|gracias|cantidad|quantit[eé]|\bprix\b|precio|fecha|\bdate\b|montant|importe|\btva\b|\biva\b|magasin|tienda|\bqty\b|quantity|\bitem\b|invoice|receipt|subtotal|sales tax|serial|warranty|thank you|summe|gesamt|total|betrag|mwst|m\.w\.st|\bust\b|steuer|netto|brutto|rabatt|datum|uhrzeit|\bzeit\b|kasse|\bbon\b|beleg|filiale|markt\s*-?nr|\bstr(\.|a[ßs]e)|stra[ßs]e|platz\b|\btel\b|tel\.|telefon|fax|www\.|http|e-?mail|@|steuer-?nr|ust-?id|hrb\b|amtsgericht|gesch[äa]ftsf[üu]hr|iban|\bbic\b|\bbank\b|kunde|kundennr|rechnung|lieferschein|seite\s+\d|vielen\s+dank|danke|[öo]ffnungszeiten|zahlung|ec-?karte|girocard|visa|mastercard|terminal|trace|genehmigung|autorisierung|karten-?nr|gegeben|r[üu]ckgeld|posten|\bmenge\b|bezeichnung|einzelpreis|\bpos\.?\b|garantie|gewährleistung|gewaehrleistung|umtausch|r[üu]ckgabe|pfand|versand|lieferung|seriennummer|\bs\/n\b|imei|\bean\b|artikel-?nr|art\.?-?nr|bestell|auftrag|verk[äa]ufer|bedient|mitarbeiter|\bmo\b.*\bsa\b|\bmontag|kopie|original|\bbar\b|coupon|payback|\bsteuer|\bid\b|nummer|nr\.\s*\d/i,
  BRAND_RE: null,
  brandRe() {
    if (!ReceiptParser.BRAND_RE) {
      const alt = ReceiptParser.BRANDS.map(b => b.replace(/[.*+?^${}()|[\]\\']/g, m => m === "'" ? "['’]?" : '\\' + m)).join('|');
      ReceiptParser.BRAND_RE = new RegExp('(?:^|[^a-zäöü])(' + alt + ')(?![a-zäöü])', 'i');
    }
    return ReceiptParser.BRAND_RE;
  },
  typeOf(text) { for (const [cat, re] of ReceiptParser.CATEGORY_RULES) if (re.test(text)) return cat; return null; },
  /** Großbuchstaben-Zeilen (typisch für Kassenbons) lesbar machen, Modellnummern und Abkürzungen bleiben. */
  prettify(name) {
    const letters = name.replace(/[^a-zäöüß]/gi, '');
    const upper = letters.replace(/[^A-ZÄÖÜ]/g, '').length;
    const brands = new Map(ReceiptParser.BRANDS.map(b => [b.toUpperCase(), b]));
    if (!letters.length || upper / letters.length < 0.7) return name.split(' ').map(w => brands.get(w.toUpperCase()) || w).join(' ');
    const keep = /^(LG|HP|AEG|JBL|TV|USB|LED|OLED|QLED|SSD|HDD|WLAN|WIFI|XL|XXL|UHD|HD|PC|MSI|AVM|TCL|WMF|GPS|NFC|DAB|CD|DVD|AI|LTE|5G|4G|4K|8K|RGB|HDMI|IPS|AMD|DECT|MP3|DSLR|ANC|ASUS|BOSE|SMEG)$/;
    return name.split(' ').map(w => {
      if (brands.has(w.toUpperCase())) return brands.get(w.toUpperCase());
      if (keep.test(w) || /\d/.test(w)) return w;
      const lw = w.toLowerCase();
      if (/^(der|die|das|und|mit|für|fur|von|zum|zur|aus|bis|in|am|im|an|auf|ein|oder|als|inkl|cm|mm|ml|kg|st|stk)$/.test(lw)) return lw;
      if (/^[A-ZÄÖÜ]{2,3}$/.test(w) && !/^(neu|set|rot|pro|max|air|one|duo|kit|box|top|alt|bau|tab|mit|ohne)$/.test(lw)) return w;
      if (/^I(PHONE|PAD|MAC)/i.test(w)) return 'i' + w.charAt(1).toUpperCase() + w.slice(2).toLowerCase();
      return w.charAt(0) + w.slice(1).toLowerCase();
    }).join(' ');
  },
  cleanName(line, today) {
    let s = line;
    for (const a of ReceiptParser.amounts(s, today).reverse()) s = s.slice(0, a.index) + ' ' + s.slice(a.index).replace(/^\S+/, ' ');
    s = s.replace(/(?:€|\beur\b)/gi, ' ')
      .replace(/(?<![\w.,])\d{1,2}(?:[,.]\d+)?\s?%/g, ' ')    // Steuersätze
      .replace(/^\s*(?:\d{1,3}\s+){1,3}(?=[A-Za-zÄÖÜ])/, '')  // Position/Menge am Zeilenanfang
      .replace(/^\s*\d+\s*(?:x|stk\.?|st\.?|stück)\s+/i, '')
      .replace(/\s\d+\s*(?:x|stk\.?|st\.?|stück)\s*$/i, ' ')
      .replace(/\b\d{8,14}\b/g, ' ')          // EAN / Artikelnummern
      .replace(/^\s*\d{4,7}\s+/, '')            // führende Artikelnummer
      .replace(/\s+[ABCD12*]\s*$/, ' ')         // Steuerkennzeichen am Zeilenende
      .replace(/[|_*#]+/g, ' ').replace(/\s{2,}/g, ' ').replace(/^[\s,.;:-]+|[\s,.;:-]+$/g, '');
    return s;
  },
  findProduct(lines, today, totalLine, retailer) {
    const brandRe = ReceiptParser.brandRe();
    const amountOnly = l => /^[\s\dxX*.,'€EURurStk-]+$/.test(l) || /^\s*\d+\s*(x|stk\.?|st\.?)\s*[\d.,]+/i.test(l);
    const usable = line => line && !ReceiptParser.NOT_PRODUCT.test(line) && !/\b\d{5}\s+[A-ZÄÖÜ][a-zäöü]/.test(line)
      && !ReceiptParser.dateMatches(line, today).length
      && !(retailer && line.toLowerCase().replace(/\s/g, '').includes(retailer.toLowerCase().replace(/\s/g, '')));
    const cands = [];
    lines.forEach((line, i) => {
      if (!usable(line)) return;
      let name = ReceiptParser.cleanName(line, today);
      let amts = ReceiptParser.amounts(line, today);
      let j = i + 1;
      // Artikel über zwei Zeilen (z. B. "SAMSUNG WW90T534AAW" / "WASCHMASCHINE 9KG" / "1 x 599,99 ... 599,99")
      if (!amts.length && usable(lines[j]) && !amountOnly(lines[j])) {
        const cont = ReceiptParser.cleanName(lines[j], today);
        const contAmts = ReceiptParser.amounts(lines[j], today);
        if ((cont.match(/[a-zäöüß]/gi) || []).length >= 3 && cont.length < 60) {
          name = (name + ' ' + cont).trim(); amts = contAmts; j++;
        }
      }
      if (!amts.length && lines[j] && amountOnly(lines[j])) amts = ReceiptParser.amounts(lines[j], today);
      const letters = (name.match(/[a-zäöüß]/gi) || []).length;
      if (letters < 4 || name.length > 90) return;
      let score = 0;
      name = name.replace(/^[^A-Za-zÄÖÜäöü0-9]+/, '');
      { const ws = name.split(' '); while (ws.length > 1 && /^[a-zäöü]{1,2}$/.test(ws[ws.length - 1]) && !/^(kg|l|ml|cm|mm|m|w|v|gb|tb|xl|xs)$/i.test(ws[ws.length - 1])) ws.pop(); name = ws.join(' '); }
      name = name.replace(/(?:\s+(?:-?[\d.,]+|[^\wäöüÄÖÜß\s]{1,3}))+\s*$/, '').replace(/^\s*[A-Za-z]\s+(?=\S)/, '').trim();
      const strong = brandRe.test(name) || !!ReceiptParser.typeOf(name);
      if (brandRe.test(name)) score += 6;
      if (ReceiptParser.typeOf(name)) score += 5;
      if (amts.length) score += 2;
      if (name.split(' ').some(ReceiptParser.isModelToken)) score += 2;
      if (totalLine != null && i > totalLine) score -= 4;
      if (/^[A-ZÄÖÜ\s]{3,}$/.test(name) && name.split(' ').length <= 2 && !brandRe.test(name)) score -= 2;
      cands.push({ name, score, strong, cents: amts.length ? Math.max(...amts.map(a => a.cents)) : 0, i });
    });
    if (!cands.length) return null;
    const maxC = Math.max(...cands.map(c => c.cents));
    cands.forEach(c => { if (c.cents && c.cents === maxC) c.score += 3; });
    cands.sort((a, b) => b.score - a.score || b.cents - a.cents || a.i - b.i);
    return cands[0].score >= 5 ? cands[0] : null;
  },

  /** Hauptfunktion. today = ISO-Datum, isValid = Datumsprüfung (aus DateUtil). */
  BILLING: /^(d[z2][r1]|ozr|pvs|zab|abz|bfs|unimed|mediserv|medas|dmrz|rzh|health|avp|ihre-zahnabrechnung)\b/i,
  /** Art der Dienstleistung anhand typischer Wörter (auch bei Lesefehlern im Briefkopf). */
  serviceKind(text) {
    const t = text.toLowerCase();
    if (/tierarzt|tierärzt|tierklinik|\bgot\b/.test(t)) return 'Tierarztrechnung';
    if (/zahnarzt|zahnärzt|zahnmedizin|kavit[aä]t|\bbema\b|zähne|zahne|füllmaterial|fullmaterial|prophylaxe|kieferorthop|zahnreinigung|implantat/.test(t)) return 'Zahnarztrechnung';
    if (/\bgo[aä]\b|ärztliche|arztpraxis|hausarzt|facharzt|behandelte person|behandlungszeitraum|patient/.test(t)) return 'Arztrechnung';
    if (/werkstatt|inspektion|hauptuntersuchung|ölwechsel|olwechsel|reifenwechsel|probefahrt|kfz-meister/.test(t)) return 'Werkstattrechnung';
    return null;
  },
  /** Grobe Plausibilität einer erkannten Zeile: überwiegend Buchstaben, kein Zeichensalat. */
  looksClean(name) {
    const chars = name.replace(/\s/g, ''), letters = (chars.match(/[a-zäöüß]/gi) || []).length;
    return chars.length >= 3 && letters / chars.length >= 0.7 && !/[£$§|{}<>~^_\\]/.test(name);
  },
  parse(text, today, isValid) {
    const lines = ReceiptParser.lines(text);
    const out = { name: null, category: null, purchaseDate: null, price: null, priceCents: null, retailer: null, serialNumber: null, modelNumber: null };
    if (!lines.length) return out;
    const joined = lines.join('\n');
    out.retailer = ReceiptParser.findRetailer(lines);
    // Abrechnungsstellen (z. B. für Zahnärzte) sind nicht der eigentliche Anbieter
    if (out.retailer && ReceiptParser.BILLING.test(out.retailer)) out.retailer = null;
    out.purchaseDate = ReceiptParser.findDate(lines, today, isValid);
    const total = ReceiptParser.findTotal(lines, today);
    if (total) { out.priceCents = total.cents; out.price = (total.cents / 100).toFixed(2).replace('.', ','); }
    out.serialNumber = ReceiptParser.findSerial(joined);
    let found = ReceiptParser.findProduct(lines, today, total ? total.line : null, out.retailer);
    if (!found || !found.strong) {
      // Dienstleistung statt Produkt: verständlicher Name statt einer zufälligen Zeile
      const kind = ReceiptParser.serviceKind(text);
      if (kind) found = { name: kind + (out.retailer ? ' ' + out.retailer : ''), strong: false, cents: 0 };
      else if (found && out.retailer) found = { name: tx('Rechnung') + ' ' + out.retailer, strong: false, cents: 0 };
      else if (found && !ReceiptParser.looksClean(found.name)) found = null;
    }
    let product = found ? found.name : null;
    let model = ReceiptParser.findModel(joined);
    // Mehrere Artikel auf der Rechnung: Für die Garantie zählt der Preis des Produkts, nicht die Gesamtsumme.
    if (found && found.strong && found.cents && total && found.cents < total.cents) { out.priceCents = found.cents; out.price = (found.cents / 100).toFixed(2).replace('.', ','); }
    if (product) {
      product = ReceiptParser.prettify(product);
      const words = product.split(' ');
      const mi = words.findIndex(ReceiptParser.isModelToken);
      if (!model && mi >= 0) model = words[mi].toUpperCase();
      // Modellnummer aus dem Namen lösen, wenn danach noch ein sinnvoller Name übrig bleibt.
      if (model) {
        const rest = words.filter(w => w.toUpperCase() !== model).join(' ').trim();
        if ((rest.match(/[a-zäöüß]/gi) || []).length >= 6) product = rest;
      }
      if (out.serialNumber) product = product.split(' ').filter(w => w.toUpperCase() !== out.serialNumber).join(' ').trim();
      out.name = product.slice(0, 200);
    }
    out.modelNumber = model && model !== out.serialNumber ? model : null;
    out.category = ReceiptParser.typeOf((out.name || '') + ' ' + (product ? '' : joined));
    return out;
  }
};

/**
 * Texterkennung (OCR) für Fotos. Eine einzelne HTML-Datei kann keine OCR-Engine offline mitbringen
 * (Tesseract & Co. wären externe Bibliotheken mit mehreren MB Sprachdaten). Genutzt wird deshalb, was vorhanden ist:
 *
 *  1. Native Android-Schicht (empfohlen, offline, auf dem Gerät), z. B. Google ML Kit Text Recognition in einer WebView-App.
 *     Vertrag:  JS ruft   window.GarantieBoxNative.recognizeText(requestId, base64Bild, mimeType)
 *               Native antwortet asynchron mit  window.GarantieBoxOCR.done(requestId, erkannterText)
 *               oder bei Fehlern               window.GarantieBoxOCR.fail(requestId, meldung)
 *     Der Text sollte zeilenweise (\n) von oben nach unten geliefert werden.
 *     Fertige Umsetzung mit ML Kit: GarantieBoxBridge.kt (liegt dieser Datei bei).
 *  2. Browser-eigene Shape Detection API (TextDetector) – nur in manchen Chrome-Versionen, meist hinter einem Flag.
 *  3. Tesseract.js (Open Source, Apache-2.0), selbst gehostet im Ordner ocr/ neben dieser Datei (siehe README).
 *     Läuft komplett im Browser bzw. in der TWA; nach dem ersten Laden offline (Service Worker + Cache).
 *     Fehlt der Ordner (z. B. beim Öffnen per file://), wird dieser Weg einfach übersprungen.
 *  4. Sonst: Text einfügen (z. B. aus Google Lens kopiert) – die Auswertung läuft dann genauso lokal.
 *
 * PDF-Rechnungen mit Textebene werden immer direkt gelesen (PdfText), dafür ist keine OCR nötig.
 */
const TessOCR = {
  BASE: 'ocr/',
  LANG: 'deu',
  IDLE_MS: 120000,
  present: null, probing: null, worker: null, workerP: null, idle: null, onLog: null,
  url(p) { return new URL(TessOCR.BASE + p, location.href).href; },
  /** Prüft einmalig, ob die Tesseract-Dateien mitgeliefert werden (Skript laden). */
  probe() {
    if (TessOCR.probing) return TessOCR.probing;
    TessOCR.probing = new Promise(res => {
      if (window.Tesseract && typeof window.Tesseract.createWorker === 'function') { TessOCR.present = true; return res(true); }
      if (!/^https?:$/.test(location.protocol)) { TessOCR.present = false; return res(false); } // file:// kann keine Worker/Sprachdaten laden
      const sc = document.createElement('script');
      sc.src = TessOCR.url('tesseract.min.js');
      sc.async = true;
      sc.onload = () => { TessOCR.present = !!(window.Tesseract && typeof window.Tesseract.createWorker === 'function'); res(TessOCR.present); };
      sc.onerror = () => { TessOCR.present = false; sc.remove(); res(false); };
      document.head.appendChild(sc);
    });
    return TessOCR.probing;
  },
  getWorker() {
    clearTimeout(TessOCR.idle);
    if (TessOCR.worker) return Promise.resolve(TessOCR.worker);
    if (!TessOCR.workerP) {
      TessOCR.workerP = window.Tesseract.createWorker(TessOCR.LANG, 1, {
        workerPath: TessOCR.url('worker.min.js'),
        corePath: TessOCR.url('core'),
        langPath: TessOCR.url('lang'),
        workerBlobURL: false, // Worker vom eigenen Server laden, damit der Service Worker ihn offline bereitstellt
        logger: m => { try { TessOCR.onLog && TessOCR.onLog(m); } catch (e) {} }
      }).then(async w => {
        // PSM 6: ein Textblock, Zeilen bleiben zusammen (Artikel links, Preis rechts) – im Test mit Kassenbons am zuverlässigsten.
        await w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1', user_defined_dpi: '300' });
        TessOCR.worker = w;
        return w;
      }).catch(e => { TessOCR.workerP = null; throw e; });

    return TessOCR.workerP;
  },
  release() {
    clearTimeout(TessOCR.idle);
    TessOCR.idle = setTimeout(() => {
      const w = TessOCR.worker;
      TessOCR.worker = null; TessOCR.workerP = null;
      if (w) w.terminate().catch(() => {});
    }, TessOCR.IDLE_MS);
  },
  /**
   * Bild für die Erkennung aufbereiten (Fotos von Papierbelegen):
   *  1. passende Größe, optional um 90°/270° drehen, Graustufen
   *  2. Papier erkennen: Hintergrund (Tisch, Decke …) entfernen, Beleg ausschneiden und
   *     perspektivisch entzerren – wie ein Dokumentenscanner
   *  3. restliche Schräglage gerade drehen
   *  4. Schatten und ungleichmäßiges Licht ausgleichen (lokale Schwelle) → klares Schwarz-Weiß
   */
  async prepare(blob, rotate) {
    const bmp = await createImageBitmap(blob);
    const m = Math.max(bmp.width, bmp.height);
    const sc = Math.min(2600 / m, Math.max(1, 1700 / m));
    const w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
    const turned = rotate % 180 !== 0;
    const draw = (deg, cw, ch) => {
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.fillStyle = '#fff'; x.fillRect(0, 0, cw, ch);
      x.translate(cw / 2, ch / 2); x.rotate(deg * Math.PI / 180);
      x.drawImage(bmp, -w / 2, -h / 2, w, h);
      x.setTransform(1, 0, 0, 1, 0, 0);
      return { c, x };
    };
    const gray = (x, cw, ch) => {
      const d = x.getImageData(0, 0, cw, ch).data, g = new Uint8ClampedArray(cw * ch);
      for (let i = 0, j = 0; i < d.length; i += 4, j++) g[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
      return g;
    };
    let cw = turned ? h : w, ch = turned ? w : h;
    let { c, x } = draw(rotate, cw, ch);
    let g = gray(x, cw, ch);
    if (bmp.close) bmp.close();
    // 2. Beleg ausschneiden und entzerren
    let cropped = false;
    const quad = TessOCR.findPaper(g, cw, ch);
    if (quad) {
      const r = TessOCR.warp(g, cw, ch, quad);
      g = r.g; cw = r.w; ch = r.h; cropped = true;
    }
    // 3. Schräglage und – nach dem Entzerren – Scherung („kursive“ Schrift durch ungenaue Ecken)
    const skew = TessOCR.skewAngle(g, cw, ch, cropped ? 8 : 12);
    if (Math.abs(skew) >= 0.4) {
      const rot = TessOCR.rotateGray(g, cw, ch, -skew);
      g = rot.g; cw = rot.w; ch = rot.h;
    }
    if (cropped) {
      const sh = TessOCR.shearAngle(g, cw, ch);
      if (Math.abs(sh) >= 0.6) { const r2 = TessOCR.shearGray(g, cw, ch, sh); g = r2.g; cw = r2.w; ch = r2.h; }
    }
    // 4. Schwarz-Weiß
    const out = TessOCR.binarize(g, cw, ch);
    c = document.createElement('canvas'); c.width = cw; c.height = ch;
    x = c.getContext('2d');
    const img = x.createImageData(cw, ch), d = img.data;
    for (let i = 0, j = 0; j < out.length; i += 4, j++) { d[i] = d[i + 1] = d[i + 2] = out[j]; d[i + 3] = 255; }
    x.putImageData(img, 0, 0);
    const blobOut = await new Promise(r2 => c.toBlob(r2, 'image/png'));
    return { blob: blobOut, landscape: cw > ch * 1.15, skew, crop: cropped ? quad : null };
  },
  /** Otsu-Schwelle eines Graustufen-Arrays. */
  otsu(g) {
    const hist = new Float64Array(256);
    for (let i = 0; i < g.length; i++) hist[g[i]]++;
    let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sumB = 0, wB = 0, best = 0, bestT = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (!wB) continue;
      const wF = g.length - wB; if (!wF) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF, between = wB * wF * (mB - mF) * (mB - mF);
      if (between > best) { best = between; bestT = t; }
    }
    return bestT;
  },
  /**
   * Sucht das Papier im Foto: helle Fläche, die nicht mit dem dunkleren Hintergrund am Bildrand verbunden ist.
   * Liefert die vier Ecken [lo, ro, ru, lu] in Bildkoordinaten oder null (z. B. bei Screenshots oder randlosen Fotos).
   */
  findPaper(g, w, h) {
    const step = Math.max(1, Math.round(Math.max(w, h) / 420));
    const sw = Math.floor(w / step), sh = Math.floor(h / step), s = new Uint8ClampedArray(sw * sh);
    for (let y = 0; y < sh; y++) for (let xx = 0; xx < sw; xx++) {
      // kleiner Mittelwert gegen Rauschen und Schrift
      let a = 0, n = 0;
      for (let dy = 0; dy < step; dy += Math.max(1, step >> 1)) for (let dx = 0; dx < step; dx += Math.max(1, step >> 1)) { a += g[(y * step + dy) * w + xx * step + dx]; n++; }
      s[y * sw + xx] = a / n;
    }
    const t = TessOCR.otsu(s);
    let bright = 0; for (let i = 0; i < s.length; i++) if (s[i] > t) bright++;
    // Hintergrund = dunkle Pixel, die vom Bildrand aus erreichbar sind
    const bg = new Uint8Array(sw * sh), stack = [];
    const push = i => { if (!bg[i] && s[i] <= t) { bg[i] = 1; stack.push(i); } };
    for (let xx = 0; xx < sw; xx++) { push(xx); push((sh - 1) * sw + xx); }
    for (let y = 0; y < sh; y++) { push(y * sw); push(y * sw + sw - 1); }
    while (stack.length) {

  /** Lokale Schwelle nach Bradley/Roth mit Integralbild: gleicht Schatten und Licht aus. */
  binarize(g, w, h) {

const TextRecognition = {
  pending: new Map(),
  TIMEOUT: 60000,
  nativeAvailable() { return !!(window.GarantieBoxNative && typeof window.GarantieBoxNative.recognizeText === 'function'); },
  detectorAvailable() { return typeof window.TextDetector === 'function'; },
  imageAvailable() { return TextRecognition.nativeAvailable() || TextRecognition.detectorAvailable() || TessOCR.present === true; },
  label() { return TextRecognition.nativeAvailable() ? 'Über Android-App' : TextRecognition.detectorAvailable() ? 'Browser-Texterkennung' : TessOCR.present ? 'Tesseract, auf dem Gerät' : 'Nicht verfügbar (Text einfügen möglich)'; },
  hint() {
    return 'PDF, JPG oder PNG – erkannte Angaben werden automatisch eingetragen.';
  },
  async fromImage(blob, progress) {
    if (TextRecognition.nativeAvailable()) {
      const id = newId();
      const b64 = (await Receipts.blobToDataURL(blob)).split(',')[1];
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => { TextRecognition.pending.delete(id); reject(new UserError('Die Texterkennung hat nicht rechtzeitig geantwortet.')); }, TextRecognition.TIMEOUT);
        TextRecognition.pending.set(id, { resolve, reject, t });
        try { window.GarantieBoxNative.recognizeText(id, b64, blob.type); }
        catch (e) { clearTimeout(t); TextRecognition.pending.delete(id); reject(new UserError('Die Texterkennung der App konnte nicht gestartet werden.')); }
      });
    }
    if (TextRecognition.detectorAvailable()) {
      const bmp = await createImageBitmap(blob);
      try {
        const res = await new window.TextDetector().detect(bmp);
        return TextRecognition.joinBoxes((res || []).map(r => ({ t: r.rawValue || '', b: r.boundingBox })).filter(r => r.t && r.b));
      } finally { if (bmp.close) bmp.close(); }

  },
  /** Erkannte Textblöcke (mit Position) zu Zeilen zusammensetzen. */
  joinBoxes(list) {
    const items = list.map(r => ({ t: r.t.trim(), x: r.b.x, cy: r.b.y + r.b.height / 2, h: r.b.height })).filter(r => r.t);
    items.sort((a, b) => a.cy - b.cy || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const row = rows[rows.length - 1];
      if (row && Math.abs(row.cy - it.cy) < 0.5 * Math.min(row.h, it.h)) row.items.push(it);
      else rows.push({ cy: it.cy, h: it.h, items: [it] });
    }
    return rows.map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.t).join(' ')).join('\n');

/** Rückkanal für die native Texterkennung. */
window.GarantieBoxOCR = {
  done(id, text) { const p = TextRecognition.pending.get(id); if (!p) return; clearTimeout(p.t); TextRecognition.pending.delete(id); p.resolve(String(text == null ? '' : text)); },
  fail(id, msg) { const p = TextRecognition.pending.get(id); if (!p) return; clearTimeout(p.t); TextRecognition.pending.delete(id); p.reject(new UserError(msg ? String(msg).slice(0, 200) : 'Die Texterkennung ist fehlgeschlagen.')); }
};

const Scan = {
  /** Rechnung hochladen: anhängen, Text lesen, erkannte Angaben in leere Felder eintragen. */
  async upload(F, file) {
    F.busy = true;
    Scan.clearResult();
    renderFormReceipt('Rechnung wird geladen …');
    let prep;
    try { prep = await Receipts.prepare(file); }
    catch (e) { F.busy = false; if (App.form === F) renderFormReceipt(); UI.toast(e instanceof UserError ? e.message : 'Die Datei konnte nicht gelesen werden.', 'error'); return; }
    F.pending = prep; F.removeExisting = false;
    F.pendingFromDraft = await Draft.saveReceipt(prep);
    await Scan.autoFill(F, prep);
  },
  async autoFill(F, prep, pastedText) {
    F.busy = true;
    let text = pastedText || null, problem = null, msg = '';
    if (!text) {
      renderFormReceipt('Rechnung wird gelesen …');
      try {
        if (prep.type === 'application/pdf') {
          const u8 = new Uint8Array(await prep.blob.arrayBuffer());
          text = await PdfText.extract(u8);
          if (!text.replace(/\s/g, '')) {
            // Gescannte PDF (z. B. aus Google Drive oder der Samsung-Kamera): Seitenbilder mit der Texterkennung lesen
            await TessOCR.probe();
            if (TextRecognition.imageAvailable()) {
              const imgs = await PdfText.images(u8, 2).catch(() => []);
              for (const img of imgs) {
                const t = await TextRecognition.fromImage(img, (tt, pp) => { if (App.form === F) renderFormReceipt(tt + (typeof pp === 'number' && pp > 0 ? ' ' + Math.round(pp * 100) + ' %' : '')); });
                if (t) text += '\n' + t;
              }
            }
            if (!text.replace(/\s/g, '')) problem = 'pdf-no-text';
          }
        } else if ((await TessOCR.probe(), TextRecognition.imageAvailable())) {
          text = await TextRecognition.fromImage(prep.blob, (t, p) => { if (App.form === F) renderFormReceipt(t + (typeof p === 'number' && p > 0 ? ' ' + Math.round(p * 100) + ' %' : '')); });
          if (!text || !text.replace(/\s/g, '')) problem = 'ocr-empty';
        } else problem = 'no-ocr';
      } catch (e) { console.warn('Scan', e); problem = 'error'; msg = e instanceof UserError ? e.message : 'Die Rechnung konnte nicht gelesen werden.'; }
    }
    F.busy = false;
    if (App.form !== F) return;
    renderFormReceipt();
    // Ohne Texterkennung auf dem Gerät (nur reine HTML-Datei ohne ocr/-Ordner) wird das Foto still angehängt.
    if (problem === 'no-ocr') { Draft.saveNow(); return; }
    if (problem) { Scan.showResult(F, { problem, msg }); Draft.saveNow(); return; }
    const r = ReceiptParser.parse(text, App.today, DateUtil.isValid);
    Scan.showResult(F, { filled: Scan.fillEmpty(F, r) });
    updateWarrantyPreview();
    Draft.saveNow();
  },
  FILL: [['name', 'f-name', 'Produkt'], ['purchaseDate', 'f-purchaseDate', 'Kaufdatum'], ['price', 'f-price', 'Preis'], ['retailer', 'f-retailer', 'Händler'],
    ['serialNumber', 'f-serialNumber', 'Seriennummer'], ['modelNumber', 'f-modelNumber', 'Modellnummer'], ['category', 'f-category', 'Kategorie']],
  /** Trägt nur in leere Felder ein – was du selbst geschrieben hast, bleibt stehen. */
  fillEmpty(F, r) {
    const undo = {}, filled = [];
    for (const [k, id, label] of Scan.FILL) {
      let v = k === 'price' ? (r.priceCents != null ? Money.toInput(r.priceCents / 100) : '') : (r[k] || '');
      const el = $('#' + id);
      if (!v || !el) continue;
      if (k === 'category') {
        if (F.catTouched || el.value === v || ![...el.options].some(o => o.value === v)) continue;
      } else if (el.value.trim()) continue;
      if (k === 'purchaseDate' && (!DateUtil.isValid(v) || v > App.today)) continue;
      undo[id] = el.value;
      if (k === 'purchaseDate') DateInput.set(id, v); else el.value = v;
      el.classList.add('autofilled');
      const err = $('#err-' + k); if (err) { err.hidden = true; el.removeAttribute('aria-invalid'); }
      filled.push(label);
    }
    F.autoUndo = undo;
    if (filled.some(l => !['Produkt', 'Kaufdatum'].includes(l))) { const md = $('#more-fields'); if (md) md.open = true; }
    return filled;
  },
  undo() {
    const F = App.form; if (!F || !F.autoUndo) return;
    for (const [id, v] of Object.entries(F.autoUndo)) { const el = $('#' + id); if (el) { el.value = v; el.classList.remove('autofilled'); } }
    F.autoUndo = null;
    Scan.clearResult();
    updateWarrantyPreview();
    Draft.saveNow();
  },
  clearResult() { const el = $('#scan-result'); if (el) el.innerHTML = ''; },
  showResult(F, res) {
    const el = $('#scan-result'); if (!el) return;
    const paste = '<button class="link-btn" type="button" data-action="scan-paste">Text einfügen</button>';
    let html;
    if (res.problem) {
      const t = {
        'ocr-empty': 'Rechnung hinzugefügt. Auf dem Foto wurde kein Text erkannt.',
        'pdf-no-text': 'Rechnung hinzugefügt. Die PDF enthält keinen lesbaren Text.',
        'error': 'Rechnung hinzugefügt. ' + res.msg
      }[res.problem];
      html = `<div class="notice notice-info">${esc(t)} ${paste}</div>`;
    } else if (res.filled.length) {
      const n = res.filled.length;
      html = `<div class="notice notice-ok"><strong>${n} ${plural(n, 'Angabe', 'Angaben')} eingetragen:</strong> ${esc(res.filled.join(', '))}. Bitte kurz prüfen. <button class="link-btn" type="button" data-action="scan-undo">Rückgängig</button></div>`;
    } else {
      html = `<div class="notice notice-info">Rechnung hinzugefügt. Es wurden keine neuen Angaben erkannt. ${paste}</div>`;
    }
    el.innerHTML = html;
  },
  async paste() {
    const F = App.form; if (!F || F.busy || !F.pending) return;
    const r = await Scan.askText('paste', '', { attach: false });
    if (!r || App.form !== F) return;
    await Scan.autoFill(F, F.pending, r.text);
  },
  async askText(problem, msg, { attach = true } = {}) {
    const lensTip = `<p class="small">Tipp: Öffne das Foto in Google Fotos, tippe auf <strong>Lens</strong> → <strong>Text</strong> → <strong>Kopieren</strong> und füge den Text hier ein.</p>`;
    const intro = {
      'no-ocr': `<p>Fotos können auf diesem Gerät nicht automatisch gelesen werden.</p>${lensTip}`,
