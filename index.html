<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="Belegwächter – Produkte, Rechnungen und Garantiefristen lokal auf dem Gerät verwalten.">
<title>Belegwächter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect x=%228%22 y=%228%22 width=%22496%22 height=%22496%22 rx=%22118%22 fill=%22%232a48a8%22/%3E%3Cg transform=%22translate%28256 256%29 scale%28.92%29 translate%28-256 -256%29%22%3E%3Cg transform=%22translate%28-14 0%29%22%3E%3Crect x=%22150%22 y=%22118%22 width=%22196%22 height=%22276%22 rx=%2218%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%2226%22/%3E%3Crect x=%22194%22 y=%22176%22 width=%22108%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22220%22 width=%22108%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22264%22 width=%2246%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22308%22 width=%2246%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Cpath d=%22M266 282 L308 324 L404 218%22 fill=%22none%22 stroke=%22%232a48a8%22 stroke-width=%2278%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M266 282 L308 324 L404 218%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%2242%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
/* =========================================================
   DESIGN-TOKENS
   Hell = Standard, Dunkel per System oder manuell (data-theme)
   ========================================================= */
:root{
  --bg:#eef1f4; --bg-blur:rgba(238,241,244,.86);
  --surface:#ffffff; --surface-2:#f6f8fa; --sunken:#e4e8ed;
  --ink:#15202b; --ink-2:#3d4a57; --muted:#6b7784;
  --line:#dde3e9; --line-strong:#c7cfd8;
  --accent:#2a48a8; --accent-ink:#ffffff; --accent-soft:#e3e9f8;
  --ok:#23945f; --ok-soft:#dcf1e6; --ok-ink:#17653f;
  --warn:#c9950f; --warn-soft:#f8eed0; --warn-ink:#6e5207;
  --soon:#dc6a24; --soon-soft:#fbe4d5; --soon-ink:#8f3f0e;
  --bad:#cc3b3b; --bad-soft:#f7dede; --bad-ink:#8f2222;
  --shadow:0 1px 1px rgba(21,32,43,.04), 0 6px 18px -8px rgba(21,32,43,.12);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --nav-h:76px; /* Platz unten für den Hinzufügen-Button */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --bg-blur:rgba(15,20,26,.86);
    --surface:#171e26; --surface-2:#1c242e; --sunken:#232c37;
    --ink:#e6ebf1; --ink-2:#c1cad4; --muted:#8a96a3;
    --line:#26303b; --line-strong:#34404d;
    --accent:#8ea6ff; --accent-ink:#0e1733; --accent-soft:#1d2744;
    --ok:#46c287; --ok-soft:#14301f; --ok-ink:#86e0b3;
    --warn:#e6b43a; --warn-soft:#322811; --warn-ink:#f2d27c;
    --soon:#f08a4b; --soon-soft:#3a2416; --soon-ink:#f7b58b;
    --bad:#ef6a6a; --bad-soft:#3a1b1d; --bad-ink:#f7a3a3;
    --shadow:0 1px 1px rgba(0,0,0,.2), 0 8px 22px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --bg-blur:rgba(15,20,26,.86);
  --surface:#171e26; --surface-2:#1c242e; --sunken:#232c37;
  --ink:#e6ebf1; --ink-2:#c1cad4; --muted:#8a96a3;
  --line:#26303b; --line-strong:#34404d;
  --accent:#8ea6ff; --accent-ink:#0e1733; --accent-soft:#1d2744;
  --ok:#46c287; --ok-soft:#14301f; --ok-ink:#86e0b3;
  --warn:#e6b43a; --warn-soft:#322811; --warn-ink:#f2d27c;
  --soon:#f08a4b; --soon-soft:#3a2416; --soon-ink:#f7b58b;
  --bad:#ef6a6a; --bad-soft:#3a1b1d; --bad-ink:#f7a3a3;
  --shadow:0 1px 1px rgba(0,0,0,.2), 0 8px 22px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ================= BASIS ================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ================= LAYOUT ================= */
.topbar{
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg-blur);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
}
.topbar-inner{max-width:760px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px}
.topbar-inner.has-back{padding-left:6px}
.topbar .title{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-size:clamp(20px,6vw,24px);font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name b{font-weight:800;color:var(--accent)}
.brand-date{font-size:14px;color:var(--muted);white-space:nowrap;flex:none}
@media (max-width:399px){.brand-date{display:none}}
.icon-btn{
  width:48px;height:48px;flex:none;display:inline-grid;place-items:center;border:0;border-radius:14px;
  background:transparent;color:var(--ink);cursor:pointer;text-decoration:none
}
.icon-btn:active{background:var(--sunken)}
.icon-btn svg{width:24px;height:24px}

main{max-width:760px;margin:0 auto;padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.kb-open main{padding-bottom:40px}
.view{display:flex;flex-direction:column;gap:22px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:18px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}

/* ================= BOTTOM-NAVIGATION ================= */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.kb-open .bottom-nav{display:none}
.bottom-nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:clamp(9.5px,2.6vw,11.5px);letter-spacing:-.015em;font-weight:600;min-width:0
}
.nav-item .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:var(--accent)}
.nav-item .nav-plus{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);margin-top:-2px
}
.nav-item.nav-add{color:var(--ink-2)}
.nav-item.nav-add.active{color:var(--accent)}
.nav-item.nav-add span.lbl{margin-top:1px}

/* ================= BUTTONS ================= */
.btn{
  min-height:50px;padding:0 20px;border-radius:var(--r-md);border:1px solid transparent;
  font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;text-decoration:none;text-align:center;line-height:1.2;
  transition:transform .08s ease, background-color .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:active{background:var(--sunken)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-soft{background:var(--bad-soft);color:var(--bad-ink)}
.btn-block{width:100%}
.btn-lg{min-height:58px;font-size:17px;border-radius:16px}
.btn-sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > .btn{flex:1 1 180px}
.card.scan-card{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.scan-head{display:flex;gap:12px;align-items:flex-start}
.scan-ico{font-size:28px;line-height:1}
.scan-rows{display:flex;flex-direction:column;gap:12px}
.sheet:has(.scan-rows) .sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -20px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 18px -12px rgba(0,0,0,.25);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet:has(.scan-rows) .sheet-actions button[data-i="0"]{grid-column:1/-1}
.scan-row{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:end}
.scan-check{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:52px;cursor:pointer}
.scan-check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.scan-check span{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center}
.scan-check input:checked + span{background:var(--ok);border-color:var(--ok)}
.scan-check input:checked + span::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.scan-check input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.scan-ok{font-size:12px;font-weight:700;color:var(--ok-ink);background:var(--ok-soft);border-radius:999px;padding:1px 8px;margin-left:4px}
.scan-attach{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600;color:var(--ink);cursor:pointer}
.scan-attach input{width:22px;height:22px;accent-color:var(--accent)}
.scan-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:650}
.scan-raw{white-space:pre-wrap;word-break:break-word;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0}
.link-btn{border:0;background:none;color:var(--accent);font-weight:650;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}

/* ================= KARTEN ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-title{font-size:16px;font-weight:700;margin-bottom:10px}

/* Übersicht */
.overview{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);
  padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-height:96px;box-shadow:var(--shadow);
  cursor:pointer;color:inherit;font:inherit
}
.stat:active{transform:scale(.985)}
.stat-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.stat-sub{font-size:13px;color:var(--muted)}
.stat.value{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between;min-height:0;cursor:default;padding:14px 16px}
.stat.value:active{transform:none}
.stat.value .stat-num{font-size:24px;margin:0}

/* Status */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.s-active .dot,.dot.s-active{background:var(--ok)}
.s-soon .dot,.dot.s-soon{background:var(--warn)}
.s-critical .dot,.dot.s-critical{background:var(--soon)}
.s-expired .dot,.dot.s-expired{background:var(--bad)}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;font-weight:650;font-size:14px;width:max-content;max-width:100%}
.status.s-active{background:var(--ok-soft);color:var(--ok-ink)}
.status.s-soon{background:var(--warn-soft);color:var(--warn-ink)}
.status.s-critical{background:var(--soon-soft);color:var(--soon-ink)}
.status.s-expired{background:var(--bad-soft);color:var(--bad-ink)}

/* Restlaufzeit-Balken: das wiederkehrende Kernelement */
.life{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.life > span{display:block;height:100%;border-radius:99px}
.life.s-active > span{background:var(--ok)}
.life.s-soon > span{background:var(--warn)}
.life.s-critical > span{background:var(--soon)}
.life.s-expired > span{background:var(--bad)}

/* Produktkarten */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.pcard{
  display:flex;flex-direction:column;gap:12px;padding:16px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)
}
.pcard:active{transform:scale(.99)}
.pcard-top{display:flex;gap:12px;align-items:flex-start}
.cat-badge{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:21px;flex:none}
.pcard-name{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pcard-sub{font-size:14px;color:var(--muted);margin-top:2px}
.pcard-receipt{margin-left:auto;flex:none;color:var(--muted);display:flex}
.pcard-receipt svg{width:18px;height:18px}
.pcard-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pcard-price{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pcard-price.none{font-weight:500;color:var(--muted);font-size:15px}
.pcard-foot{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* Kompakte Liste (Dashboard) */
.rows{padding:4px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:64px;text-decoration:none;color:inherit}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main strong{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:14px}
.row .dot{width:12px;height:12px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.t-active{color:var(--ok-ink)} .t-soon{color:var(--warn-ink)} .t-critical{color:var(--soon-ink)} .t-expired{color:var(--bad-ink)}

/* Erinnerungen */
.reminders{border-color:var(--warn);background:var(--warn-soft)}
.reminders .card-title{display:flex;align-items:center;gap:8px;color:var(--warn-ink)}
.rem-item{display:flex;align-items:center;gap:12px;padding:10px 0}
.rem-item + .rem-item{border-top:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.rem-item a{flex:1;min-width:0;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.rem-item a strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-item a span{font-size:14px;color:var(--ink-2)}

/* Suche, Chips, Selects */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{padding-left:44px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer
}
.chip .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .count{color:inherit;opacity:.7}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-count{font-size:14px;color:var(--muted)}

/* Formulare */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field-label{font-size:14.5px;font-weight:650;color:var(--ink-2)}
.req{color:var(--bad)}
.input,.select select,textarea.input{
  width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface-2);font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none
}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.input:focus,.select select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.select{position:relative}
.select select{padding-right:36px;cursor:pointer;text-overflow:ellipsis}
.filters .select select{padding-left:12px;font-size:15px}
.select::after{
  content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;margin-top:-7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none
}
input[type="date"].input{min-height:52px;display:block}
.date-wrap{position:relative}
.date-wrap > .input{padding-right:56px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.date-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.date-btn svg{width:22px;height:22px;pointer-events:none}
.date-proxy{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.date-proxy::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.affix{position:relative}
.affix .input{padding-right:40px}
.affix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.hint{font-size:13.5px;color:var(--muted)}
.err{font-size:14px;color:var(--bad-ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.form-section-title{font-size:16px;font-weight:700}
.preview{
  display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;
  background:var(--accent-soft);color:var(--ink)
}
.preview strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{position:relative}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:15px
}
.toggle span::before{
  content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--line-strong);background:var(--surface);flex:none
}
.toggle input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/** Suchnormalisierung: klein, ohne Akzente, ß → ss (damit "kuhl" auch "Kühl" findet). */
function norm(s) {
  return String(s || '').toLocaleLowerCase('de-DE').replace(/ß/g, 'ss').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/**
 * Datumslogik ausschließlich auf Kalendertagen im Format "YYYY-MM-DD".
 * Es wird nie mit lokalen Uhrzeiten gerechnet: Tagesdifferenzen laufen über Date.UTC,
 * dadurch spielen Zeitzonen und Sommerzeit keine Rolle.
 */
const DateUtil = {
  parse(iso) {
    if (typeof iso !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (y < 1900 || y > 2200 || mo < 1 || mo > 12) return null;
    if (d < 1 || d > DateUtil.daysInMonth(y, mo)) return null;
    return { y, m: mo, d };
  },
  isValid(iso) { return DateUtil.parse(iso) !== null; },
  isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; },
  daysInMonth(y, m) { return [31, DateUtil.isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; },
  pad2(n) { return String(n).padStart(2, '0'); },
  toISO(y, m, d) { return String(y).padStart(4, '0') + '-' + DateUtil.pad2(m) + '-' + DateUtil.pad2(d); },
  /** Heutiges Datum nach der lokalen Uhr des Geräts. */
  today() { const n = new Date(); return DateUtil.toISO(n.getFullYear(), n.getMonth() + 1, n.getDate()); },
  /** Fortlaufende Tagesnummer (zeitzonenunabhängig). */
  dayNumber(iso) { const p = DateUtil.parse(iso); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 86400000); },
  diffDays(fromIso, toIso) { return DateUtil.dayNumber(toIso) - DateUtil.dayNumber(fromIso); },
  addDays(iso, n) {
    const dt = new Date((DateUtil.dayNumber(iso) + n) * 86400000);
    return DateUtil.toISO(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  },
  /**
   * Monate addieren. Existiert der Tag im Zielmonat nicht, wird der letzte Tag des Monats genommen
   * (wie § 188 Abs. 3 BGB): 31.08. + 6 Monate = 28./29.02., 29.02.2024 + 1 Jahr = 28.02.2025.
   */
  addMonths(iso, months) {
    const p = DateUtil.parse(iso);
    const total = p.y * 12 + (p.m - 1) + months;
    const y = Math.floor(total / 12), m = total - y * 12 + 1;
    return DateUtil.toISO(y, m, Math.min(p.d, DateUtil.daysInMonth(y, m)));
  },
  /** Volle Kalendermonate + Resttage zwischen a und b (a <= b). */
  monthsBetween(a, b) {
    const pa = DateUtil.parse(a), pb = DateUtil.parse(b);
    let months = (pb.y - pa.y) * 12 + (pb.m - pa.m);
    if (months > 0 && DateUtil.addMonths(a, months) > b) months--;
    if (months < 0) months = 0;
    return { months, days: DateUtil.diffDays(DateUtil.addMonths(a, months), b) };
  },
  format(iso) { const p = DateUtil.parse(iso); return p ? DateUtil.pad2(p.d) + '.' + DateUtil.pad2(p.m) + '.' + p.y : '–'; },
  formatLong(iso) {
    const p = DateUtil.parse(iso); if (!p) return '';
    return new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
      .format(new Date(Date.UTC(p.y, p.m - 1, p.d)));
  }
};

/**
 * Garantie-Status.
 *   active   = mehr als 90 Tage   (grün)
 *   soon     = 30–90 Tage         (gelb)
 *   critical = weniger als 30 Tage (orange)
 *   expired  = abgelaufen          (rot)
 * Der Endtag zählt noch als gültig ("Endet heute").
 */
const Status = {
  LABELS: { active: 'Garantie aktiv', soon: 'Läuft bald ab', critical: 'Läuft sehr bald ab', expired: 'Garantie abgelaufen' },
  keyFor(days) { return days < 0 ? 'expired' : days < 30 ? 'critical' : days <= 90 ? 'soon' : 'active'; },
  of(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    const key = Status.keyFor(days);
    return { days, key, label: Status.LABELS[key], text: Status.remainingText(days, today, p.warrantyEnd) };
  },
  /** "2 Jahre und 4 Monate" (Nominativ) bzw. "2 Jahren und 4 Monaten" (Dativ, für "vor …"). */
  spanText(months, days, dative) {
    const y = Math.floor(months / 12), m = months % 12, parts = [];
    if (y) parts.push(y + ' ' + (y === 1 ? 'Jahr' : dative ? 'Jahren' : 'Jahre'));
    if (m) parts.push(m + ' ' + (m === 1 ? 'Monat' : dative ? 'Monaten' : 'Monate'));
    if (!y && days) parts.push(days + ' ' + (days === 1 ? 'Tag' : dative ? 'Tagen' : 'Tage'));
    return parts.join(' und ');
  },
  remainingText(days, today, end) {
    if (days === 0) return 'Endet heute';
    if (days === 1) return 'Endet morgen';
    if (days === -1) return 'Gestern abgelaufen';
    if (days > 1) {
      if (days < 90) return 'Noch ' + days + ' Tage';
      const b = DateUtil.monthsBetween(today, end);
      return 'Noch ' + Status.spanText(b.months, b.days, false);
    }
    const ago = -days;
    if (ago < 60) return 'Vor ' + ago + ' Tagen abgelaufen';
    const b = DateUtil.monthsBetween(end, today);
    return 'Vor ' + Status.spanText(b.months, b.days, true) + ' abgelaufen';
  },
  endsText(days) {
    if (days === 0) return 'Garantie endet heute';
    if (days === 1) return 'Garantie endet morgen';
    if (days > 1) return 'Garantie endet in ' + days + ' Tagen';
    if (days === -1) return 'Garantie ist gestern abgelaufen';
    return 'Garantie vor ' + (-days) + ' Tagen abgelaufen';
  }
};

/** Geldbeträge: intern in Cent rechnen, um Rundungsfehler zu vermeiden. */
const Money = {
  fmt: new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }),
  /** Akzeptiert "599,99", "599.99", "1.299,99", "1,299.99", "599 €". Mehrdeutiges wie "5,999" wird abgelehnt. Leer = kein Preis. */
  parse(input) {
    const raw = String(input ?? '').trim();
    if (raw === '') return { ok: true, cents: null };
    const s = raw.replace(/[\s\u00a0]/g, '').replace(/€|euro?/gi, '');
    let n = null;
    if (/^\d+(,\d{1,2})?$/.test(s)) n = s.replace(',', '.');
    else if (/^\d+(\.\d{1,2})?$/.test(s)) n = s;
    else if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) n = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(,\d{3})+\.\d{1,2}$/.test(s)) n = s.replace(/,/g, ''); // nur mit Nachkommastellen eindeutig
    if (n === null) return { ok: false, cents: null };
    const cents = Math.round(parseFloat(n) * 100);
    if (!Number.isFinite(cents) || cents < 0 || cents > 1e10) return { ok: false, cents: null };
    return { ok: true, cents };
  },
  cents(price) { return price == null || !Number.isFinite(price) ? 0 : Math.round(price * 100); },
  formatCents(c) { return Money.fmt.format(c / 100); },
  format(price) { return price == null || !Number.isFinite(price) ? '' : Money.fmt.format(price); },
  toInput(price) { return price == null ? '' : (Math.round(price * 100) / 100).toFixed(2).replace('.', ','); }
};

/**
 * Erinnerungslogik (reine Berechnung, unabhängig von der Anzeige).
 * Eine Erinnerung ist fällig, sobald die Restlaufzeit ≤ gewählter Vorlauf ist.
 * Pro Produkt wird die jeweils engste überschrittene Schwelle angezeigt, bis sie bestätigt wird.
 */
const Reminders = {
  dueFor(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    if (days < 0) return null;
    const crossed = (p.reminders || []).filter(r => days <= r).sort((a, b) => a - b);
    if (!crossed.length) return null;
    const threshold = crossed[0];
    if ((p.reminderAcks || []).includes(threshold)) return null;
    return { product: p, days, threshold };
  },
  due(list, today) { return list.map(p => Reminders.dueFor(p, today)).filter(Boolean).sort((a, b) => a.days - b.days); },
  /** Beim Bestätigen werden alle bereits überschrittenen Schwellen als erledigt markiert. */
  ackValues(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    return [...new Set([...(p.reminderAcks || []), ...(p.reminders || []).filter(r => days <= r)])].sort((a, b) => a - b);
  },
  /** Geplante Termine (für eine spätere native Android-Schicht). */
  schedule(p, today) {
    return (p.reminders || []).map(r => ({ daysBefore: r, date: DateUtil.addDays(p.warrantyEnd, -r) }))
      .filter(x => x.date >= today);
  }
};

/** Prüft Formulardaten. Gibt Fehlermeldungen pro Feld zurück (leer = gültig). */
function validateForm(v, today) {
  const e = {};
  if (!v.name.trim()) e.name = 'Bitte gib einen Produktnamen ein.';
  if (!v.purchaseDate) e.purchaseDate = 'Bitte gib ein Kaufdatum ein.';
  else if (!DateUtil.isValid(v.purchaseDate)) e.purchaseDate = 'Bitte gib ein gültiges Datum ein, z. B. 12.08.2026.';
  else if (v.purchaseDate > today) e.purchaseDate = 'Das Kaufdatum darf nicht in der Zukunft liegen.';
  const price = Money.parse(v.price);
  if (!price.ok) e.price = 'Bitte gib einen gültigen Preis ein.';
  if (v.duration === 'custom') {
    if (!v.customEnd) e.customEnd = 'Bitte gib ein Enddatum für die Garantie ein.';
    else if (!DateUtil.isValid(v.customEnd)) e.customEnd = 'Bitte gib ein gültiges Datum ein, z. B. 12.08.2028.';
    else if (DateUtil.isValid(v.purchaseDate) && v.customEnd < v.purchaseDate) e.customEnd = 'Das Garantieende darf nicht vor dem Kaufdatum liegen.';
  } else if (!DURATIONS.some(d => String(d.months) === v.duration)) {
    e.duration = 'Bitte wähle eine Garantiezeit.';
  }
  return { errors: e, cents: price.cents };
}

/**
 * Bereinigt ein Produktobjekt (aus der Datenbank oder einer Importdatei).
 * Ungültige Produkte ergeben null. Das Garantieende wird bei festen Laufzeiten neu berechnet.
 */
function sanitizeProduct(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const s = (v, max) => (typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '').slice(0, max);
  const name = s(raw.name, 200).trim();
  if (!name) return null;
  const purchaseDate = raw.purchaseDate;
  if (!DateUtil.isValid(purchaseDate)) return null;
  let duration = raw.warrantyDuration, end = raw.warrantyEnd;
  const months = Number(duration);
  if (duration !== 'custom' && DURATIONS.some(d => d.months === months)) {
    duration = months; end = DateUtil.addMonths(purchaseDate, months);
  } else {
    duration = 'custom';
    if (!DateUtil.isValid(end)) return null;
  }
  if (end < purchaseDate) return null;
  let price = null;
  if (raw.price !== null && raw.price !== undefined && raw.price !== '') {
    const n = Number(raw.price);
    if (Number.isFinite(n) && n >= 0 && n < 1e8) price = Math.round(n * 100) / 100;
  }
  const opts = arr => [...new Set((Array.isArray(arr) ? arr : []).map(Number).filter(n => REMINDER_OPTIONS.includes(n)))].sort((a, b) => a - b);
  const ts = v => (typeof v === 'string' && !isNaN(Date.parse(v))) ? v : new Date().toISOString();
  const r = raw.receipt;
  const receipt = r && typeof r === 'object' && typeof r.id === 'string' && r.id
    ? { id: r.id, name: s(r.name, 200) || 'Rechnung', type: s(r.type, 100), size: Number(r.size) || 0, addedAt: s(r.addedAt, 40) }
    : null;
  return {
    id: typeof raw.id === 'string' && raw.id.trim() ? raw.id.slice(0, 100) : newId(),
    name,
    category: CATEGORIES.some(c => c.id === raw.category) ? raw.category : 'Sonstiges',
    purchaseDate,
    price,
    retailer: s(raw.retailer, 200).trim(),
    serialNumber: s(raw.serialNumber, 200).trim(),
    modelNumber: s(raw.modelNumber, 200).trim(),
    warrantyStart: purchaseDate,
    warrantyEnd: end,
    warrantyDuration: duration,
    receipt,
    reminders: Array.isArray(raw.reminders) ? opts(raw.reminders) : [...DEFAULT_REMINDERS],
    reminderAcks: opts(raw.reminderAcks),
    notes: s(raw.notes, 2000).trim(),
    createdAt: ts(raw.createdAt),
    updatedAt: ts(raw.updatedAt)
  };
}

/* ===================== 4. STORAGE ===================== */
/**
 * IndexedDB mit zwei Stores:
 *   products – Produktdatensätze (inkl. Metadaten zur Rechnung)
 *   receipts – Rechnungsdateien als Blob { id, productId, name, type, size, addedAt, blob }
 * Schreibvorgänge laufen in Transaktionen: Entweder alles wird gespeichert oder nichts.
 */
const Store = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) return reject(new Error('Speichern wird auf diesem Gerät nicht unterstützt.'));
      let req;
      // Interner Datenbankname bleibt 'garantiebox' (früherer App-Name), damit vorhandene Daten erhalten bleiben.
      try { req = indexedDB.open('garantiebox', 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts', { keyPath: 'id' });
      };
      req.onsuccess = () => {
        Store.db = req.result;
        Store.db.onversionchange = () => { Store.db.close(); UI.toast('Es gibt eine neue Version. Bitte App neu starten.', 'error'); };
        resolve(Store.db);
      };
      req.onerror = () => reject(req.error || new Error('Datenbank konnte nicht geöffnet werden.'));
      req.onblocked = () => reject(new Error('Die Datenbank ist blockiert. Schließe andere Tabs mit Belegwächter.'));
    });
  },
  _tx(names, mode, work) {
    return new Promise((resolve, reject) => {
      let t, out;
      try { t = Store.db.transaction(names, mode); } catch (e) { return reject(e); }
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Transaktion abgebrochen'));
      try { out = work(t); } catch (e) { try { t.abort(); } catch (_) {} reject(e); }
    });
  },
  _read(storeName, fn) {
    return Store._tx([storeName], 'readonly', t => {
      const box = {};
      const req = fn(t.objectStore(storeName));
      req.onsuccess = () => { box.value = req.result; };
      return box;
    }).then(b => b.value);
  },
  getAllProducts() { return Store._read('products', s => s.getAll()).then(v => v || []); },
  getAllReceipts() { return Store._read('receipts', s => s.getAll()).then(v => v || []); },
  getReceipt(id) { return Store._read('receipts', s => s.get(id)); },
  putReceipt(r) { return Store._tx(['receipts'], 'readwrite', t => { t.objectStore('receipts').put(r); }); },
  deleteReceipt(id) { return Store._tx(['receipts'], 'readwrite', t => { t.objectStore('receipts').delete(id); }); },
  /** Produkt speichern, optional Rechnung hinzufügen und/oder alte Rechnung löschen – atomar. */
  saveProduct(product, { putReceipt = null, deleteReceiptId = null } = {}) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const rs = t.objectStore('receipts');
      if (deleteReceiptId) rs.delete(deleteReceiptId);
      if (putReceipt) rs.put(putReceipt);
      t.objectStore('products').put(product);
    });
  },
  deleteProduct(id, receiptId) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      t.objectStore('products').delete(id);
      if (receiptId) t.objectStore('receipts').delete(receiptId);
    });
  },
  replaceAll(products, receipts) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const ps = t.objectStore('products'), rs = t.objectStore('receipts');
      ps.clear(); rs.clear();
      products.forEach(p => ps.put(p));
      receipts.forEach(r => rs.put(r));
    });
  },
  addMany(products, receipts) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const ps = t.objectStore('products'), rs = t.objectStore('receipts');
      products.forEach(p => ps.put(p));
      receipts.forEach(r => rs.put(r));
    });
  }
};

/** Kleine Einstellungen (Theme, letztes Backup) in localStorage – mit Fallback, falls blockiert. */
const Prefs = {
  mem: {},
  get(k, d) {
    try { const v = localStorage.getItem('gb.' + k); return v === null ? (k in Prefs.mem ? Prefs.mem[k] : d) : JSON.parse(v); }
    catch (e) { return k in Prefs.mem ? Prefs.mem[k] : d; }
  },
  set(k, v) { Prefs.mem[k] = v; try { localStorage.setItem('gb.' + k, JSON.stringify(v)); } catch (e) { /* nur im Speicher */ } }

function storageErrorMessage(e) {
  if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) {
    return 'Nicht genug Speicherplatz auf dem Gerät. Gib Speicher frei oder entferne große Rechnungen.';
  }

/** Browser bitten, die Daten nicht bei Speichermangel zu löschen (Entscheidung liegt beim Browser). */
function requestPersistOnce() {
  if (Prefs.get('persistAsked', false)) return;
  Prefs.set('persistAsked', true);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

/* ===================== 5. RECHNUNGEN ===================== */
const Receipts = {
  /**
   * Prüft eine gewählte Datei und liest sie vollständig ein.
   * Große Fotos werden auf max. 2400 px (JPEG) verkleinert – die Rechnung bleibt gut lesbar,
   * belegt aber deutlich weniger Speicher und macht Backups kleiner.
   */
  async prepare(file) {
    if (!file) throw new UserError('Keine Datei ausgewählt.');
    const name0 = file.name || 'Rechnung';
    let type = (file.type || '').toLowerCase();
    if (!type) {
      const ext = (name0.split('.').pop() || '').toLowerCase();
      type = ext === 'pdf' ? 'application/pdf' : ext === 'png' ? 'image/png' : (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : '';
    }
    if (type === 'image/jpg') type = 'image/jpeg';
    const isImage = type.startsWith('image/');
    if (!RECEIPT_TYPES.includes(type) && !isImage) throw new UserError('Dieses Dateiformat wird nicht unterstützt. Bitte wähle JPG, PNG oder PDF.');
    if (file.size === 0) throw new UserError('Die Datei ist leer.');
    if (file.size > MAX_RECEIPT_BYTES) throw new UserError('Die Datei ist zu groß (maximal 25 MB).');

    let blob = new Blob([await file.arrayBuffer()], { type });
    let name = name0;
    const mustConvert = isImage && !RECEIPT_TYPES.includes(type); // z. B. WebP/HEIC von manchen Kameras
    if (isImage && (mustConvert || blob.size > COMPRESS_THRESHOLD)) {
      try {
        const out = await Receipts.compress(blob);
        if (out && (mustConvert || out.size < blob.size)) {
          blob = out; type = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg';
        }
      } catch (e) { /* Original behalten, falls unterstützt */ }
    }
    if (!RECEIPT_TYPES.includes(type)) throw new UserError('Dieses Bildformat kann nicht gelesen werden. Bitte wähle JPG, PNG oder PDF.');
    if (!/\.[a-z0-9]{2,4}$/i.test(name)) name += type === 'application/pdf' ? '.pdf' : type === 'image/png' ? '.png' : '.jpg';
    return { blob, name, type, size: blob.size };
  },
  compress(blob, maxDim = 2400, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('toBlob')); }, 'image/jpeg', quality);
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild nicht lesbar')); };
      img.src = url;
    });
  },
  blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  },
  dataURLToBlob(dataUrl) {
    const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(dataUrl);
    if (!m) throw new Error('Ungültige Dateidaten');
    const type = m[1] || 'application/octet-stream';
    if (!m[2]) return new Blob([decodeURIComponent(m[3])], { type });
    const bin = atob(m[3]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }
};

/* ===================== 6. IMPORT / EXPORT / BACKUP ===================== */
/**
 * Dateiformat (JSON):
 *   { app: "Belegwächter", kind: "backup" | "export", version: 1, createdAt, products: [...], receipts: [...] }
 *   - export: nur Produktdaten, ohne Rechnungsdateien (klein, gut lesbar)
 *   - backup: alles, Rechnungen als Base64 (Data-URL)
 * Beide Dateien können über "Importieren" und "Backup wiederherstellen" eingelesen werden.
 */
/**
 * Nur zum Öffnen älterer, mit Passwort geschützter Backups (Versionen vor 2.7.1).
 * Neue Backups werden ohne Verschlüsselung erstellt.
 * Format alter Dateien: PBKDF2-SHA-256 → AES-256-GCM (Web Crypto, offline).
 */
/**
 * Backups älterer Versionen, die mit Passwort verschlüsselt wurden (PBKDF2-SHA-256 + AES-256-GCM),
 * können weiterhin geöffnet werden. Neue Backups werden nicht verschlüsselt.
 */
const LegacyBackup = {
  available() { return !!(window.isSecureContext !== false && window.crypto && crypto.subtle); },
  isEncrypted(obj) { return !!(obj && typeof obj === 'object' && APP_IDS.includes(obj.app) && obj.kind === 'backup-encrypted'); },
  fromB64(str) {
    const bin = atob(str), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  async decrypt(obj, password) {
    if (!LegacyBackup.available()) throw new UserError('Passwortgeschützte Backups können auf diesem Gerät nicht geöffnet werden.');
    const k = obj.kdf || {}, iterations = Number(k.iterations);
    if (obj.cipher !== 'AES-256-GCM' || k.name !== 'PBKDF2' || k.hash !== 'SHA-256' || !Number.isInteger(iterations) || iterations < 100000 || iterations > 10000000
        || typeof k.salt !== 'string' || typeof obj.iv !== 'string' || typeof obj.data !== 'string') {
      throw new UserError('Die Backup-Datei ist beschädigt.');
    }
    let salt, iv, data;
    try { salt = LegacyBackup.fromB64(k.salt); iv = LegacyBackup.fromB64(obj.iv); data = LegacyBackup.fromB64(obj.data); }
    catch (e) { throw new UserError('Die Backup-Datei ist beschädigt.'); }
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data); }
    catch (e) { throw new UserError('Falsches Passwort oder beschädigte Datei.'); }
    return new TextDecoder().decode(plain);
  }
};

const Backup = {
  FORMAT_VERSION: 2,
  /** SHA-256 über Produkte und Rechnungen – erkennt beim Wiederherstellen beschädigte oder unvollständige Dateien. */
  async checksum(products, receipts) {
    if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) return null;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify({ products, receipts })));
    return 'sha256:' + Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  },
  fileName(date = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `belegwaechter-backup-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}-${p(date.getHours())}${p(date.getMinutes())}.json`;
  },
  async build(withReceipts) {
    const products = App.products.map(p => ({ ...p, receipt: withReceipts ? p.receipt : null }));
    const out = { app: APP_NAME, kind: withReceipts ? 'backup' : 'export', version: Backup.FORMAT_VERSION, appVersion: APP_VERSION, createdAt: new Date().toISOString(), counts: null, checksum: null, products, receipts: [] };
    if (withReceipts) {
      const used = new Set(products.filter(p => p.receipt).map(p => p.receipt.id));
      for (const r of await Store.getAllReceipts()) {
        if (!r.blob || !used.has(r.id)) continue;
        out.receipts.push({ id: r.id, productId: r.productId, name: r.name, type: r.type, size: r.size, addedAt: r.addedAt, dataUrl: await Receipts.blobToDataURL(r.blob) });
      }
    }
    out.counts = { products: out.products.length, receipts: out.receipts.length };
    out.checksum = await Backup.checksum(out.products, out.receipts);
    return out;
  },
  async download(withReceipts) {
    if (!App.products.length) { UI.toast('Es sind noch keine Produkte gespeichert.'); return; }
    UI.toast(withReceipts ? 'Backup wird erstellt …' : 'Export wird erstellt …');
    try {
      const data = await Backup.build(withReceipts);
      const blob = new Blob([JSON.stringify(data, null, withReceipts ? 0 : 2)], { type: 'application/json' });
      const file = withReceipts ? Backup.fileName() : 'belegwaechter-export-' + App.today + '.json';
      downloadBlob(blob, file);
      if (withReceipts) { Prefs.set('lastBackup', data.createdAt); Prefs.set('lastBackupFile', file); Prefs.set('lastBackupCount', data.counts.products); }
      UI.toast(withReceipts ? `Backup gespeichert: ${file}` : 'Export heruntergeladen', 'info', withReceipts ? 5000 : 0);
      if (App.route.view === 'settings') renderView();
    } catch (e) {
      console.error(e);
      UI.toast('Die Datei konnte nicht erstellt werden.', 'error');
    }
  },
  /** Liest und prüft eine Importdatei. Fehlerhafte Einträge werden gezählt und übersprungen. */
  /** Prüft Prüfsumme (ab Format 2) und Mengenangaben. */
  async verify(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data) || !data.checksum) return;
    const sum = await Backup.checksum(data.products, data.receipts || []);
    if (sum && sum !== data.checksum) throw new UserError('Die Backup-Datei ist beschädigt oder unvollständig. Bitte verwende eine andere Sicherung.');
  },
  parse(input) {
    let data = input;
    if (typeof input === 'string') {
      try { data = JSON.parse(input); } catch (e) { throw new UserError('Diese Datei kann nicht gelesen werden.'); }
    }
    if (LegacyBackup.isEncrypted(data)) throw new UserError('Das Backup ist verschlüsselt.');
    const isObj = data && typeof data === 'object' && !Array.isArray(data);
    if (isObj && data.app && !APP_IDS.includes(data.app)) throw new UserError('Die Datei stammt nicht von Belegwächter.');
    const arr = Array.isArray(data) ? data : (isObj && Array.isArray(data.products) ? data.products : null);
    if (!arr) throw new UserError('Die Datei enthält keine Belegwächter-Daten.');
    const recMap = new Map();
    for (const r of (isObj && Array.isArray(data.receipts) ? data.receipts : [])) {
      if (!r || typeof r.id !== 'string' || typeof r.dataUrl !== 'string') continue;
      try {
        const b = Receipts.dataURLToBlob(r.dataUrl);
        const type = RECEIPT_TYPES.includes(b.type) ? b.type : RECEIPT_TYPES.includes(r.type) ? r.type : null;
        if (!type || !b.size) continue;
        recMap.set(r.id, {
          id: r.id, name: typeof r.name === 'string' && r.name ? r.name.slice(0, 200) : 'Rechnung', type, size: b.size,
          addedAt: typeof r.addedAt === 'string' ? r.addedAt : new Date().toISOString(),
          blob: b.type === type ? b : new Blob([b], { type })
        });
      } catch (e) { /* defekte Datei überspringen */ }
    }
    const products = [], receipts = [];
    let skipped = 0;
    for (const raw of arr) {
      const p = sanitizeProduct(raw);
      if (!p) { skipped++; continue; }
      const rec = p.receipt && recMap.get(p.receipt.id);
      if (rec) {
        p.receipt = { id: rec.id, name: rec.name, type: rec.type, size: rec.size, addedAt: rec.addedAt };
        receipts.push({ ...rec, productId: p.id });
        recMap.delete(rec.id);
      } else p.receipt = null;
      products.push(p);
    }
    const meta = isObj ? { createdAt: typeof data.createdAt === 'string' ? data.createdAt : null, appVersion: typeof data.appVersion === 'string' ? data.appVersion : null } : {};
    return { products, receipts, skipped, meta };
  },
  /** Übernimmt geprüfte Daten. "add" überspringt identische Einträge und vergibt bei Kollisionen neue IDs. */
  async apply(parsed, mode) {
    if (mode === 'replace') {
      await Store.replaceAll(parsed.products, parsed.receipts);
      return { added: parsed.products.length, dup: 0 };
    }
    const existing = new Map(App.products.map(p => [p.id, p]));
    const recById = new Map(parsed.receipts.map(r => [r.id, r]));
    const prods = [], recs = [];
    let dup = 0;
    for (const p of parsed.products) {
      const ex = existing.get(p.id);
      if (ex && ex.updatedAt === p.updatedAt && ex.name === p.name) { dup++; continue; }
      const np = { ...p, id: ex ? newId() : p.id };
      const rec = p.receipt && recById.get(p.receipt.id);
      if (rec) {
        const rid = newId();
        recs.push({ ...rec, id: rid, productId: np.id });
        np.receipt = { ...p.receipt, id: rid };
      } else np.receipt = null;
      prods.push(np);
    }
    if (prods.length) await Store.addMany(prods, recs);
    return { added: prods.length, dup };
  },
  /** Ablauf: Datei wählen → prüfen → Warnung mit Auswahl (ersetzen / hinzufügen) → übernehmen. */
  async importFlow(title) {
    const file = await Picker.pick('json');
    if (file) await Backup.importFile(title, file);
  },
  async importFile(title, file) {
    let parsed;
    try {
      const text = file.text ? await file.text() : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
      let obj;
      try { obj = JSON.parse(text); } catch (e) { throw new UserError('Diese Datei kann nicht gelesen werden.'); }
      if (LegacyBackup.isEncrypted(obj)) {
        if (!LegacyBackup.available()) throw new UserError('Verschlüsselte Backups können auf diesem Gerät nicht geöffnet werden.');
        const res = await UI.modal({
          title: 'Passwortgeschütztes Backup',
          html: `<p>Dieses Backup wurde mit einer älteren Version mit Passwort gesichert. Gib das Passwort ein, um es zu öffnen.</p>
            <div class="field"><label for="bk-pw">Passwort</label><input class="input" id="bk-pw" type="password" autocomplete="current-password"></div>`,
          actions: [
            { label: 'Entschlüsseln', value: 'ok', kind: 'primary', busy: 'Wird entschlüsselt …' },
            { label: 'Abbrechen', value: null, kind: 'ghost' }
          ],
          check: async (value, el) => {
            const pw = el.querySelector('#bk-pw').value;
            if (!pw) return { error: 'Bitte gib das Passwort ein.' };
            const plain = await LegacyBackup.decrypt(obj, pw);
            try { return { data: JSON.parse(plain) }; } catch (e) { return { error: 'Der entschlüsselte Inhalt ist beschädigt.' }; }
          }
        });
        if (!res.value) return;
        obj = res.data;
      }
      await Backup.verify(obj);
      parsed = Backup.parse(obj);
    } catch (e) {
      UI.toast(e instanceof UserError ? e.message : 'Die Datei konnte nicht gelesen werden.', 'error');
      return;
    }
    await Backup.importParsed(title, parsed);
  },
  async importParsed(title, parsed) {
    if (!parsed.products.length) { UI.toast('In der Datei wurden keine gültigen Produkte gefunden.', 'error'); return; }
    const n = parsed.products.length, r = parsed.receipts.length;
    const choice = await UI.modal({
      title,
      html: `<div class="notice notice-warn">Der Import kann vorhandene Daten überschreiben.</div>
        ${parsed.meta && parsed.meta.createdAt && !isNaN(new Date(parsed.meta.createdAt)) ? `<p class="small muted">Sicherung vom ${esc(new Date(parsed.meta.createdAt).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }))} Uhr</p>` : ''}
        <p>Gefunden: <strong>${n} ${plural(n, 'Produkt', 'Produkte')}</strong>${r ? ` und <strong>${r} ${plural(r, 'Rechnung', 'Rechnungen')}</strong>` : ', keine Rechnungsdateien'}.${parsed.skipped ? ` ${parsed.skipped} fehlerhafte ${plural(parsed.skipped, 'Eintrag wird', 'Einträge werden')} übersprungen.` : ''}</p>
        <p class="small"><strong>Ersetzen:</strong> Deine aktuellen Daten werden gelöscht und durch die Datei ersetzt.</p>
        <p class="small"><strong>Hinzufügen:</strong> Die Einträge aus der Datei kommen dazu, doppelte werden übersprungen.</p>`,
      actions: [
        { label: 'Daten hinzufügen', value: 'add', kind: 'primary' },
        { label: 'Daten ersetzen', value: 'replace', kind: 'danger-soft' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (!choice) return;
    if (choice === 'replace' && App.products.length) {
      const ok = await UI.confirm({
        title: 'Vorhandene Daten ersetzen?',
        html: `<p>${App.products.length} ${plural(App.products.length, 'gespeichertes Produkt wird', 'gespeicherte Produkte werden')} mit allen Rechnungen gelöscht.</p><p class="muted">Das kann nicht rückgängig gemacht werden.</p>`,
        confirmLabel: 'Daten ersetzen', danger: true
      });
      if (!ok) return;
    }
    try {
      const res = await Backup.apply(parsed, choice);
      await reload();
      requestPersistOnce();
      let msg = choice === 'replace' ? `${res.added} ${plural(res.added, 'Produkt', 'Produkte')} wiederhergestellt` : `${res.added} ${plural(res.added, 'Produkt', 'Produkte')} hinzugefügt`;
      if (res.dup) msg += `, ${res.dup} bereits vorhanden`;
      UI.toast(msg);
      go('dashboard', { replace: App.route.view === 'dashboard' });
    } catch (e) {
      console.error(e);
      UI.toast(storageErrorMessage(e) + ' Es wurden keine Daten geändert.', 'error');
    }
  }
};

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/**
 * ReminderBridge – Schnittstelle für echte Android-Benachrichtigungen (später).
 *
 * Was eine reine HTML-Datei NICHT kann: Benachrichtigungen zu einem Zeitpunkt planen, an dem die App
 * geschlossen ist. Dafür bräuchte es einen Service Worker plus Push-Server (widerspricht "kein Server")
 * oder eine native Schicht. In Android-Chrome ist zudem `new Notification()` nicht erlaubt.
 * Deshalb zeigt Belegwächter fällige Erinnerungen beim Öffnen der App an (Dashboard).
 *
 * Für echte Notifications später:
 *   - WebView-Wrapper (empfohlen für diesen Fall): In Kotlin ein Objekt per
 *     webView.addJavascriptInterface(obj, "GarantieBoxNative") registrieren, das die Methode
 *     scheduleReminders(json: String) bereitstellt und die Termine mit WorkManager/AlarmManager +
 *     NotificationManager plant (bei jedem Aufruf alte Termine verwerfen und neu anlegen).
 *   - TWA (Trusted Web Activity): bietet keine JavaScript-Bridge. Geplante lokale Notifications wären nur
 *     über zusätzliche native Komponenten oder Web Push mit eigenem Server möglich.
 *
 * Diese Funktion ruft die native Methode NUR auf, wenn sie wirklich existiert. Ohne native Schicht passiert nichts.
 * Übergabeformat: [{ productId, name, warrantyEnd, daysBefore, date }]
 */
const ReminderBridge = {
  available() { return !!(window.GarantieBoxNative && typeof window.GarantieBoxNative.scheduleReminders === 'function'); },
  sync(products, today) {
    if (!ReminderBridge.available()) return false;
    const payload = [];
    products.forEach(p => Reminders.schedule(p, today).forEach(s =>
      payload.push({ productId: p.id, name: p.name, warrantyEnd: p.warrantyEnd, daysBefore: s.daysBefore, date: s.date })));
    try { window.GarantieBoxNative.scheduleReminders(JSON.stringify(payload)); return true; }
    catch (e) { console.warn('ReminderBridge', e); return false; }
  }
};

/* ===================== 6b. RECHNUNG SCANNEN ===================== */
/**
 * Liest die Textebene digitaler PDF-Rechnungen (z. B. per E-Mail erhaltene Rechnungen) – ohne externe Bibliothek.
 * Unterstützt: FlateDecode/ASCIIHex/ASCII85, Objekt-Streams, ToUnicode-CMaps, WinAnsi/MacRoman/Differences,
 * Type0-Schriften (2-Byte-Codes), Form-XObjects, Text-/Grafikmatrix für die Zeilenreihenfolge.
 * Nicht unterstützt: verschlüsselte PDFs, eingescannte PDFs ohne Textebene (das sind nur Bilder).
 * Das Ergebnis ist Text Zeile für Zeile, für die anschließende Auswertung durch ReceiptParser.
 */
const PdfText = {
  bin(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return s; },
  binToBytes(s) { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; },

  async inflate(bytes, raw) {
    const ds = new DecompressionStream(raw ? 'deflate-raw' : 'deflate');
    const w = ds.writable.getWriter();
    w.write(bytes).catch(() => {}); w.close().catch(() => {});
    const r = ds.readable.getReader(), chunks = [];
    let total = 0;
    try { for (;;) { const { done, value } = await r.read(); if (done) break; chunks.push(value); total += value.length; if (total > 60e6) break; } }
    catch (e) { if (!total) throw e; } // abgeschnittene Streams: bisher Gelesenes behalten
    const out = new Uint8Array(total); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  },
  asciiHex(u8) {
    const s = PdfText.bin(u8).replace(/[^0-9a-f>]/gi, '');
    const h = s.split('>')[0], out = new Uint8Array(Math.ceil(h.length / 2));
    for (let i = 0; i < out.length; i++) out[i] = parseInt((h.substr(i * 2, 2) + '0').slice(0, 2), 16);
    return out;
  },
  ascii85(u8) {
    let s = PdfText.bin(u8).replace(/\s/g, ''); if (s.startsWith('<~')) s = s.slice(2);
    const end = s.indexOf('~>'); if (end >= 0) s = s.slice(0, end);
    const out = []; let grp = [];
    for (const ch of s) {
      if (ch === 'z' && !grp.length) { out.push(0, 0, 0, 0); continue; }
      grp.push(ch.charCodeAt(0) - 33);
      if (grp.length === 5) { let v = 0; for (const g of grp) v = v * 85 + g; out.push(v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255); grp = []; }
    }
    if (grp.length) { const n = grp.length; while (grp.length < 5) grp.push(84); let v = 0; for (const g of grp) v = v * 85 + g; const b = [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255]; out.push(...b.slice(0, n - 1)); }
    return new Uint8Array(out);
  },

  /* ---------- Objekt-Parser ---------- */
  WS: /[\x00\t\n\f\r ]/,
  DELIM: /[()<>\[\]{}\/%\x00\t\n\f\r ]/,
  skipWs(s, i) {
    for (;;) {
      while (i < s.length && PdfText.WS.test(s[i])) i++;
      if (s[i] === '%') { while (i < s.length && s[i] !== '\n' && s[i] !== '\r') i++; continue; }
      return i;
    }
  },
  /** Liest einen Wert ab Position i. Rückgabe [wert, neuePosition]. */
  parse(s, i) {
    i = PdfText.skipWs(s, i);
    const c = s[i];
    if (c === '<' && s[i + 1] === '<') {
      i += 2; const d = { t: 'd', v: Object.create(null) };
      for (;;) {
        i = PdfText.skipWs(s, i);
        if (i >= s.length) return [d, i];
        if (s[i] === '>' && s[i + 1] === '>') return [d, i + 2];
        const [k, j] = PdfText.parse(s, i);
        if (!k || k.n === undefined) { i = j > i ? j : i + 1; continue; }
        const [v, j2] = PdfText.parse(s, j);
        d.v[k.n] = v; i = j2;
      }
    }
    if (c === '<') {
      const e = s.indexOf('>', i); const h = s.slice(i + 1, e < 0 ? s.length : e).replace(/[^0-9a-f]/gi, '');
      let out = ''; for (let k = 0; k < h.length; k += 2) out += String.fromCharCode(parseInt((h.substr(k, 2) + '0').slice(0, 2), 16));
      return [{ s: out }, e < 0 ? s.length : e + 1];
    }
    if (c === '(') {
      let depth = 1, out = ''; i++;
      while (i < s.length && depth) {
        const ch = s[i];
        if (ch === '\\') {
          const n = s[i + 1];
          const map = { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', '(': '(', ')': ')', '\\': '\\' };
          if (n in map) { out += map[n]; i += 2; }
          else if (/[0-7]/.test(n)) { let o = ''; let k = i + 1; while (k < i + 4 && /[0-7]/.test(s[k])) o += s[k++]; out += String.fromCharCode(parseInt(o, 8) & 255); i = k; }
          else if (n === '\r') { i += s[i + 2] === '\n' ? 3 : 2; }
          else if (n === '\n') { i += 2; }
          else { i += 1; }
          continue;
        }
        if (ch === '(') depth++;
        else if (ch === ')') { depth--; if (!depth) { i++; break; } }
        out += ch; i++;
      }
      return [{ s: out }, i];
    }
    if (c === '[') {
      const a = []; i++;
      for (;;) {
        i = PdfText.skipWs(s, i);
        if (i >= s.length) return [a, i];
        if (s[i] === ']') return [a, i + 1];
        const [v, j] = PdfText.parse(s, i);
        if (j <= i) { i++; continue; }
        a.push(v); i = j;
      }
    }
    if (c === '/') {
      let j = i + 1; while (j < s.length && !PdfText.DELIM.test(s[j])) j++;
      return [{ n: s.slice(i + 1, j).replace(/#([0-9a-f]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16))) }, j];
    }
    const num = /^[+-]?(\d+\.?\d*|\.\d+)/.exec(s.slice(i, i + 32));
    if (num) {
      const j = i + num[0].length;
      // Referenz "12 0 R"
      const ref = /^\s+(\d+)\s+R(?![A-Za-z])/.exec(s.slice(j, j + 24));
      if (ref && /^\d+$/.test(num[0])) return [{ r: +num[0] }, j + ref[0].length];
      return [parseFloat(num[0]), j];
    }
    let j = i; while (j < s.length && !PdfText.DELIM.test(s[j])) j++;
    if (j === i) return [null, i + 1];
    const w = s.slice(i, j);
    if (w === 'true') return [true, j]; if (w === 'false') return [false, j]; if (w === 'null') return [null, j];
    return [{ op: w }, j];
  },

  /* ---------- Dokument laden ---------- */
  async load(u8) {
    const s = PdfText.bin(u8);
    if (!/^%PDF-/.test(s.slice(0, 1024).trimStart()) && s.indexOf('%PDF-') < 0) throw new UserError('Die Datei ist keine gültige PDF.');
    const objs = new Map();
    const re = /(\d+)\s+(\d+)\s+obj\b/g;
    let m;
    while ((m = re.exec(s))) {
      let [v, i] = PdfText.parse(s, m.index + m[0].length);
      const o = { v, raw: null };
      i = PdfText.skipWs(s, i);
      if (s.startsWith('stream', i)) {
        let ds = i + 6; if (s[ds] === '\r') ds++; if (s[ds] === '\n') ds++;
        let len = v && v.t === 'd' ? v.v.Length : null;
        if (len && len.r !== undefined) { const lo = objs.get(len.r); len = lo && typeof lo.v === 'number' ? lo.v : null; }

      const d = PdfText.dict(doc, node);
      if (!d || depth > 20 || pages.length >= maxPages) return;
      const r = d.Resources || res;
      if (PdfText.name(PdfText.get(doc, d.Type)) === 'Pages' || d.Kids) (PdfText.get(doc, d.Kids) || []).forEach(k => walk(k, r, depth + 1));
      else pages.push({ d, res: r });
    };
    if (cat) walk(cat.v.v.Pages, null, 0);
    if (!pages.length) for (const o of doc.objs.values()) if (o.v && o.v.t === 'd' && PdfText.name(o.v.v.Type) === 'Page' && pages.length < maxPages) pages.push({ d: o.v.v, res: o.v.v.Resources });
    const out = [];
    for (const p of pages) {
      let c = PdfText.get(doc, p.d.Contents);
      const refs = Array.isArray(c) ? c : [p.d.Contents];
      const parts = [];
      for (const ref of refs) { const d = await PdfText.stream(doc, PdfText.obj(doc, ref)); if (d) parts.push(d); }
      const total = parts.reduce((n, x) => n + x.length + 1, 0), all = new Uint8Array(total);
      let o = 0; for (const x of parts) { all.set(x, o); o += x.length; all[o++] = 10; }
      const items = [];
      await PdfText.run(doc, all, p.res, [1, 0, 0, 1, 0, 0], items, 0);
      out.push(PdfText.lines(items).join('\n'));
    }
    return out.join('\n');
  }
};

    ['Möbel', /\bsofa\b|couch|\btisch\b|esstisch|schreibtisch|\bstuhl\b|schrank|regal|\bbett\b|matratze|kommode|sessel/i],

  MONTHS: { jan: 1, januar: 1, feb: 2, februar: 2, mär: 3, mar: 3, märz: 3, maerz: 3, apr: 4, april: 4, mai: 5, jun: 6, juni: 6,
    jul: 7, juli: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, okt: 10, oktober: 10, nov: 11, november: 11, dez: 12, dezember: 12 },

  lines(text) {
    return String(text || '').replace(/\u00a0/g, ' ').split(/\r?\n|\r/).map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
  },

  /* ---------- Datum ---------- */
  DATE_RE: /(?<![\d.])(\d{1,2})\s?[.\/-]\s?(\d{1,2})\s?[.\/-]\s?(\d{4}|\d{2})(?![\d])|(?<!\d)(\d{4})-(\d{2})-(\d{2})(?!\d)|(?<!\d)(\d{1,2})\.?\s+(januar|februar|m[äa]rz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember|jan|feb|mär|mar|apr|jun|jul|aug|sept|sep|okt|nov|dez)\.?\s+(\d{4})(?!\d)/gi,
  dateMatches(line, today) {
    const out = [];
    const cy = +today.slice(0, 4);
    ReceiptParser.DATE_RE.lastIndex = 0;
    let m;
    while ((m = ReceiptParser.DATE_RE.exec(line))) {
      let d, mo, y;
      if (m[1]) { d = +m[1]; mo = +m[2]; y = +m[3]; if (m[3].length === 2) y = y + 2000 > cy ? 1900 + y : 2000 + y; }
      else if (m[4]) { y = +m[4]; mo = +m[5]; d = +m[6]; }
      else { d = +m[7]; mo = ReceiptParser.MONTHS[m[8].toLowerCase()]; y = +m[9]; }
      if (!mo) continue;
      const iso = `${String(y).padStart(4, '0')}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      out.push({ iso, index: m.index, len: m[0].length });
    }
    return out;
  },
  findDate(lines, today, isValid) {
    const minYear = +today.slice(0, 4) - 30;
    const kw = [
      [/kaufdatum|verkaufsdatum|belegdatum|bondatum|kassenbon|kauf am|gekauft am/i, 6],
      [/rechnungsdatum|rechnungs-datum|invoice date|datum der rechnung/i, 5],
      [/lieferdatum|leistungsdatum|liefer-?\/?leistungsdatum|versanddatum/i, 3],
      [/bestelldatum|auftragsdatum|order date/i, 2],
      [/datum|date\b/i, 3]
    ];
    const bad = /f[äa]llig|zahlbar\s+bis|g[üu]ltig\s+bis|garantie\s+bis|mhd|geburt|ablauf|valuta|zahlungsziel|lieferung\s+bis|bis\s+zum/i;
    let best = null;
    lines.forEach((line, i) => {
      for (const c of ReceiptParser.dateMatches(line, today)) {
        if (!isValid(c.iso) || c.iso > today || +c.iso.slice(0, 4) < minYear) continue;
        const ctx = line.slice(0, c.index) + ' ' + (i > 0 && !/\d/.test(lines[i - 1]) ? lines[i - 1] : '');
        let score = 1;
        for (const [re, w] of kw) if (re.test(ctx)) { score = Math.max(score, w); }
        if (bad.test(ctx)) score = -10;
        if (!best || score > best.score) best = { iso: c.iso, score };
      }
    });
    return best && best.score > 0 ? best.iso : null;
  },

  /* ---------- Beträge ---------- */
  AMOUNT_RE: /(?<![\d.,])(-\s?)?(\d{1,3}(?:\.\d{3})+,\d{2}|\d{1,3}(?:,\d{3})+\.\d{2}|\d{1,3}(?:'\d{3})+[,.]\d{2}|\d+ ?[,.] ?\d{2})(?![\d])(\s?-)?/g,
  toCents(s) {
    let t = s.replace(/[ ']/g, '');
    if (/,\d{2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.'); else t = t.replace(/,/g, '');
    const c = Math.round(parseFloat(t) * 100);
    return Number.isFinite(c) ? c : null;
  },
  /** Beträge einer Zeile – Datumsangaben und Uhrzeiten werden vorher ausgeblendet. */
  amounts(line, today) {
    let clean = line;
    for (const d of ReceiptParser.dateMatches(line, today)) clean = clean.slice(0, d.index) + ' '.repeat(d.len) + clean.slice(d.index + d.len);
    clean = clean.replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g, m => ' '.repeat(m.length));
    const out = [];
    ReceiptParser.AMOUNT_RE.lastIndex = 0;
    let m;
    while ((m = ReceiptParser.AMOUNT_RE.exec(clean))) {
      if (m[1] || m[3]) continue; // Rabatte/Gutschriften
      const after = clean.slice(m.index + m[0].length, m.index + m[0].length + 4);
      if (/^\s?%/.test(after)) continue; // Steuersätze wie 19,00 %
      const c = ReceiptParser.toCents(m[2]);
      if (c != null && c > 0 && c < 1e8) out.push({ cents: c, index: m.index });
    }
    return out;
  },
  TOTAL_KW: [
    [/gesamtbetrag|rechnungsbetrag|endbetrag|gesamtsumme|zu\s+zahlen|zahlbetrag|bruttobetrag|summe\s+brutto|gesamt\s+brutto|brutto\s*summe|total\s+eur|amount\s+due|grand\s+total/i, 10],
    [/\bsumme\b|\bgesamt\b|\btotal\b|\bbrutto\b/i, 8],
    [/\bbetrag\b/i, 5],
    [/ec-?karte|girocard|kreditkarte|\bvisa\b|mastercard|maestro|paypal|kartenzahlung|\bbar\b|apple\s*pay|google\s*pay|klarna/i, 4],
    [/zwischensumme|subtotal/i, 3]
  ],
  NOT_TOTAL: /mwst|m\.w\.st|\bust\b|umsatzsteuer|steuer|netto|rabatt|nachlass|gutschein|gegeben|r[üu]ckgeld|zur[üu]ck|wechselgeld|pfand|anzahlung|versand(?!kostenfrei)|nettobetrag|ersparnis|gespart|coupon|%/i,
  findTotal(lines, today) {
    let best = null;
    lines.forEach((line, i) => {
      if (ReceiptParser.NOT_TOTAL.test(line)) return;
      let w = 0;
      for (const [re, weight] of ReceiptParser.TOTAL_KW) if (re.test(line)) { w = Math.max(w, weight); }
      let amts = ReceiptParser.amounts(line, today);
      // Schlüsselwort ohne Betrag: Betrag steht in der nächsten Zeile
      if (w && !amts.length && lines[i + 1] && !ReceiptParser.NOT_TOTAL.test(lines[i + 1]) && /^[\s\d.,'€EURur-]+$/.test(lines[i + 1])) amts = ReceiptParser.amounts(lines[i + 1], today);
      if (!w || !amts.length) return;
      const cents = Math.max(...amts.map(a => a.cents));
      if (!best || w > best.w || (w === best.w && cents > best.cents)) best = { cents, w, line: i };

    return best;
  },

  /* ---------- Händler ---------- */
  findRetailer(lines) {
    const text = lines.join('\n');
    let best = null;
    for (const [re, name] of ReceiptParser.RETAILERS) {
      const m = re.exec(text);
      if (m && (!best || m.index < best.index)) best = { name, index: m.index };
    }
    if (best) return best.name;
    // Absenderzeile über der Anschrift, z. B. „IS-RACING, Im Kröpsch 3a, 53940 Hellenthal“
    for (const line of lines.slice(0, 14)) {
      const m = /^([^,]{2,40}?)\s*,\s*[^,]*?\d+\s*[a-z]?\s*,\s*\d{5}\s+\S+/i.exec(line);
      if (m && /[a-zäöü]{2}/i.test(m[1]) && !/rechnung|kunde|datum|straße|str\./i.test(m[1])) return m[1].replace(/\s+(gmbh|ag|kg|ug|ohg|e\.\s?k\.)\b.*$/i, '').trim();
    }
    // Internetadresse des Händlers, z. B. „www.is-racing.de“
    const w = /\bwww\s?[.,]\s?([a-z0-9-]{3,40})(?:\s?[.,]\s?|\s)(de|com|at|ch|eu|net|shop)\b/i.exec(text);
    if (w) return w[1].toLowerCase().split('-').map(x => x.charAt(0).toUpperCase() + x.slice(1)).join('-');
    for (const line of lines.slice(0, 8)) {
      const m = /^(.{2,60}?)\s+(gmbh|ag|kg|e\.\s?k\.|ohg|ug|se|ltd\.?|inc\.?)\b/i.exec(line.replace(/\s*&\s*co\.?\s*/i, ' '));
      if (m && /[a-zäöü]{2}/i.test(m[1]) && !/rechnung|kunde|datum/i.test(m[1])) return m[1].replace(/[,;:]+$/, '').trim();

  },

  /* ---------- Serien- und Modellnummer ---------- */
  findSerial(text) {
    const m = /(?:\bs\/?n\b|seriennummer|serien-?nr\.?|serial\s*(?:no\.?|number)?)\s*[:#.]?\s*((?=[A-Z0-9\-\/]*\d)[A-Z0-9][A-Z0-9\-\/]{4,39})/i.exec(text)
      || /\bimei\s*(?:1)?\s*[:#]?\s*(\d{15})\b/i.exec(text)
      || /\b(?:fin|vin|fahrgestell(?:nummer|-?nr\.?)?)\s*[:#.]?\s*([A-HJ-NPR-Z0-9]{17})\b/i.exec(text)
      || /\b((?=[A-HJ-NPR-Z0-9]{17}\b)(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-HJ-NPR-Z])[A-HJ-NPR-Z0-9]{17})\b/.exec(text); // Fahrzeug-Identnummer (FIN)
    return m ? m[1].toUpperCase() : null;
  },
  findModel(text) {
    const m = /(?:modell(?:nummer|-?nr\.?|bezeichnung)?|model(?:\s*(?:no\.?|number))?|typ(?:e)?(?:nummer)?)\s*[:#]\s*([A-Z0-9][A-Z0-9\-\/.]{3,39})/i.exec(text);
    return m ? m[1].toUpperCase().replace(/[.\-\/]+$/, '') : null;
  },
  isModelToken(t) {
    if (/^[A-HJ-NPR-Z0-9]{17}$/i.test(t) && /\d/.test(t) && /[a-z]/i.test(t)) return false; // FIN gehört zur Seriennummer
    return t.length >= 6 && t.length <= 24 && /^[A-Z0-9][A-Z0-9\-\/]*$/i.test(t) && (t.match(/\d/g) || []).length >= 2
      && (t.match(/[A-Z]/gi) || []).length >= 2 && !/^\d+(gb|tb|mb|mah|wh|kw|w|v|l|kg|cm|mm|zoll|hz|u\/min|upm)$/i.test(t)
      && !/^\d{6,}$/.test(t);
  },

  /* ---------- Produktname ---------- */
  NOT_PRODUCT: /summe|gesamt|total|betrag|mwst|m\.w\.st|\bust\b|steuer|netto|brutto|rabatt|datum|uhrzeit|\bzeit\b|kasse|\bbon\b|beleg|filiale|markt\s*-?nr|\bstr(\.|a[ßs]e)|stra[ßs]e|platz\b|\btel\b|tel\.|telefon|fax|www\.|http|e-?mail|@|steuer-?nr|ust-?id|hrb\b|amtsgericht|gesch[äa]ftsf[üu]hr|iban|\bbic\b|\bbank\b|kunde|kundennr|rechnung|lieferschein|seite\s+\d|vielen\s+dank|danke|[öo]ffnungszeiten|zahlung|ec-?karte|girocard|visa|mastercard|terminal|trace|genehmigung|autorisierung|karten-?nr|gegeben|r[üu]ckgeld|posten|\bmenge\b|bezeichnung|einzelpreis|\bpos\.?\b|garantie|gewährleistung|gewaehrleistung|umtausch|r[üu]ckgabe|pfand|versand|lieferung|seriennummer|\bs\/n\b|imei|\bean\b|artikel-?nr|art\.?-?nr|bestell|auftrag|verk[äa]ufer|bedient|mitarbeiter|\bmo\b.*\bsa\b|\bmontag|kopie|original|\bbar\b|coupon|payback|\bsteuer|\bid\b|nummer|nr\.\s*\d/i,
  BRAND_RE: null,
  brandRe() {
    if (!ReceiptParser.BRAND_RE) {
      const alt = ReceiptParser.BRANDS.map(b => b.replace(/[.*+?^${}()|[\]\\']/g, m => m === "'" ? "['’]?" : '\\' + m)).join('|');
      ReceiptParser.BRAND_RE = new RegExp('(?:^|[^a-zäöü])(' + alt + ')(?![a-zäöü])', 'i');
    }
    return ReceiptParser.BRAND_RE;
  },
  typeOf(text) { for (const [cat, re] of ReceiptParser.CATEGORY_RULES) if (re.test(text)) return cat; return null; },
  /** Großbuchstaben-Zeilen (typisch für Kassenbons) lesbar machen, Modellnummern und Abkürzungen bleiben. */
  prettify(name) {
    const letters = name.replace(/[^a-zäöüß]/gi, '');
    const upper = letters.replace(/[^A-ZÄÖÜ]/g, '').length;
    const brands = new Map(ReceiptParser.BRANDS.map(b => [b.toUpperCase(), b]));
    if (!letters.length || upper / letters.length < 0.7) return name.split(' ').map(w => brands.get(w.toUpperCase()) || w).join(' ');
    const keep = /^(LG|HP|AEG|JBL|TV|USB|LED|OLED|QLED|SSD|HDD|WLAN|WIFI|XL|XXL|UHD|HD|PC|MSI|AVM|TCL|WMF|GPS|NFC|DAB|CD|DVD|AI|LTE|5G|4G|4K|8K|RGB|HDMI|IPS|AMD|DECT|MP3|DSLR|ANC|ASUS|BOSE|SMEG)$/;
    return name.split(' ').map(w => {
      if (brands.has(w.toUpperCase())) return brands.get(w.toUpperCase());
      if (keep.test(w) || /\d/.test(w)) return w;
      const lw = w.toLowerCase();
      if (/^(der|die|das|und|mit|für|fur|von|zum|zur|aus|bis|in|am|im|an|auf|ein|oder|als|inkl|cm|mm|ml|kg|st|stk)$/.test(lw)) return lw;
      if (/^[A-ZÄÖÜ]{2,3}$/.test(w) && !/^(neu|set|rot|pro|max|air|one|duo|kit|box|top|alt|bau|tab|mit|ohne)$/.test(lw)) return w;
      if (/^I(PHONE|PAD|MAC)/i.test(w)) return 'i' + w.charAt(1).toUpperCase() + w.slice(2).toLowerCase();
      return w.charAt(0) + w.slice(1).toLowerCase();
    }).join(' ');
  },
  cleanName(line, today) {
    let s = line;
    for (const a of ReceiptParser.amounts(s, today).reverse()) s = s.slice(0, a.index) + ' ' + s.slice(a.index).replace(/^\S+/, ' ');
    s = s.replace(/(?:€|\beur\b)/gi, ' ')
      .replace(/(?<![\w.,])\d{1,2}(?:[,.]\d+)?\s?%/g, ' ')    // Steuersätze
      .replace(/^\s*(?:\d{1,3}\s+){1,3}(?=[A-Za-zÄÖÜ])/, '')  // Position/Menge am Zeilenanfang
      .replace(/^\s*\d+\s*(?:x|stk\.?|st\.?|stück)\s+/i, '')

      .replace(/^\s*\d{4,7}\s+/, '')            // führende Artikelnummer

      .replace(/[|_*#]+/g, ' ').replace(/\s{2,}/g, ' ').replace(/^[\s,.;:-]+|[\s,.;:-]+$/g, '');

  },
  findProduct(lines, today, totalLine, retailer) {

    const usable = line => line && !ReceiptParser.NOT_PRODUCT.test(line) && !/\b\d{5}\s+[A-ZÄÖÜ][a-zäöü]/.test(line)

      && !(retailer && line.toLowerCase().replace(/\s/g, '').includes(retailer.toLowerCase().replace(/\s/g, '')));

    lines.forEach((line, i) => {

      if (ReceiptParser.typeOf(name)) score += 5;

    cands.forEach(c => { if (c.cents && c.cents === maxC) c.score += 3; });

  },

  /** Hauptfunktion. today = ISO-Datum, isValid = Datumsprüfung (aus DateUtil). */
  BILLING: /^(d[z2][r1]|ozr|pvs|zab|abz|bfs|unimed|mediserv|medas|dmrz|rzh|health|avp|ihre-zahnabrechnung)\b/i,
  /** Art der Dienstleistung anhand typischer Wörter (auch bei Lesefehlern im Briefkopf). */
  serviceKind(text) {
    const t = text.toLowerCase();
    if (/tierarzt|tierärzt|tierklinik|\bgot\b/.test(t)) return 'Tierarztrechnung';
    if (/zahnarzt|zahnärzt|zahnmedizin|kavit[aä]t|\bbema\b|zähne|zahne|füllmaterial|fullmaterial|prophylaxe|kieferorthop|zahnreinigung|implantat/.test(t)) return 'Zahnarztrechnung';
    if (/\bgo[aä]\b|ärztliche|arztpraxis|hausarzt|facharzt|behandelte person|behandlungszeitraum|patient/.test(t)) return 'Arztrechnung';
    if (/werkstatt|inspektion|hauptuntersuchung|ölwechsel|olwechsel|reifenwechsel|probefahrt|kfz-meister/.test(t)) return 'Werkstattrechnung';
    return null;
  },
  /** Grobe Plausibilität einer erkannten Zeile: überwiegend Buchstaben, kein Zeichensalat. */
  looksClean(name) {

  parse(text, today, isValid) {
    const lines = ReceiptParser.lines(text);
    const out = { name: null, category: null, purchaseDate: null, price: null, priceCents: null, retailer: null, serialNumber: null, modelNumber: null };
    if (!lines.length) return out;
    const joined = lines.join('\n');
    out.retailer = ReceiptParser.findRetailer(lines);
    // Abrechnungsstellen (z. B. für Zahnärzte) sind nicht der eigentliche Anbieter
    if (out.retailer && ReceiptParser.BILLING.test(out.retailer)) out.retailer = null;
    out.purchaseDate = ReceiptParser.findDate(lines, today, isValid);
    const total = ReceiptParser.findTotal(lines, today);
    if (total) { out.priceCents = total.cents; out.price = (total.cents / 100).toFixed(2).replace('.', ','); }
    out.serialNumber = ReceiptParser.findSerial(joined);
    let found = ReceiptParser.findProduct(lines, today, total ? total.line : null, out.retailer);
    if (!found || !found.strong) {
      // Dienstleistung statt Produkt: verständlicher Name statt einer zufälligen Zeile
      const kind = ReceiptParser.serviceKind(text);
      if (kind) found = { name: kind + (out.retailer ? ' ' + out.retailer : ''), strong: false, cents: 0 };
      else if (found && out.retailer) found = { name: 'Rechnung ' + out.retailer, strong: false, cents: 0 };
      else if (found && !ReceiptParser.looksClean(found.name)) found = null;
    }
    let product = found ? found.name : null;
    let model = ReceiptParser.findModel(joined);
    // Mehrere Artikel auf der Rechnung: Für die Garantie zählt der Preis des Produkts, nicht die Gesamtsumme.
    if (found && found.strong && found.cents && total && found.cents < total.cents) { out.priceCents = found.cents; out.price = (found.cents / 100).toFixed(2).replace('.', ','); }
    if (product) {
      product = ReceiptParser.prettify(product);
      const words = product.split(' ');
      const mi = words.findIndex(ReceiptParser.isModelToken);
      if (!model && mi >= 0) model = words[mi].toUpperCase();
      // Modellnummer aus dem Namen lösen, wenn danach noch ein sinnvoller Name übrig bleibt.
      if (model) {
        const rest = words.filter(w => w.toUpperCase() !== model).join(' ').trim();
        if ((rest.match(/[a-zäöüß]/gi) || []).length >= 6) product = rest;
      }
      if (out.serialNumber) product = product.split(' ').filter(w => w.toUpperCase() !== out.serialNumber).join(' ').trim();
      out.name = product.slice(0, 200);
    }
    out.modelNumber = model && model !== out.serialNumber ? model : null;
    out.category = ReceiptParser.typeOf((out.name || '') + ' ' + (product ? '' : joined));

  }
};

  /** Schräglage in Grad (positiv = im Uhrzeigersinn gedreht). */
  skewAngle(g, w, h, range = 12) {

    if (pts.length < 400) return 0;
    const n = pts.length / 2, stride = n > 80000 ? Math.ceil(n / 80000) : 1, off = sw + sh;
    const score = deg => {
      const a = deg * Math.PI / 180, si = Math.sin(a), co = Math.cos(a), hist = new Float64Array(2 * off + 2);
      for (let k = 0; k < pts.length; k += 2 * stride) hist[Math.round(pts[k + 1] * co - pts[k] * si) + off]++;
      let sc = 0; for (let i = 0; i < hist.length; i++) sc += hist[i] * hist[i]; return sc;
    };
    let best = 0, bestS = -1;
    for (let deg = -range; deg <= range; deg += 1) { const s1 = score(deg); if (s1 > bestS) { bestS = s1; best = deg; } }

    for (let deg = c0 - 0.9; deg <= c0 + 0.91; deg += 0.15) { const s1 = score(deg); if (s1 > bestS) { bestS = s1; best = deg; } }
