<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="Belegwächter – Produkte, Rechnungen und Garantiefristen lokal auf dem Gerät verwalten.">
<title>Belegwächter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect x=%228%22 y=%228%22 width=%22496%22 height=%22496%22 rx=%22118%22 fill=%22%232a48a8%22/%3E%3Cg transform=%22translate%28256 256%29 scale%28.92%29 translate%28-256 -256%29%22%3E%3Cg transform=%22translate%28-14 0%29%22%3E%3Crect x=%22150%22 y=%22118%22 width=%22196%22 height=%22276%22 rx=%2218%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%2226%22/%3E%3Crect x=%22194%22 y=%22176%22 width=%22108%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22220%22 width=%22108%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22264%22 width=%2246%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Crect x=%22194%22 y=%22308%22 width=%2246%22 height=%2222%22 rx=%2211%22 fill=%22%23ffffff%22/%3E%3Cpath d=%22M266 282 L308 324 L404 218%22 fill=%22none%22 stroke=%22%232a48a8%22 stroke-width=%2278%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M266 282 L308 324 L404 218%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%2242%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
/* =========================================================
   DESIGN-TOKENS
   Hell = Standard, Dunkel per System oder manuell (data-theme)
   ========================================================= */
:root{
  --bg:#eef1f4; --bg-blur:rgba(238,241,244,.86);
  --surface:#ffffff; --surface-2:#f6f8fa; --sunken:#e4e8ed;
  --ink:#15202b; --ink-2:#3d4a57; --muted:#6b7784;
  --line:#dde3e9; --line-strong:#c7cfd8;
  --accent:#2a48a8; --accent-ink:#ffffff; --accent-soft:#e3e9f8;
  --ok:#23945f; --ok-soft:#dcf1e6; --ok-ink:#17653f;
  --warn:#c9950f; --warn-soft:#f8eed0; --warn-ink:#6e5207;
  --soon:#dc6a24; --soon-soft:#fbe4d5; --soon-ink:#8f3f0e;
  --bad:#cc3b3b; --bad-soft:#f7dede; --bad-ink:#8f2222;
  --shadow:0 1px 1px rgba(21,32,43,.04), 0 6px 18px -8px rgba(21,32,43,.12);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --nav-h:76px; /* Platz unten für den Hinzufügen-Button */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --bg-blur:rgba(15,20,26,.86);
    --surface:#171e26; --surface-2:#1c242e; --sunken:#232c37;
    --ink:#e6ebf1; --ink-2:#c1cad4; --muted:#8a96a3;
    --line:#26303b; --line-strong:#34404d;
    --accent:#8ea6ff; --accent-ink:#0e1733; --accent-soft:#1d2744;
    --ok:#46c287; --ok-soft:#14301f; --ok-ink:#86e0b3;
    --warn:#e6b43a; --warn-soft:#322811; --warn-ink:#f2d27c;
    --soon:#f08a4b; --soon-soft:#3a2416; --soon-ink:#f7b58b;
    --bad:#ef6a6a; --bad-soft:#3a1b1d; --bad-ink:#f7a3a3;
    --shadow:0 1px 1px rgba(0,0,0,.2), 0 8px 22px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --bg-blur:rgba(15,20,26,.86);
  --surface:#171e26; --surface-2:#1c242e; --sunken:#232c37;
  --ink:#e6ebf1; --ink-2:#c1cad4; --muted:#8a96a3;
  --line:#26303b; --line-strong:#34404d;
  --accent:#8ea6ff; --accent-ink:#0e1733; --accent-soft:#1d2744;
  --ok:#46c287; --ok-soft:#14301f; --ok-ink:#86e0b3;
  --warn:#e6b43a; --warn-soft:#322811; --warn-ink:#f2d27c;
  --soon:#f08a4b; --soon-soft:#3a2416; --soon-ink:#f7b58b;
  --bad:#ef6a6a; --bad-soft:#3a1b1d; --bad-ink:#f7a3a3;
  --shadow:0 1px 1px rgba(0,0,0,.2), 0 8px 22px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ================= BASIS ================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ================= LAYOUT ================= */
.topbar{
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--bg-blur);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
}
.topbar-inner{max-width:760px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px}
.topbar-inner.has-back{padding-left:6px}
.topbar .title{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-size:clamp(20px,6vw,24px);font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name b{font-weight:800;color:var(--accent)}
.brand-date{font-size:14px;color:var(--muted);white-space:nowrap;flex:none}
@media (max-width:399px){.brand-date{display:none}}
.icon-btn{
  width:48px;height:48px;flex:none;display:inline-grid;place-items:center;border:0;border-radius:14px;
  background:transparent;color:var(--ink);cursor:pointer;text-decoration:none
}
.icon-btn:active{background:var(--sunken)}
.icon-btn svg{width:24px;height:24px}

main{max-width:760px;margin:0 auto;padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}
body.kb-open main{padding-bottom:40px}
.view{display:flex;flex-direction:column;gap:22px}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:18px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}

/* ================= BOTTOM-NAVIGATION ================= */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.kb-open .bottom-nav{display:none}
.bottom-nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);text-decoration:none;font-size:clamp(9.5px,2.6vw,11.5px);letter-spacing:-.015em;font-weight:600;min-width:0
}
.nav-item .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:var(--accent)}
.nav-item .nav-plus{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);margin-top:-2px
}
.nav-item.nav-add{color:var(--ink-2)}
.nav-item.nav-add.active{color:var(--accent)}
.nav-item.nav-add span.lbl{margin-top:1px}

/* ================= BUTTONS ================= */
.btn{
  min-height:50px;padding:0 20px;border-radius:var(--r-md);border:1px solid transparent;
  font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;text-decoration:none;text-align:center;line-height:1.2;
  transition:transform .08s ease, background-color .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:active{background:var(--sunken)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-soft{background:var(--bad-soft);color:var(--bad-ink)}
.btn-block{width:100%}
.btn-lg{min-height:58px;font-size:17px;border-radius:16px}
.btn-sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > .btn{flex:1 1 180px}
.card.scan-card{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.scan-head{display:flex;gap:12px;align-items:flex-start}
.scan-ico{font-size:28px;line-height:1}
.scan-rows{display:flex;flex-direction:column;gap:12px}
.sheet:has(.scan-rows) .sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -20px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 18px -12px rgba(0,0,0,.25);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet:has(.scan-rows) .sheet-actions button[data-i="0"]{grid-column:1/-1}
.scan-row{display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:end}
.scan-check{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:52px;cursor:pointer}
.scan-check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.scan-check span{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center}
.scan-check input:checked + span{background:var(--ok);border-color:var(--ok)}
.scan-check input:checked + span::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.scan-check input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.scan-ok{font-size:12px;font-weight:700;color:var(--ok-ink);background:var(--ok-soft);border-radius:999px;padding:1px 8px;margin-left:4px}
.scan-attach{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600;color:var(--ink);cursor:pointer}
.scan-attach input{width:22px;height:22px;accent-color:var(--accent)}
.scan-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:650}
.scan-raw{white-space:pre-wrap;word-break:break-word;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;margin:0}
.link-btn{border:0;background:none;color:var(--accent);font-weight:650;font-size:15px;min-height:44px;padding:0 4px;cursor:pointer}

/* ================= KARTEN ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-title{font-size:16px;font-weight:700;margin-bottom:10px}

/* Übersicht */
.overview{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);
  padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-height:96px;box-shadow:var(--shadow);
  cursor:pointer;color:inherit;font:inherit
}
.stat:active{transform:scale(.985)}
.stat-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.stat-sub{font-size:13px;color:var(--muted)}
.stat.value{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between;min-height:0;cursor:default;padding:14px 16px}
.stat.value:active{transform:none}
.stat.value .stat-num{font-size:24px;margin:0}

/* Status */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.s-active .dot,.dot.s-active{background:var(--ok)}
.s-soon .dot,.dot.s-soon{background:var(--warn)}
.s-critical .dot,.dot.s-critical{background:var(--soon)}
.s-expired .dot,.dot.s-expired{background:var(--bad)}
.status{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;font-weight:650;font-size:14px;width:max-content;max-width:100%}
.status.s-active{background:var(--ok-soft);color:var(--ok-ink)}
.status.s-soon{background:var(--warn-soft);color:var(--warn-ink)}
.status.s-critical{background:var(--soon-soft);color:var(--soon-ink)}
.status.s-expired{background:var(--bad-soft);color:var(--bad-ink)}

/* Restlaufzeit-Balken: das wiederkehrende Kernelement */
.life{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.life > span{display:block;height:100%;border-radius:99px}
.life.s-active > span{background:var(--ok)}
.life.s-soon > span{background:var(--warn)}
.life.s-critical > span{background:var(--soon)}
.life.s-expired > span{background:var(--bad)}

/* Produktkarten */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.pcard{
  display:flex;flex-direction:column;gap:12px;padding:16px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)
}
.pcard:active{transform:scale(.99)}
.pcard-top{display:flex;gap:12px;align-items:flex-start}
.cat-badge{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:21px;flex:none}
.pcard-name{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pcard-sub{font-size:14px;color:var(--muted);margin-top:2px}
.pcard-receipt{margin-left:auto;flex:none;color:var(--muted);display:flex}
.pcard-receipt svg{width:18px;height:18px}
.pcard-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pcard-price{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pcard-price.none{font-weight:500;color:var(--muted);font-size:15px}
.pcard-foot{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* Kompakte Liste (Dashboard) */
.rows{padding:4px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:64px;text-decoration:none;color:inherit}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main strong{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:14px}
.row .dot{width:12px;height:12px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.t-active{color:var(--ok-ink)} .t-soon{color:var(--warn-ink)} .t-critical{color:var(--soon-ink)} .t-expired{color:var(--bad-ink)}

/* Erinnerungen */
.reminders{border-color:var(--warn);background:var(--warn-soft)}
.reminders .card-title{display:flex;align-items:center;gap:8px;color:var(--warn-ink)}
.rem-item{display:flex;align-items:center;gap:12px;padding:10px 0}
.rem-item + .rem-item{border-top:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.rem-item a{flex:1;min-width:0;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.rem-item a strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rem-item a span{font-size:14px;color:var(--ink-2)}

/* Suche, Chips, Selects */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{padding-left:44px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer
}
.chip .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .count{color:inherit;opacity:.7}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-count{font-size:14px;color:var(--muted)}

/* Formulare */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field-label{font-size:14.5px;font-weight:650;color:var(--ink-2)}
.req{color:var(--bad)}
.input,.select select,textarea.input{
  width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--surface-2);font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none
}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.input:focus,.select select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.select{position:relative}
.select select{padding-right:36px;cursor:pointer;text-overflow:ellipsis}
.filters .select select{padding-left:12px;font-size:15px}
.select::after{
  content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;margin-top:-7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none
}
input[type="date"].input{min-height:52px;display:block}
.date-wrap{position:relative}
.date-wrap > .input{padding-right:56px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.date-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.date-btn svg{width:22px;height:22px;pointer-events:none}
.date-proxy{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.date-proxy::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.affix{position:relative}
.affix .input{padding-right:40px}
.affix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.hint{font-size:13.5px;color:var(--muted)}
.err{font-size:14px;color:var(--bad-ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.form-section-title{font-size:16px;font-weight:700}
.preview{
  display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;
  background:var(--accent-soft);color:var(--ink)
}
.preview strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{position:relative}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:15px
}
.toggle span::before{
  content:"";width:18px;height:18px;border-radius:5px;border:2px solid var(--line-strong);background:var(--surface);flex:none
}
.toggle input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/**
 * Datumslogik ausschließlich auf Kalendertagen im Format "YYYY-MM-DD".
 * Es wird nie mit lokalen Uhrzeiten gerechnet: Tagesdifferenzen laufen über Date.UTC,
 * dadurch spielen Zeitzonen und Sommerzeit keine Rolle.
 */
const DateUtil = {
  parse(iso) {
    if (typeof iso !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (y < 1900 || y > 2200 || mo < 1 || mo > 12) return null;
    if (d < 1 || d > DateUtil.daysInMonth(y, mo)) return null;
    return { y, m: mo, d };
  },
  isValid(iso) { return DateUtil.parse(iso) !== null; },
  isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; },
  daysInMonth(y, m) { return [31, DateUtil.isLeap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1]; },
  pad2(n) { return String(n).padStart(2, '0'); },
  toISO(y, m, d) { return String(y).padStart(4, '0') + '-' + DateUtil.pad2(m) + '-' + DateUtil.pad2(d); },
  /** Heutiges Datum nach der lokalen Uhr des Geräts. */
  today() { const n = new Date(); return DateUtil.toISO(n.getFullYear(), n.getMonth() + 1, n.getDate()); },
  /** Fortlaufende Tagesnummer (zeitzonenunabhängig). */
  dayNumber(iso) { const p = DateUtil.parse(iso); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 86400000); },
  diffDays(fromIso, toIso) { return DateUtil.dayNumber(toIso) - DateUtil.dayNumber(fromIso); },
  addDays(iso, n) {
    const dt = new Date((DateUtil.dayNumber(iso) + n) * 86400000);
    return DateUtil.toISO(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  },
  /**
   * Monate addieren. Existiert der Tag im Zielmonat nicht, wird der letzte Tag des Monats genommen
   * (wie § 188 Abs. 3 BGB): 31.08. + 6 Monate = 28./29.02., 29.02.2024 + 1 Jahr = 28.02.2025.
   */
  addMonths(iso, months) {
    const p = DateUtil.parse(iso);
    const total = p.y * 12 + (p.m - 1) + months;
    const y = Math.floor(total / 12), m = total - y * 12 + 1;
    return DateUtil.toISO(y, m, Math.min(p.d, DateUtil.daysInMonth(y, m)));
  },
  /** Volle Kalendermonate + Resttage zwischen a und b (a <= b). */
  monthsBetween(a, b) {
    const pa = DateUtil.parse(a), pb = DateUtil.parse(b);
    let months = (pb.y - pa.y) * 12 + (pb.m - pa.m);
    if (months > 0 && DateUtil.addMonths(a, months) > b) months--;
    if (months < 0) months = 0;
    return { months, days: DateUtil.diffDays(DateUtil.addMonths(a, months), b) };
  },
  format(iso) { const p = DateUtil.parse(iso); return p ? DateFmt.join(p.y, p.m, p.d) : '–'; },
  formatLong(iso) {
    const p = DateUtil.parse(iso); if (!p) return '';
    return new Intl.DateTimeFormat(I18N.locale, { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })
      .format(new Date(Date.UTC(p.y, p.m - 1, p.d)));
  }
};

/**
 * Garantie-Status.
 *   active   = mehr als 90 Tage   (grün)
 *   soon     = 30–90 Tage         (gelb)
 *   critical = weniger als 30 Tage (orange)
 *   expired  = abgelaufen          (rot)
 * Der Endtag zählt noch als gültig ("Endet heute").
 */
const Status = {
  LABELS: { active: 'Garantie aktiv', soon: 'Läuft bald ab', critical: 'Läuft sehr bald ab', expired: 'Garantie abgelaufen' },
  keyFor(days) { return days < 0 ? 'expired' : days < 30 ? 'critical' : days <= 90 ? 'soon' : 'active'; },
  of(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    const key = Status.keyFor(days);
    return { days, key, label: Status.LABELS[key], text: Status.remainingText(days, today, p.warrantyEnd) };
  },
  /** "2 Jahre und 4 Monate" (Nominativ) bzw. "2 Jahren und 4 Monaten" (Dativ, für "vor …"). */
  spanText(months, days, dative) {
    const y = Math.floor(months / 12), m = months % 12, parts = [];
    if (y) parts.push(y + ' ' + (y === 1 ? 'Jahr' : dative ? 'Jahren' : 'Jahre'));
    if (m) parts.push(m + ' ' + (m === 1 ? 'Monat' : dative ? 'Monaten' : 'Monate'));
    if (!y && days) parts.push(days + ' ' + (days === 1 ? 'Tag' : dative ? 'Tagen' : 'Tage'));
    return parts.join(' und ');
  },
  remainingText(days, today, end) {
    if (days === 0) return 'Endet heute';
    if (days === 1) return 'Endet morgen';
    if (days === -1) return 'Gestern abgelaufen';
    if (days > 1) {
      if (days < 90) return 'Noch ' + days + ' Tage';
      const b = DateUtil.monthsBetween(today, end);
      return 'Noch ' + Status.spanText(b.months, b.days, false);
    }
    const ago = -days;
    if (ago < 60) return 'Vor ' + ago + ' Tagen abgelaufen';
    const b = DateUtil.monthsBetween(end, today);
    return 'Vor ' + Status.spanText(b.months, b.days, true) + ' abgelaufen';
  },
  endsText(days) {
    if (days === 0) return 'Garantie endet heute';
    if (days === 1) return 'Garantie endet morgen';
    if (days > 1) return 'Garantie endet in ' + days + ' Tagen';
    if (days === -1) return 'Garantie ist gestern abgelaufen';
    return 'Garantie vor ' + (-days) + ' Tagen abgelaufen';
  }
};

/** Geldbeträge: intern in Cent rechnen, um Rundungsfehler zu vermeiden. */
const Money = {
  _f: null,
  get fmt() {
    const key = I18N.locale + '|' + Currency.code();
    if (!Money._f || Money._f.key !== key) Money._f = { key, f: new Intl.NumberFormat(I18N.locale, { style: 'currency', currency: Currency.code() }) };
    return Money._f.f;
  },
  /** Akzeptiert "599,99", "599.99", "1.299,99", "1,299.99", "599 €". Mehrdeutiges wie "5,999" wird abgelehnt. Leer = kein Preis. */
  parse(input) {
    const raw = String(input ?? '').trim();
    if (raw === '') return { ok: true, cents: null };
    const s = raw.replace(/[\s\u00a0\u202f']/g, '').replace(/euro?|lira|tl|chf|usd|gbp|eur|try/gi, '').replace(/[^\d.,]/g, '');
    let n = null;
    if (/^\d+(,\d{1,2})?$/.test(s)) n = s.replace(',', '.');
    else if (/^\d+(\.\d{1,2})?$/.test(s)) n = s;
    else if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) n = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(,\d{3})+\.\d{1,2}$/.test(s)) n = s.replace(/,/g, ''); // nur mit Nachkommastellen eindeutig
    if (n === null) return { ok: false, cents: null };
    const cents = Math.round(parseFloat(n) * 100);
    if (!Number.isFinite(cents) || cents < 0 || cents > 1e10) return { ok: false, cents: null };
    return { ok: true, cents };
  },
  cents(price) { return price == null || !Number.isFinite(price) ? 0 : Math.round(price * 100); },
  formatCents(c) { return Money.fmt.format(c / 100); },
  format(price) { return price == null || !Number.isFinite(price) ? '' : Money.fmt.format(price); },
  toInput(price) { return price == null ? '' : (Math.round(price * 100) / 100).toFixed(2).replace('.', (1.5).toLocaleString(I18N.locale).charAt(1) === ',' ? ',' : '.'); }
};

/**
 * Erinnerungslogik (reine Berechnung, unabhängig von der Anzeige).
 * Eine Erinnerung ist fällig, sobald die Restlaufzeit ≤ gewählter Vorlauf ist.
 * Pro Produkt wird die jeweils engste überschrittene Schwelle angezeigt, bis sie bestätigt wird.
 */
const Reminders = {
  dueFor(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    if (days < 0) return null;
    const crossed = (p.reminders || []).filter(r => days <= r).sort((a, b) => a - b);
    if (!crossed.length) return null;
    const threshold = crossed[0];
    if ((p.reminderAcks || []).includes(threshold)) return null;
    return { product: p, days, threshold };
  },
  due(list, today) { return list.map(p => Reminders.dueFor(p, today)).filter(Boolean).sort((a, b) => a.days - b.days); },
  /** Beim Bestätigen werden alle bereits überschrittenen Schwellen als erledigt markiert. */
  ackValues(p, today) {
    const days = DateUtil.diffDays(today, p.warrantyEnd);
    return [...new Set([...(p.reminderAcks || []), ...(p.reminders || []).filter(r => days <= r)])].sort((a, b) => a - b);
  },
  /** Geplante Termine (für eine spätere native Android-Schicht). */
  schedule(p, today) {
    return (p.reminders || []).map(r => ({ daysBefore: r, date: DateUtil.addDays(p.warrantyEnd, -r) }))
      .filter(x => x.date >= today);
  }
};

/** Prüft Formulardaten. Gibt Fehlermeldungen pro Feld zurück (leer = gültig). */
function validateForm(v, today) {
  const e = {};
  if (!v.name.trim()) e.name = 'Bitte gib einen Produktnamen ein.';
  if (!v.purchaseDate) e.purchaseDate = 'Bitte gib ein Kaufdatum ein.';
  else if (!DateUtil.isValid(v.purchaseDate)) e.purchaseDate = 'Bitte gib ein gültiges Datum ein, z. B. 12.08.2026.';
  else if (v.purchaseDate > today) e.purchaseDate = 'Das Kaufdatum darf nicht in der Zukunft liegen.';
  const price = Money.parse(v.price);
  if (!price.ok) e.price = 'Bitte gib einen gültigen Preis ein.';
  if (v.duration === 'custom') {
    if (!v.customEnd) e.customEnd = 'Bitte gib ein Enddatum für die Garantie ein.';
    else if (!DateUtil.isValid(v.customEnd)) e.customEnd = 'Bitte gib ein gültiges Datum ein, z. B. 12.08.2028.';
    else if (DateUtil.isValid(v.purchaseDate) && v.customEnd < v.purchaseDate) e.customEnd = 'Das Garantieende darf nicht vor dem Kaufdatum liegen.';
  } else if (!DURATIONS.some(d => String(d.months) === v.duration)) {
    e.duration = 'Bitte wähle eine Garantiezeit.';
  }
  return { errors: e, cents: price.cents };
}

/**
 * Bereinigt ein Produktobjekt (aus der Datenbank oder einer Importdatei).
 * Ungültige Produkte ergeben null. Das Garantieende wird bei festen Laufzeiten neu berechnet.
 */
function sanitizeProduct(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const s = (v, max) => (typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '').slice(0, max);
  const name = s(raw.name, 200).trim();
  if (!name) return null;
  const purchaseDate = raw.purchaseDate;
  if (!DateUtil.isValid(purchaseDate)) return null;
  let duration = raw.warrantyDuration, end = raw.warrantyEnd;
  const months = Number(duration);
  if (duration !== 'custom' && DURATIONS.some(d => d.months === months)) {
    duration = months; end = DateUtil.addMonths(purchaseDate, months);
  } else {
    duration = 'custom';
    if (!DateUtil.isValid(end)) return null;
  }
  if (end < purchaseDate) return null;
  let price = null;
  if (raw.price !== null && raw.price !== undefined && raw.price !== '') {
    const n = Number(raw.price);
    if (Number.isFinite(n) && n >= 0 && n < 1e8) price = Math.round(n * 100) / 100;
  }
  const opts = arr => [...new Set((Array.isArray(arr) ? arr : []).map(Number).filter(n => REMINDER_OPTIONS.includes(n)))].sort((a, b) => a - b);
  const ts = v => (typeof v === 'string' && !isNaN(Date.parse(v))) ? v : new Date().toISOString();
  const r = raw.receipt;
  const receipt = r && typeof r === 'object' && typeof r.id === 'string' && r.id
    ? { id: r.id, name: s(r.name, 200) || 'Rechnung', type: s(r.type, 100), size: Number(r.size) || 0, addedAt: s(r.addedAt, 40) }
    : null;
  return {
    id: typeof raw.id === 'string' && raw.id.trim() ? raw.id.slice(0, 100) : newId(),
    name,
    category: CATEGORIES.some(c => c.id === raw.category) ? raw.category : 'Sonstiges',
    purchaseDate,
    price,
    retailer: s(raw.retailer, 200).trim(),
    serialNumber: s(raw.serialNumber, 200).trim(),
    modelNumber: s(raw.modelNumber, 200).trim(),
    warrantyStart: purchaseDate,
    warrantyEnd: end,
    warrantyDuration: duration,
    receipt,
    reminders: Array.isArray(raw.reminders) ? opts(raw.reminders) : [...DEFAULT_REMINDERS],
    reminderAcks: opts(raw.reminderAcks),
    notes: s(raw.notes, 2000).trim(),
    createdAt: ts(raw.createdAt),
    updatedAt: ts(raw.updatedAt)
  };
}

/* ===================== 4. STORAGE ===================== */
/**
 * IndexedDB mit zwei Stores:
 *   products – Produktdatensätze (inkl. Metadaten zur Rechnung)
 *   receipts – Rechnungsdateien als Blob { id, productId, name, type, size, addedAt, blob }
 * Schreibvorgänge laufen in Transaktionen: Entweder alles wird gespeichert oder nichts.
 */
const Store = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window) || !window.indexedDB) return reject(new Error('Speichern wird auf diesem Gerät nicht unterstützt.'));
      let req;
      // Interner Datenbankname bleibt 'garantiebox' (früherer App-Name), damit vorhandene Daten erhalten bleiben.
      try { req = indexedDB.open('garantiebox', 1); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts', { keyPath: 'id' });
      };
      req.onsuccess = () => {
        Store.db = req.result;
        Store.db.onversionchange = () => { Store.db.close(); UI.toast('Es gibt eine neue Version. Bitte App neu starten.', 'error'); };
        resolve(Store.db);
      };
      req.onerror = () => reject(req.error || new Error('Datenbank konnte nicht geöffnet werden.'));
      req.onblocked = () => reject(new Error('Die Datenbank ist blockiert. Schließe andere Tabs mit Belegwächter.'));
    });
  },
  _tx(names, mode, work) {
    return new Promise((resolve, reject) => {
      let t, out;
      try { t = Store.db.transaction(names, mode); } catch (e) { return reject(e); }
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Transaktion abgebrochen'));
      try { out = work(t); } catch (e) { try { t.abort(); } catch (_) {} reject(e); }
    });
  },
  _read(storeName, fn) {
    return Store._tx([storeName], 'readonly', t => {
      const box = {};
      const req = fn(t.objectStore(storeName));
      req.onsuccess = () => { box.value = req.result; };
      return box;
    }).then(b => b.value);
  },
  getAllProducts() { return Store._read('products', s => s.getAll()).then(v => v || []); },
  getAllReceipts() { return Store._read('receipts', s => s.getAll()).then(v => v || []); },
  getReceipt(id) { return Store._read('receipts', s => s.get(id)); },
  putReceipt(r) { return Store._tx(['receipts'], 'readwrite', t => { t.objectStore('receipts').put(r); }); },
  deleteReceipt(id) { return Store._tx(['receipts'], 'readwrite', t => { t.objectStore('receipts').delete(id); }); },
  /** Produkt speichern, optional Rechnung hinzufügen und/oder alte Rechnung löschen – atomar. */
  saveProduct(product, { putReceipt = null, deleteReceiptId = null } = {}) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const rs = t.objectStore('receipts');
      if (deleteReceiptId) rs.delete(deleteReceiptId);
      if (putReceipt) rs.put(putReceipt);
      t.objectStore('products').put(product);
    });
  },
  deleteProduct(id, receiptId) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      t.objectStore('products').delete(id);
      if (receiptId) t.objectStore('receipts').delete(receiptId);
    });
  },
  replaceAll(products, receipts) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const ps = t.objectStore('products'), rs = t.objectStore('receipts');
      ps.clear(); rs.clear();
      products.forEach(p => ps.put(p));
      receipts.forEach(r => rs.put(r));
    });
  },
  addMany(products, receipts) {
    return Store._tx(['products', 'receipts'], 'readwrite', t => {
      const ps = t.objectStore('products'), rs = t.objectStore('receipts');
      products.forEach(p => ps.put(p));
      receipts.forEach(r => rs.put(r));
    });
  }
};

/** Kleine Einstellungen (Theme, letztes Backup) in localStorage – mit Fallback, falls blockiert. */
const Prefs = {
  mem: {},
  get(k, d) {
    try { const v = localStorage.getItem('gb.' + k); return v === null ? (k in Prefs.mem ? Prefs.mem[k] : d) : JSON.parse(v); }
    catch (e) { return k in Prefs.mem ? Prefs.mem[k] : d; }
  },
  set(k, v) { Prefs.mem[k] = v; try { localStorage.setItem('gb.' + k, JSON.stringify(v)); } catch (e) { /* nur im Speicher */ } }
};

/* ===================== 4b. SPRACHE, REGION & WÄHRUNG ===================== */
/**
 * Mehrsprachigkeit.
 * - Sprache: Handysprache (navigator.languages), in den Einstellungen änderbar. Fehlt sie → Englisch.
 * - Texte: Die App ist auf Deutsch geschrieben. Für andere Sprachen gibt es Wörterbücher
 *   (I18N.DICT.en usw., deutscher Text → Übersetzung). Ein MutationObserver übersetzt alles,
 *   was angezeigt wird, bevor es auf dem Bildschirm erscheint. Sätze mit Zahlen laufen über I18N.PATTERNS.
 * - Für Texte außerhalb der Anzeige (PDF, Benachrichtigungen, Dateinamen) gibt es tx('Deutscher Text', {n: 3}).
 * - Elemente mit translate="no" werden nie übersetzt (z. B. Sprachnamen, eigene Eingaben).
 */
const I18N = {
  /** Fertig übersetzte Sprachen. Weitere (tr, fr, es, it) erst eintragen, wenn ihr Wörterbuch fertig ist. */
  LANGS: { de: 'Deutsch', en: 'English', fr: 'Français', es: 'Español' },
  DEFAULT_LOCALE: { de: 'de-DE', en: 'en-GB', tr: 'tr-TR', fr: 'fr-FR', es: 'es-ES', it: 'it-IT' },
  DICT: {},       // DICT.en = { 'Deutscher Text': 'English text' }
  PATTERNS: [],   // [ [/^Noch (\d+) Tage$/, { en: '$1 days left', … }], … ]
  lang: 'de',
  locale: 'de-DE',
  /** App-Name je Sprache: [normaler Teil, betonter Teil]. Fehlt eine Sprache, gilt der englische Name. */
  BRANDS: { de: ['Beleg', 'wächter'], en: ['Receipt ', 'Warden'], fr: ['Gardien des ', 'Reçus'], es: ['Guardián de ', 'Recibos'] },
  brandParts() { return I18N.BRANDS[I18N.lang] || I18N.BRANDS.en; },
  appName() { return I18N.brandParts().join('').trim(); },
  brandHtml() { const [a, b] = I18N.brandParts(); return esc(a) + '<b>' + esc(b) + '</b>'; },
  /** In Übersetzungen steht „Belegwächter“; hier wird der Name der jeweiligen Sprache eingesetzt. */
  brand(s) { return I18N.lang === 'de' || s == null ? s : String(s).replace(/Belegwächter/g, I18N.appName()); },
  systemTags() {
    const l = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'de-DE'];
    return l.map(String);
  },
  init() {
    const pref = Prefs.get('lang', 'system');

    let lang = I18N.LANGS[pref] ? pref : null;
    if (!lang) for (const tag of tags) { const b = tag.toLowerCase().split('-')[0]; if (I18N.LANGS[b]) { lang = b; break; } }
    if (!lang) lang = 'en';
    const sys = tags.find(tag => tag.toLowerCase().split('-')[0] === lang && tag.includes('-'));

// Datenschutz (App-Version)
'Datenschutzerklärung für die App „Belegwächter“ · Stand: Oktober 2026': 'Privacy policy for the app “Belegwächter” · As of October 2026',
'Diese Datenschutzerklärung gilt für die Android-App aus dem Google Play Store sowie für die Web-Version der App.': 'This privacy policy applies to the Android app from the Google Play Store and to the web version of the app.',
'1. Verantwortliche': '1. Controller',
'Verantwortlich für die Datenverarbeitung im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:': 'The controller responsible for data processing under the General Data Protection Regulation (GDPR) is:',
'Deutschland': 'Germany', 'E-Mail:': 'Email:',
'Ein Datenschutzbeauftragter ist nicht bestellt, da hierzu keine gesetzliche Pflicht besteht.': 'No data protection officer has been appointed, as there is no legal obligation to do so.',
'2. Überblick': '2. Overview',
'Belegwächter ist eine App zur Verwaltung von Garantien und Rechnungen. Die App ist so gestaltet, dass Ihre Einträge ausschließlich auf Ihrem Gerät verarbeitet werden. Es ist kein Benutzerkonto erforderlich. Die App enthält keine Werbung und verwendet keine Analyse-, Tracking- oder Werbedienste. Ihre gespeicherten Einträge werden weder an mich noch an Dritte übermittelt.': 'Belegwächter is an app for managing warranties and receipts. The app is designed so that your entries are processed exclusively on your device. No user account is required. The app contains no advertising and uses no analytics, tracking or advertising services. Your saved entries are not transmitted to me or to third parties.',
'3. Verarbeitung auf Ihrem Gerät': '3. Processing on your device',
'Art der Daten:': 'Type of data:',
'Angaben, die Sie selbst eingeben oder aus einer Rechnung übernehmen, insbesondere Produktname, Kategorie, Kaufdatum, Kaufpreis, Händler, Serien- und Modellnummer, Garantiezeit, Erinnerungen und Notizen, sowie Rechnungen als Foto oder PDF.': 'Information you enter yourself or take from a receipt, in particular product name, category, purchase date, purchase price, retailer, serial and model number, warranty period, reminders and notes, as well as receipts as a photo or PDF.',
'Zweck:': 'Purpose:', 'Verwaltung Ihrer Garantien und Rechnungen, Berechnung von Garantiefristen und Anzeige von Erinnerungen.': 'Managing your warranties and receipts, calculating warranty periods and showing reminders.',
'Speicherort:': 'Storage location:', 'ausschließlich im lokalen Speicher der App auf Ihrem Gerät. Ich habe keinen Zugriff auf diese Daten.': 'exclusively in the app’s local storage on your device. I have no access to this data.',
'Speicherdauer:': 'Storage period:',
'bis Sie die Daten löschen, z. B. einzeln, über „Alle Daten löschen“ in den Einstellungen oder durch Deinstallation der App bzw. Löschen der Website-Daten im Browser.': 'until you delete the data, e.g. individually, via “Delete all data” in the settings, or by uninstalling the app or clearing the website data in your browser.',
'Zusätzlich speichert die App einige Einstellungen auf Ihrem Gerät, z. B. das gewählte Farbschema und den Zeitpunkt des letzten Backups. Diese Einstellungen werden ausschließlich lokal auf Ihrem Gerät gespeichert und dienen der Bereitstellung und Personalisierung der von Ihnen gewünschten Funktionen. Cookies werden nicht verwendet.': 'The app also stores some settings on your device, e.g. the selected colour scheme, language and the time of the last backup. These settings are stored exclusively locally on your device and serve to provide and personalise the functions you request. No cookies are used.',
'4. Erfassung von Rechnungen (Kamera, Dateien, Texterkennung)': '4. Capturing receipts (camera, files, text recognition)',
'Die App greift nur dann auf die Kamera oder auf Dateien zu, wenn Sie selbst eine Rechnung scannen oder hochladen. Für den Zugriff auf die Kamera ist Ihre Erlaubnis im Android-System erforderlich, die Sie jederzeit in den Android-Einstellungen widerrufen können. Beim Scannen wird das Kamerabild ausschließlich auf Ihrem Gerät ausgewertet; gespeichert wird nur das aufgenommene Foto als Rechnung.': 'The app only accesses the camera or files when you scan or upload a receipt yourself. Access to the camera requires your permission in the Android system, which you can revoke at any time in the Android settings. When scanning, the camera image is analysed exclusively on your device; only the photo taken is saved as a receipt.',
'Die Texterkennung, mit der Angaben aus Rechnungen automatisch eingetragen werden, läuft vollständig auf Ihrem Gerät. Fotos und PDF-Dateien werden dafür nicht übertragen. In der Android-App sind die Programmdateien der Texterkennung (Tesseract) bereits enthalten; dafür wird keine Internetverbindung benötigt. In der Web-Version werden sie beim ersten Gebrauch einmalig vom selben Server geladen wie die App selbst (siehe Abschnitt 7) und anschließend auf Ihrem Gerät zwischengespeichert. In beiden Fällen werden keine anderen Server kontaktiert und keine Nutzungs- oder Diagnosedaten übermittelt.': 'The text recognition that fills in details from receipts automatically runs entirely on your device. Photos and PDF files are not transmitted for this. In the Android app, the text recognition program files (Tesseract) are already included; no internet connection is needed. In the web version, they are loaded once on first use from the same server as the app itself (see section 7) and then cached on your device. In both cases, no other servers are contacted and no usage or diagnostic data is transmitted.',
'Fügen Sie Text aus einer anderen App ein, z. B. aus Google Lens, gelten für die dortige Verarbeitung die Datenschutzbestimmungen des jeweiligen Anbieters.': 'If you paste text from another app, e.g. from Google Lens, the privacy policy of that provider applies to the processing there.',
'5. Erinnerungen und Benachrichtigungen': '5. Reminders and notifications',
'Wenn Sie Benachrichtigungen erlauben, erinnert Sie die App vor dem Ende einer Garantie. In der Android-App plant Android diese Erinnerungen auf Ihrem Gerät und prüft dafür etwa zweimal am Tag im Hintergrund die gespeicherten Termine. In der Web-Version übernimmt das Ihr Browser. Dafür werden keine Daten an einen Server gesendet. Sie können die Erlaubnis jederzeit in der App oder in den Einstellungen Ihres Geräts bzw. Browsers widerrufen.': 'If you allow notifications, the app reminds you before a warranty ends. In the Android app, Android schedules these reminders on your device and checks the saved dates in the background about twice a day. In the web version, your browser does this. No data is sent to a server for this. You can revoke the permission at any time in the app or in the settings of your device or browser.',
'Zusätzlich können Sie einen Termin als Kalenderdatei speichern und in Ihren Kalender übernehmen (siehe Abschnitt 6). Für den Kalender gelten die Bestimmungen des jeweiligen Anbieters.': 'You can also save an event as a calendar file and add it to your calendar (see section 6). The terms of the respective provider apply to the calendar.',
'6. Backups, PDF-Export und Kalenderdateien': '6. Backups, PDF export and calendar files',
'Backups, PDF-Exporte und Kalenderdateien werden nur auf Ihre Veranlassung erstellt und dort gespeichert, wo Sie es festlegen, in der Regel im Ordner „Download“ Ihres Geräts. Backup-Dateien sind nicht verschlüsselt; wer eine solche Datei besitzt, kann die darin enthaltenen Einträge einsehen. Bitte bewahren Sie diese Dateien daher sorgfältig auf. Speichern Sie Dateien bei einem Cloud-Dienst wie Google Drive oder geben Sie sie an Dritte weiter, gelten die Bestimmungen des jeweiligen Anbieters. Wenn Sie in der Android-App eine Datei teilen oder in einer anderen App öffnen, wird sie nur an die von Ihnen gewählte App übergeben; für die weitere Verarbeitung ist deren Anbieter verantwortlich.': 'Backups, PDF exports and calendar files are only created at your request and saved where you specify, usually in the “Download” folder of your device. Backup files are not encrypted; anyone who has such a file can view the entries it contains. Please keep these files safe. If you save files with a cloud service such as Google Drive or pass them on to third parties, the terms of the respective provider apply. If you share a file or open it in another app in the Android app, it is only passed to the app you choose; its provider is responsible for further processing.',
'7. Bereitstellung der App (Hosting)': '7. Provision of the app (hosting)',
'Die Android-App enthält alle Dateien, die sie zum Betrieb benötigt, und ruft bei der Nutzung keine Server auf. Dieser Abschnitt betrifft daher nur die Web-Version sowie den Abruf dieser Datenschutzerklärung im Browser.': 'The Android app contains all the files it needs to run and does not contact any servers during use. This section therefore only concerns the web version and accessing this privacy policy in a browser.',
'Die Dateien der Web-Version werden über GitHub Pages bereitgestellt, einen Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Abruf der App verarbeitet GitHub technisch notwendige Zugriffsdaten, insbesondere Ihre IP-Adresse, Datum und Uhrzeit des Abrufs sowie Angaben zu Browser und Betriebssystem, um die Dateien auszuliefern und die Sicherheit des Dienstes zu gewährleisten. Diese Zugriffsdaten werden mir von GitHub nicht als personenbezogene Nutzerdaten zur Verfügung gestellt; GitHub Pages stellt Seitenbetreibern keine Zugriffsprotokolle oder Besucherstatistiken bereit.': 'The files of the web version are provided via GitHub Pages, a service of GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. When the app is accessed, GitHub processes technically necessary access data, in particular your IP address, date and time of access and information about your browser and operating system, in order to deliver the files and ensure the security of the service. GitHub does not make this access data available to me as personal user data; GitHub Pages does not provide site operators with access logs or visitor statistics.',
'Rechtsgrundlage ist mein berechtigtes Interesse an einer sicheren und zuverlässigen Bereitstellung der App (Art. 6 Abs. 1 lit. f DSGVO). Dabei können Daten in die USA übermittelt werden. GitHub stützt solche Übermittlungen nach eigenen Angaben auf das EU-US Data Privacy Framework sowie auf Standardvertragsklauseln der Europäischen Kommission. Weitere Informationen finden Sie in der': 'The legal basis is my legitimate interest in providing the app securely and reliably (Art. 6(1)(f) GDPR). Data may be transferred to the USA. According to GitHub, such transfers are based on the EU-US Data Privacy Framework and on standard contractual clauses of the European Commission. Further information can be found in the',
'Datenschutzerklärung von GitHub': 'GitHub Privacy Statement',
'8. Google Play': '8. Google Play',
'Wenn Sie die App über Google Play installieren, verarbeitet Google dabei Daten in eigener Verantwortung, z. B. für Download, Aktualisierungen und gegebenenfalls Zahlungen. Über die Google Play Console stellt Google mir zusammengefasste und technische Informationen zu meiner App zur Verfügung, beispielsweise Installationszahlen und technische Stabilitätsdaten wie Absturz- und ANR-Daten. Diese Daten enthalten keine Inhalte Ihrer in der App gespeicherten Einträge. Eigene Analyse-, Tracking- oder Absturzdienste (z. B. Google Analytics oder Firebase Crashlytics) sind in der App nicht eingebunden. Weitere Informationen finden Sie in der': 'If you install the app via Google Play, Google processes data under its own responsibility, e.g. for downloads, updates and payments where applicable. Via the Google Play Console, Google provides me with aggregated and technical information about my app, such as install numbers and technical stability data like crash and ANR data. This data does not contain any content of the entries saved in the app. No separate analytics, tracking or crash services (e.g. Google Analytics or Firebase Crashlytics) are integrated into the app. Further information can be found in the',
'Datenschutzerklärung von Google': 'Google Privacy Policy',
'9. Kontaktaufnahme per E-Mail': '9. Contact by email',
'Wenn Sie mich per E-Mail kontaktieren, verarbeite ich Ihre E-Mail-Adresse und den Inhalt Ihrer Nachricht, um Ihre Anfrage zu bearbeiten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, soweit Ihre Anfrage die Nutzung der App betrifft, im Übrigen mein berechtigtes Interesse an der Beantwortung von Anfragen (Art. 6 Abs. 1 lit. f DSGVO). Ihre Nachricht wird gelöscht, sobald die Anfrage abschließend bearbeitet ist und keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Das E-Mail-Postfach wird von Google (Gmail) bereitgestellt.': 'If you contact me by email, I process your email address and the content of your message in order to handle your request. The legal basis is Art. 6(1)(b) GDPR insofar as your request concerns the use of the app, otherwise my legitimate interest in answering enquiries (Art. 6(1)(f) GDPR). Your message will be deleted once the request has been fully dealt with and no statutory retention obligations apply. The email inbox is provided by Google (Gmail).',
'10. Empfänger, automatisierte Entscheidungen und Datensicherheit': '10. Recipients, automated decisions and data security',
'Über die in dieser Erklärung genannten Dienstleister hinaus werden keine personenbezogenen Daten an Dritte weitergegeben oder verkauft. Eine automatisierte Entscheidungsfindung einschließlich Profiling (Art. 22 DSGVO) findet nicht statt.': 'Beyond the service providers named in this policy, no personal data is passed on or sold to third parties. There is no automated decision-making, including profiling (Art. 22 GDPR).',
'Die Web-Version wird ausschließlich über eine verschlüsselte Verbindung (HTTPS) bereitgestellt; die Android-App wird über Google Play installiert und aktualisiert. Ihre Einträge sind durch die Sicherheitsmechanismen Ihres Geräts geschützt; bitte verwenden Sie eine Bildschirmsperre.': 'The web version is provided exclusively via an encrypted connection (HTTPS); the Android app is installed and updated via Google Play. Your entries are protected by your device’s security mechanisms; please use a screen lock.',
'11. Ihre Rechte': '11. Your rights',
'Sie haben nach der DSGVO das Recht auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18) und Datenübertragbarkeit (Art. 20). Eine erteilte Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen (Art. 7 Abs. 3 DSGVO). Da Ihre Einträge ausschließlich auf Ihrem Gerät gespeichert sind, können Sie diese jederzeit selbst einsehen, als Backup exportieren und löschen.': 'Under the GDPR, you have the right of access (Art. 15), rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18) and data portability (Art. 20). You can withdraw any consent given at any time with effect for the future (Art. 7(3) GDPR). As your entries are stored exclusively on your device, you can view them, export them as a backup and delete them yourself at any time.',
'Widerspruchsrecht:': 'Right to object:',
'Soweit eine Verarbeitung auf Art. 6 Abs. 1 lit. f DSGVO beruht, können Sie aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit Widerspruch einlegen (Art. 21 DSGVO). Wenden Sie sich dazu an die oben genannte E-Mail-Adresse.': 'Where processing is based on Art. 6(1)(f) GDPR, you can object at any time on grounds relating to your particular situation (Art. 21 GDPR). To do so, please contact the email address given above.',
'Beschwerderecht:': 'Right to lodge a complaint:',
'Sie haben das Recht, sich bei einer Datenschutz-Aufsichtsbehörde zu beschweren (Art. 77 DSGVO). Zuständig ist die Landesbeauftragte für Datenschutz und Informationsfreiheit Nordrhein-Westfalen,': 'You have the right to lodge a complaint with a data protection supervisory authority (Art. 77 GDPR). The competent authority is the State Commissioner for Data Protection and Freedom of Information of North Rhine-Westphalia,',
'12. Änderungen dieser Datenschutzerklärung': '12. Changes to this privacy policy',
'Ich passe diese Datenschutzerklärung an, wenn sich die App, die eingesetzten Dienste oder die Rechtslage ändern. Es gilt die jeweils in der App und unter der Internetadresse dieser Seite veröffentlichte Fassung.': 'I will update this privacy policy if the app, the services used or the legal situation change. The version published in the app and at the web address of this page applies.',
'Ihre in der App gespeicherten Einträge werden dabei nicht übertragen.': 'Your entries saved in the app are not transmitted in the process.',

"Diese Datenschutzerklärung gilt für die Android-App aus dem Google Play Store sowie für die Web-Version der App.": "Esta política de privacidad se aplica a la app de Android de Google Play Store y a la versión web de la app.",
"1. Verantwortliche": "1. Responsable",
"Verantwortlich für die Datenverarbeitung im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:": "El responsable del tratamiento de datos en el sentido del Reglamento General de Protección de Datos (RGPD) es:",

"Ein Datenschutzbeauftragter ist nicht bestellt, da hierzu keine gesetzliche Pflicht besteht.": "No se ha designado un delegado de protección de datos, ya que no existe obligación legal de hacerlo.",
"2. Überblick": "2. Resumen",
"Belegwächter ist eine App zur Verwaltung von Garantien und Rechnungen. Die App ist so gestaltet, dass Ihre Einträge ausschließlich auf Ihrem Gerät verarbeitet werden. Es ist kein Benutzerkonto erforderlich. Die App enthält keine Werbung und verwendet keine Analyse-, Tracking- oder Werbedienste. Ihre gespeicherten Einträge werden weder an mich noch an Dritte übermittelt.": "Belegwächter es una app para gestionar garantías y facturas. Está diseñada para que sus entradas se procesen exclusivamente en su dispositivo. No se necesita ninguna cuenta de usuario. La app no contiene publicidad ni utiliza servicios de análisis, seguimiento o publicidad. Sus entradas guardadas no se transmiten ni a mí ni a terceros.",
"3. Verarbeitung auf Ihrem Gerät": "3. Tratamiento en su dispositivo",
"Art der Daten:": "Tipo de datos:",
"Angaben, die Sie selbst eingeben oder aus einer Rechnung übernehmen, insbesondere Produktname, Kategorie, Kaufdatum, Kaufpreis, Händler, Serien- und Modellnummer, Garantiezeit, Erinnerungen und Notizen, sowie Rechnungen als Foto oder PDF.": "Datos que usted introduce o toma de una factura, en particular nombre del producto, categoría, fecha de compra, precio de compra, tienda, número de serie y modelo, duración de la garantía, recordatorios y notas, así como facturas en forma de foto o PDF.",
"Zweck:": "Finalidad:",
"Verwaltung Ihrer Garantien und Rechnungen, Berechnung von Garantiefristen und Anzeige von Erinnerungen.": "Gestión de sus garantías y facturas, cálculo de plazos de garantía y visualización de recordatorios.",
"Speicherort:": "Lugar de almacenamiento:",
"ausschließlich im lokalen Speicher der App auf Ihrem Gerät. Ich habe keinen Zugriff auf diese Daten.": "exclusivamente en el almacenamiento local de la app en su dispositivo. No tengo acceso a estos datos.",
"Speicherdauer:": "Plazo de conservación:",
"bis Sie die Daten löschen, z. B. einzeln, über „Alle Daten löschen“ in den Einstellungen oder durch Deinstallation der App bzw. Löschen der Website-Daten im Browser.": "hasta que usted elimine los datos, p. ej., uno a uno, mediante «Eliminar todos los datos» en los ajustes, desinstalando la app o borrando los datos del sitio web en el navegador.",
"Zusätzlich speichert die App einige Einstellungen auf Ihrem Gerät, z. B. das gewählte Farbschema und den Zeitpunkt des letzten Backups. Diese Einstellungen werden ausschließlich lokal auf Ihrem Gerät gespeichert und dienen der Bereitstellung und Personalisierung der von Ihnen gewünschten Funktionen. Cookies werden nicht verwendet.": "Además, la app guarda algunos ajustes en su dispositivo, p. ej., el tema elegido, el idioma y la fecha de la última copia de seguridad. Estos ajustes se guardan exclusivamente en local en su dispositivo y sirven para ofrecer y personalizar las funciones que usted solicita. No se utilizan cookies.",
"4. Erfassung von Rechnungen (Kamera, Dateien, Texterkennung)": "4. Captura de facturas (cámara, archivos, reconocimiento de texto)",
"Die App greift nur dann auf die Kamera oder auf Dateien zu, wenn Sie selbst eine Rechnung scannen oder hochladen. Für den Zugriff auf die Kamera ist Ihre Erlaubnis im Android-System erforderlich, die Sie jederzeit in den Android-Einstellungen widerrufen können. Beim Scannen wird das Kamerabild ausschließlich auf Ihrem Gerät ausgewertet; gespeichert wird nur das aufgenommene Foto als Rechnung.": "La app solo accede a la cámara o a los archivos cuando usted escanea o sube una factura. El acceso a la cámara requiere su permiso en el sistema Android, que puede revocar en cualquier momento en los ajustes de Android. Al escanear, la imagen de la cámara se analiza exclusivamente en su dispositivo; solo se guarda como factura la foto tomada.",
"Die Texterkennung, mit der Angaben aus Rechnungen automatisch eingetragen werden, läuft vollständig auf Ihrem Gerät. Fotos und PDF-Dateien werden dafür nicht übertragen. In der Android-App sind die Programmdateien der Texterkennung (Tesseract) bereits enthalten; dafür wird keine Internetverbindung benötigt. In der Web-Version werden sie beim ersten Gebrauch einmalig vom selben Server geladen wie die App selbst (siehe Abschnitt 7) und anschließend auf Ihrem Gerät zwischengespeichert. In beiden Fällen werden keine anderen Server kontaktiert und keine Nutzungs- oder Diagnosedaten übermittelt.": "El reconocimiento de texto, que rellena automáticamente los datos de las facturas, se ejecuta por completo en su dispositivo. Las fotos y los archivos PDF no se transmiten para ello. En la app de Android, los archivos del reconocimiento de texto (Tesseract) ya están incluidos; no se necesita conexión a Internet. En la versión web se cargan una sola vez en el primer uso desde el mismo servidor que la app (véase la sección 7) y después se guardan en caché en su dispositivo. En ambos casos no se contacta con otros servidores ni se transmiten datos de uso o diagnóstico.",
"Fügen Sie Text aus einer anderen App ein, z. B. aus Google Lens, gelten für die dortige Verarbeitung die Datenschutzbestimmungen des jeweiligen Anbieters.": "Si pega texto de otra app, p. ej., de Google Lens, al tratamiento que se realice allí se aplica la política de privacidad del proveedor correspondiente.",
"5. Erinnerungen und Benachrichtigungen": "5. Recordatorios y notificaciones",
"Wenn Sie Benachrichtigungen erlauben, erinnert Sie die App vor dem Ende einer Garantie. In der Android-App plant Android diese Erinnerungen auf Ihrem Gerät und prüft dafür etwa zweimal am Tag im Hintergrund die gespeicherten Termine. In der Web-Version übernimmt das Ihr Browser. Dafür werden keine Daten an einen Server gesendet. Sie können die Erlaubnis jederzeit in der App oder in den Einstellungen Ihres Geräts bzw. Browsers widerrufen.": "Si permite las notificaciones, la app le recuerda el fin de una garantía. En la app de Android, Android programa estos recordatorios en su dispositivo y comprueba para ello unas dos veces al día en segundo plano las fechas guardadas. En la versión web, esto lo hace su navegador. No se envían datos a ningún servidor. Puede revocar el permiso en cualquier momento en la app o en los ajustes de su dispositivo o navegador.",
"Zusätzlich können Sie einen Termin als Kalenderdatei speichern und in Ihren Kalender übernehmen (siehe Abschnitt 6). Für den Kalender gelten die Bestimmungen des jeweiligen Anbieters.": "Además, puede guardar una cita como archivo de calendario y añadirla a su calendario (véase la sección 6). Al calendario se le aplican las condiciones del proveedor correspondiente.",
"6. Backups, PDF-Export und Kalenderdateien": "6. Copias de seguridad, exportación en PDF y archivos de calendario",
"Backups, PDF-Exporte und Kalenderdateien werden nur auf Ihre Veranlassung erstellt und dort gespeichert, wo Sie es festlegen, in der Regel im Ordner „Download“ Ihres Geräts. Backup-Dateien sind nicht verschlüsselt; wer eine solche Datei besitzt, kann die darin enthaltenen Einträge einsehen. Bitte bewahren Sie diese Dateien daher sorgfältig auf. Speichern Sie Dateien bei einem Cloud-Dienst wie Google Drive oder geben Sie sie an Dritte weiter, gelten die Bestimmungen des jeweiligen Anbieters. Wenn Sie in der Android-App eine Datei teilen oder in einer anderen App öffnen, wird sie nur an die von Ihnen gewählte App übergeben; für die weitere Verarbeitung ist deren Anbieter verantwortlich.": "Las copias de seguridad, exportaciones en PDF y archivos de calendario solo se crean a petición suya y se guardan donde usted indique, normalmente en la carpeta «Download» de su dispositivo. Los archivos de copia de seguridad no están cifrados; cualquiera que tenga uno de estos archivos puede ver las entradas que contiene. Guarde estos archivos con cuidado. Si guarda archivos en un servicio en la nube como Google Drive o los entrega a terceros, se aplican las condiciones del proveedor correspondiente. Si comparte un archivo o lo abre en otra app desde la app de Android, solo se entrega a la app que usted elija; su proveedor es responsable del tratamiento posterior.",
"7. Bereitstellung der App (Hosting)": "7. Puesta a disposición de la app (alojamiento)",
"Die Android-App enthält alle Dateien, die sie zum Betrieb benötigt, und ruft bei der Nutzung keine Server auf. Dieser Abschnitt betrifft daher nur die Web-Version sowie den Abruf dieser Datenschutzerklärung im Browser.": "La app de Android contiene todos los archivos que necesita para funcionar y no contacta con ningún servidor durante su uso. Por tanto, esta sección solo se refiere a la versión web y a la consulta de esta política de privacidad en el navegador.",
"Die Dateien der Web-Version werden über GitHub Pages bereitgestellt, einen Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Abruf der App verarbeitet GitHub technisch notwendige Zugriffsdaten, insbesondere Ihre IP-Adresse, Datum und Uhrzeit des Abrufs sowie Angaben zu Browser und Betriebssystem, um die Dateien auszuliefern und die Sicherheit des Dienstes zu gewährleisten. Diese Zugriffsdaten werden mir von GitHub nicht als personenbezogene Nutzerdaten zur Verfügung gestellt; GitHub Pages stellt Seitenbetreibern keine Zugriffsprotokolle oder Besucherstatistiken bereit.": "Los archivos de la versión web se ofrecen a través de GitHub Pages, un servicio de GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, EE. UU. Al acceder a la app, GitHub trata los datos de acceso técnicamente necesarios, en particular su dirección IP, la fecha y hora del acceso y datos sobre el navegador y el sistema operativo, para entregar los archivos y garantizar la seguridad del servicio. GitHub no me facilita estos datos de acceso como datos personales de usuarios; GitHub Pages no ofrece a los operadores de sitios registros de acceso ni estadísticas de visitantes.",
"Rechtsgrundlage ist mein berechtigtes Interesse an einer sicheren und zuverlässigen Bereitstellung der App (Art. 6 Abs. 1 lit. f DSGVO). Dabei können Daten in die USA übermittelt werden. GitHub stützt solche Übermittlungen nach eigenen Angaben auf das EU-US Data Privacy Framework sowie auf Standardvertragsklauseln der Europäischen Kommission. Weitere Informationen finden Sie in der": "La base jurídica es mi interés legítimo en ofrecer la app de forma segura y fiable (art. 6, apdo. 1, letra f del RGPD). Los datos pueden transferirse a EE. UU. Según sus propias indicaciones, GitHub basa estas transferencias en el EU-US Data Privacy Framework y en las cláusulas contractuales tipo de la Comisión Europea. Encontrará más información en la",
"Datenschutzerklärung von GitHub": "Declaración de privacidad de GitHub",
"8. Google Play": "8. Google Play",
"Wenn Sie die App über Google Play installieren, verarbeitet Google dabei Daten in eigener Verantwortung, z. B. für Download, Aktualisierungen und gegebenenfalls Zahlungen. Über die Google Play Console stellt Google mir zusammengefasste und technische Informationen zu meiner App zur Verfügung, beispielsweise Installationszahlen und technische Stabilitätsdaten wie Absturz- und ANR-Daten. Diese Daten enthalten keine Inhalte Ihrer in der App gespeicherten Einträge. Eigene Analyse-, Tracking- oder Absturzdienste (z. B. Google Analytics oder Firebase Crashlytics) sind in der App nicht eingebunden. Weitere Informationen finden Sie in der": "Si instala la app a través de Google Play, Google trata datos bajo su propia responsabilidad, p. ej., para la descarga, las actualizaciones y, en su caso, los pagos. A través de Google Play Console, Google me facilita información agregada y técnica sobre mi app, por ejemplo el número de instalaciones y datos técnicos de estabilidad como fallos y ANR. Estos datos no contienen el contenido de sus entradas guardadas en la app. La app no integra servicios propios de análisis, seguimiento o informes de fallos (p. ej., Google Analytics o Firebase Crashlytics). Encontrará más información en la",
"Datenschutzerklärung von Google": "Política de privacidad de Google",
"9. Kontaktaufnahme per E-Mail": "9. Contacto por correo electrónico",
"Wenn Sie mich per E-Mail kontaktieren, verarbeite ich Ihre E-Mail-Adresse und den Inhalt Ihrer Nachricht, um Ihre Anfrage zu bearbeiten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, soweit Ihre Anfrage die Nutzung der App betrifft, im Übrigen mein berechtigtes Interesse an der Beantwortung von Anfragen (Art. 6 Abs. 1 lit. f DSGVO). Ihre Nachricht wird gelöscht, sobald die Anfrage abschließend bearbeitet ist und keine gesetzlichen Aufbewahrungspflichten entgegenstehen. Das E-Mail-Postfach wird von Google (Gmail) bereitgestellt.": "Si me contacta por correo electrónico, trato su dirección de correo y el contenido de su mensaje para atender su consulta. La base jurídica es el art. 6, apdo. 1, letra b del RGPD si su consulta se refiere al uso de la app y, en los demás casos, mi interés legítimo en responder consultas (art. 6, apdo. 1, letra f del RGPD). Su mensaje se elimina en cuanto la consulta se ha resuelto por completo y no existen obligaciones legales de conservación. El buzón de correo lo proporciona Google (Gmail).",
"10. Empfänger, automatisierte Entscheidungen und Datensicherheit": "10. Destinatarios, decisiones automatizadas y seguridad de los datos",
"Über die in dieser Erklärung genannten Dienstleister hinaus werden keine personenbezogenen Daten an Dritte weitergegeben oder verkauft. Eine automatisierte Entscheidungsfindung einschließlich Profiling (Art. 22 DSGVO) findet nicht statt.": "Aparte de los proveedores mencionados en esta política, no se transmiten ni se venden datos personales a terceros. No se toman decisiones automatizadas, incluida la elaboración de perfiles (art. 22 del RGPD).",
"Die Web-Version wird ausschließlich über eine verschlüsselte Verbindung (HTTPS) bereitgestellt; die Android-App wird über Google Play installiert und aktualisiert. Ihre Einträge sind durch die Sicherheitsmechanismen Ihres Geräts geschützt; bitte verwenden Sie eine Bildschirmsperre.": "La versión web se ofrece exclusivamente a través de una conexión cifrada (HTTPS); la app de Android se instala y actualiza a través de Google Play. Sus entradas están protegidas por los mecanismos de seguridad de su dispositivo; utilice un bloqueo de pantalla.",
"11. Ihre Rechte": "11. Sus derechos",
"Sie haben nach der DSGVO das Recht auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18) und Datenübertragbarkeit (Art. 20). Eine erteilte Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen (Art. 7 Abs. 3 DSGVO). Da Ihre Einträge ausschließlich auf Ihrem Gerät gespeichert sind, können Sie diese jederzeit selbst einsehen, als Backup exportieren und löschen.": "Según el RGPD, tiene derecho de acceso (art. 15), rectificación (art. 16), supresión (art. 17), limitación del tratamiento (art. 18) y portabilidad de los datos (art. 20). Puede retirar en cualquier momento un consentimiento otorgado con efecto para el futuro (art. 7, apdo. 3 del RGPD). Como sus entradas se guardan exclusivamente en su dispositivo, puede consultarlas, exportarlas como copia de seguridad y eliminarlas usted mismo en cualquier momento.",

"Diese Datenschutzerklärung gilt für die Android-App aus dem Google Play Store sowie für die Web-Version der App.": "Cette politique de confidentialité s’applique à l’application Android du Google Play Store ainsi qu’à la version web de l’application.",
"1. Verantwortliche": "1. Responsable du traitement",
"Verantwortlich für die Datenverarbeitung im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:": "Le responsable du traitement des données au sens du Règlement général sur la protection des données (RGPD) est :",

"Ein Datenschutzbeauftragter ist nicht bestellt, da hierzu keine gesetzliche Pflicht besteht.": "Aucun délégué à la protection des données n’a été désigné, car il n’existe aucune obligation légale en ce sens.",
"2. Überblick": "2. Présentation",
"Belegwächter ist eine App zur Verwaltung von Garantien und Rechnungen. Die App ist so gestaltet, dass Ihre Einträge ausschließlich auf Ihrem Gerät verarbeitet werden. Es ist kein Benutzerkonto erforderlich. Die App enthält keine Werbung und verwendet keine Analyse-, Tracking- oder Werbedienste. Ihre gespeicherten Einträge werden weder an mich noch an Dritte übermittelt.": "Belegwächter est une application de gestion des garanties et des factures. Elle est conçue pour que vos entrées soient traitées exclusivement sur votre appareil. Aucun compte utilisateur n’est nécessaire. L’application ne contient pas de publicité et n’utilise aucun service d’analyse, de suivi ou de publicité. Vos entrées enregistrées ne sont transmises ni à moi ni à des tiers.",
"3. Verarbeitung auf Ihrem Gerät": "3. Traitement sur votre appareil",
"Art der Daten:": "Type de données :",
"Angaben, die Sie selbst eingeben oder aus einer Rechnung übernehmen, insbesondere Produktname, Kategorie, Kaufdatum, Kaufpreis, Händler, Serien- und Modellnummer, Garantiezeit, Erinnerungen und Notizen, sowie Rechnungen als Foto oder PDF.": "Informations que vous saisissez vous-même ou reprenez d’une facture, notamment le nom du produit, la catégorie, la date d’achat, le prix d’achat, le magasin, le numéro de série et la référence, la durée de garantie, les rappels et les notes, ainsi que les factures sous forme de photo ou de PDF.",
"Zweck:": "Finalité :",
"Verwaltung Ihrer Garantien und Rechnungen, Berechnung von Garantiefristen und Anzeige von Erinnerungen.": "Gestion de vos garanties et factures, calcul des durées de garantie et affichage des rappels.",
