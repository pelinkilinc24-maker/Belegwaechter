  },
  /** Lokale Schwelle nach Bradley/Roth mit Integralbild: gleicht Schatten und Licht aus. */
  binarize(g, w, h) {
    const S = Math.max(15, Math.round(Math.max(w, h) / 22)), half = S >> 1, T = 0.15;
    const I = new Uint32Array((w + 1) * (h + 1));
    for (let y = 1; y <= h; y++) {
      let row = 0;
      for (let xx = 1; xx <= w; xx++) { row += g[(y - 1) * w + xx - 1]; I[y * (w + 1) + xx] = I[(y - 1) * (w + 1) + xx] + row; }
    }
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) {
      const y1 = Math.max(0, y - half), y2 = Math.min(h - 1, y + half);
      for (let xx = 0; xx < w; xx++) {
        const x1 = Math.max(0, xx - half), x2 = Math.min(w - 1, xx + half);
        const count = (x2 - x1 + 1) * (y2 - y1 + 1);
        const s = I[(y2 + 1) * (w + 1) + x2 + 1] - I[y1 * (w + 1) + x2 + 1] - I[(y2 + 1) * (w + 1) + x1] + I[y1 * (w + 1) + x1];

  async recognize(blob, progress) {
    if (!(await TessOCR.probe())) return null;

const TextRecognition = {
  pending: new Map(),
  TIMEOUT: 60000,
  nativeAvailable() { return !!(window.GarantieBoxNative && typeof window.GarantieBoxNative.recognizeText === 'function'); },
  detectorAvailable() { return typeof window.TextDetector === 'function'; },
  imageAvailable() { return TextRecognition.nativeAvailable() || TextRecognition.detectorAvailable() || TessOCR.present === true; },
  label() { return TextRecognition.nativeAvailable() ? 'Über Android-App' : TextRecognition.detectorAvailable() ? 'Browser-Texterkennung' : TessOCR.present ? 'Tesseract, auf dem Gerät' : 'Nicht verfügbar (Text einfügen möglich)'; },
  hint() {
    return 'PDF, JPG oder PNG – erkannte Angaben werden automatisch eingetragen.';
  },
  async fromImage(blob, progress) {
    if (TextRecognition.nativeAvailable()) {
      const id = newId();
      const b64 = (await Receipts.blobToDataURL(blob)).split(',')[1];
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => { TextRecognition.pending.delete(id); reject(new UserError('Die Texterkennung hat nicht rechtzeitig geantwortet.')); }, TextRecognition.TIMEOUT);
        TextRecognition.pending.set(id, { resolve, reject, t });
        try { window.GarantieBoxNative.recognizeText(id, b64, blob.type); }
        catch (e) { clearTimeout(t); TextRecognition.pending.delete(id); reject(new UserError('Die Texterkennung der App konnte nicht gestartet werden.')); }
      });
    }
    if (TextRecognition.detectorAvailable()) {
      const bmp = await createImageBitmap(blob);
      try {
        const res = await new window.TextDetector().detect(bmp);
        return TextRecognition.joinBoxes((res || []).map(r => ({ t: r.rawValue || '', b: r.boundingBox })).filter(r => r.t && r.b));
      } finally { if (bmp.close) bmp.close(); }
    }
    if (TessOCR.present) return TessOCR.recognize(blob, progress);
    return null;
  },
  /** Erkannte Textblöcke (mit Position) zu Zeilen zusammensetzen. */
  joinBoxes(list) {
    const items = list.map(r => ({ t: r.t.trim(), x: r.b.x, cy: r.b.y + r.b.height / 2, h: r.b.height })).filter(r => r.t);
    items.sort((a, b) => a.cy - b.cy || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const row = rows[rows.length - 1];
      if (row && Math.abs(row.cy - it.cy) < 0.5 * Math.min(row.h, it.h)) row.items.push(it);
      else rows.push({ cy: it.cy, h: it.h, items: [it] });
    }
    return rows.map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.t).join(' ')).join('\n');
  }
};
/** Rückkanal für die native Texterkennung. */
window.GarantieBoxOCR = {
  done(id, text) { const p = TextRecognition.pending.get(id); if (!p) return; clearTimeout(p.t); TextRecognition.pending.delete(id); p.resolve(String(text == null ? '' : text)); },
  fail(id, msg) { const p = TextRecognition.pending.get(id); if (!p) return; clearTimeout(p.t); TextRecognition.pending.delete(id); p.reject(new UserError(msg ? String(msg).slice(0, 200) : 'Die Texterkennung ist fehlgeschlagen.')); }
};

const Scan = {
  /** Rechnung hochladen: anhängen, Text lesen, erkannte Angaben in leere Felder eintragen. */
  async upload(F, file) {
    F.busy = true;
    Scan.clearResult();
    renderFormReceipt('Rechnung wird geladen …');
    let prep;
    try { prep = await Receipts.prepare(file); }
    catch (e) { F.busy = false; if (App.form === F) renderFormReceipt(); UI.toast(e instanceof UserError ? e.message : 'Die Datei konnte nicht gelesen werden.', 'error'); return; }
    F.pending = prep; F.removeExisting = false;
    F.pendingFromDraft = await Draft.saveReceipt(prep);
    await Scan.autoFill(F, prep);
  },
  async autoFill(F, prep, pastedText) {
    F.busy = true;
    let text = pastedText || null, problem = null, msg = '';
    if (!text) {
      renderFormReceipt('Rechnung wird gelesen …');
      try {
        if (prep.type === 'application/pdf') {
          const u8 = new Uint8Array(await prep.blob.arrayBuffer());
          text = await PdfText.extract(u8);
          if (!text.replace(/\s/g, '')) {
            // Gescannte PDF (z. B. aus Google Drive oder der Samsung-Kamera): Seitenbilder mit der Texterkennung lesen
            await TessOCR.probe();
            if (TextRecognition.imageAvailable()) {
              const imgs = await PdfText.images(u8, 2).catch(() => []);
              for (const img of imgs) {
                const t = await TextRecognition.fromImage(img, (tt, pp) => { if (App.form === F) renderFormReceipt(tt + (typeof pp === 'number' && pp > 0 ? ' ' + Math.round(pp * 100) + ' %' : '')); });
                if (t) text += '\n' + t;
              }
            }
            if (!text.replace(/\s/g, '')) problem = 'pdf-no-text';
          }
        } else if ((await TessOCR.probe(), TextRecognition.imageAvailable())) {
          text = await TextRecognition.fromImage(prep.blob, (t, p) => { if (App.form === F) renderFormReceipt(t + (typeof p === 'number' && p > 0 ? ' ' + Math.round(p * 100) + ' %' : '')); });
          if (!text || !text.replace(/\s/g, '')) problem = 'ocr-empty';
        } else problem = 'no-ocr';
      } catch (e) { console.warn('Scan', e); problem = 'error'; msg = e instanceof UserError ? e.message : 'Die Rechnung konnte nicht gelesen werden.'; }
    }
    F.busy = false;
    if (App.form !== F) return;
    renderFormReceipt();
    // Ohne Texterkennung auf dem Gerät (nur reine HTML-Datei ohne ocr/-Ordner) wird das Foto still angehängt.
    if (problem === 'no-ocr') { Draft.saveNow(); return; }
    if (problem) { Scan.showResult(F, { problem, msg }); Draft.saveNow(); return; }
    const r = ReceiptParser.parse(text, App.today, DateUtil.isValid);
    Scan.showResult(F, { filled: Scan.fillEmpty(F, r) });
    updateWarrantyPreview();
    Draft.saveNow();
  },
  FILL: [['name', 'f-name', 'Produkt'], ['purchaseDate', 'f-purchaseDate', 'Kaufdatum'], ['price', 'f-price', 'Preis'], ['retailer', 'f-retailer', 'Händler'],
    ['serialNumber', 'f-serialNumber', 'Seriennummer'], ['modelNumber', 'f-modelNumber', 'Modellnummer'], ['category', 'f-category', 'Kategorie']],
  /** Trägt nur in leere Felder ein – was du selbst geschrieben hast, bleibt stehen. */
  fillEmpty(F, r) {
    const undo = {}, filled = [];
    for (const [k, id, label] of Scan.FILL) {
      let v = k === 'price' ? (r.priceCents != null ? Money.toInput(r.priceCents / 100) : '') : (r[k] || '');
      const el = $('#' + id);
      if (!v || !el) continue;
      if (k === 'category') {
        if (F.catTouched || el.value === v || ![...el.options].some(o => o.value === v)) continue;
      } else if (el.value.trim()) continue;
      if (k === 'purchaseDate' && (!DateUtil.isValid(v) || v > App.today)) continue;
      undo[id] = el.value;
      if (k === 'purchaseDate') DateInput.set(id, v); else el.value = v;
      el.classList.add('autofilled');
      const err = $('#err-' + k); if (err) { err.hidden = true; el.removeAttribute('aria-invalid'); }
      filled.push(label);
    }
    F.autoUndo = undo;
    if (filled.some(l => !['Produkt', 'Kaufdatum'].includes(l))) { const md = $('#more-fields'); if (md) md.open = true; }
    return filled;
  },
  undo() {
    const F = App.form; if (!F || !F.autoUndo) return;
    for (const [id, v] of Object.entries(F.autoUndo)) { const el = $('#' + id); if (el) { el.value = v; el.classList.remove('autofilled'); } }
    F.autoUndo = null;
    Scan.clearResult();
    updateWarrantyPreview();
    Draft.saveNow();
  },
  clearResult() { const el = $('#scan-result'); if (el) el.innerHTML = ''; },
  showResult(F, res) {
    const el = $('#scan-result'); if (!el) return;
    const paste = '<button class="link-btn" type="button" data-action="scan-paste">Text einfügen</button>';
    let html;
    if (res.problem) {
      const t = {
        'ocr-empty': 'Rechnung hinzugefügt. Auf dem Foto wurde kein Text erkannt.',
        'pdf-no-text': 'Rechnung hinzugefügt. Die PDF enthält keinen lesbaren Text.',
        'error': 'Rechnung hinzugefügt. ' + res.msg
      }[res.problem];
      html = `<div class="notice notice-info">${esc(t)} ${paste}</div>`;
    } else if (res.filled.length) {
      const n = res.filled.length;
      html = `<div class="notice notice-ok"><strong>${n} ${plural(n, 'Angabe', 'Angaben')} eingetragen:</strong> ${esc(res.filled.join(', '))}. Bitte kurz prüfen. <button class="link-btn" type="button" data-action="scan-undo">Rückgängig</button></div>`;
    } else {
      html = `<div class="notice notice-info">Rechnung hinzugefügt. Es wurden keine neuen Angaben erkannt. ${paste}</div>`;
    }
    el.innerHTML = html;
  },
  async paste() {
    const F = App.form; if (!F || F.busy || !F.pending) return;
    const r = await Scan.askText('paste', '', { attach: false });
    if (!r || App.form !== F) return;
    await Scan.autoFill(F, F.pending, r.text);
  },
  async askText(problem, msg, { attach = true } = {}) {
    const lensTip = `<p class="small">Tipp: Öffne das Foto in Google Fotos, tippe auf <strong>Lens</strong> → <strong>Text</strong> → <strong>Kopieren</strong> und füge den Text hier ein.</p>`;
    const intro = {
      'no-ocr': `<p>Fotos können auf diesem Gerät nicht automatisch gelesen werden.</p>${lensTip}`,
      'ocr-empty': `<p>Auf dem Foto wurde kein Text gefunden. Fotografiere die Rechnung bei gutem Licht gerade von oben.</p>${lensTip}`,
      'pdf-no-text': '<p>Diese PDF enthält keinen lesbaren Text, nur ein Bild. Füge den Text ein oder speichere die PDF nur als Rechnung.</p>',
      'error': `<p>${esc(msg)}</p><p class="small">Füge den Text ein oder speichere die Datei nur als Rechnung.</p>`,
      'paste': `<p>Füge den Text der Rechnung ein, die Angaben werden dann automatisch eingetragen.</p>${lensTip}`
    }[problem];
    const res = await UI.modal({
      title: problem === 'no-ocr' || problem === 'paste' ? 'Text einfügen' : 'Kein Text gefunden',
      html: `${intro}
        <div class="field"><label for="scan-text">Text der Rechnung</label><textarea class="input" id="scan-text" rows="6" placeholder="Hier einfügen …" spellcheck="false"></textarea></div>`,
      actions: [
        { label: 'Text auswerten', value: 'text', kind: 'primary' },
        ...(attach ? [{ label: 'Nur als Rechnung speichern', value: 'attach', kind: 'secondary' }] : []),
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ],
      check: (value, el) => {
        if (value !== 'text') return { data: null };
        const t = el.querySelector('#scan-text').value;
        if (!t.trim()) return { error: 'Bitte füge zuerst den Text der Rechnung ein.' };
        return { data: t.slice(0, 20000) };
      }
    });
    if (!res.value) return null;
    return res.value === 'attach' ? { mode: 'attach' } : { mode: 'text', text: res.data };
  }
};

      d.text(xs[0] + P, y + 13, p.name, { size: 9.5, font: 'b', color: C.ink, maxW: cols[0][1] - 2 * P });
      d.text(xs[0] + P, y + 25, [p.category, p.modelNumber].filter(Boolean).join(' · '), { size: 7.5, color: C.muted, maxW: cols[0][1] - 2 * P });
      d.text(xs[1] + P, y + 19, p.retailer || '–', { size: 9, color: C.ink2, maxW: cols[1][1] - 2 * P });
      d.text(xs[2] + P, y + 19, DateUtil.format(p.purchaseDate), { size: 9, color: C.ink2 });
      d.text(xs[3] + P, y + 19, DateUtil.format(p.warrantyEnd), { size: 9, font: 'b', color: C.ink });
      d.circle(xs[4] + P + 3, y + 10, 3, C[s.key]);
      d.text(xs[4] + P + 10, y + 13, PdfReport.SHORT[s.key], { size: 8.5, font: 'b', color: C[s.key], maxW: cols[4][1] - 2 * P - 10 });
      d.text(xs[4] + P + 10, y + 25, PdfReport.compact(s.text), { size: 7.5, color: C.muted, maxW: cols[4][1] - 2 * P - 10 });
      d.text(xs[5] + cols[5][1] - P, y + 19, p.price != null ? Money.format(p.price) : '–', { size: 9, color: C.ink, align: 'right' });
      y += RH;
      d.line(M, y, d.W - M, y, C.line, 0.4);
    });
    if (y + 26 > bottom) { d.addPage(); y = PdfReport.header(d, 'Garantieübersicht', today); }
    y += 18;
    d.text(xs[5] + cols[5][1] - P - 80, y, 'Gesamtwert', { size: 9, color: C.muted, align: 'right' });
    d.text(xs[5] + cols[5][1] - P, y, Money.formatCents(totalCents), { size: 10, font: 'b', color: C.ink, align: 'right' });
  },
  async detail(d, p, today, docTitle) {
    const { M, C } = PdfReport;
    d.addPage();
    let y = PdfReport.header(d, docTitle, today);
    const W = d.W - 2 * M, bottom = d.H - 56;
    const s = Status.of(p, today);
    const lines = d.wrap(p.name, 18, 'b', W).slice(0, 3);
    lines.forEach((l, i) => d.text(M, y + 6 + i * 22, l, { size: 18, font: 'b', color: C.ink }));
    y += 6 + (lines.length - 1) * 22 + 16;
    d.text(M, y, p.category, { size: 10, color: C.muted });
    y += 14;
    const badge = `${Status.LABELS[s.key]} · ${s.text}`;
    const bw = d.width(badge, 9.5, 'b') + 30;
    d.roundRect(M, y, Math.min(bw, W), 22, 11, C[s.key + 'Soft']);
    d.circle(M + 12, y + 11, 3.2, C[s.key]);
    d.text(M + 21, y + 14.5, badge, { size: 9.5, font: 'b', color: C[s.key], maxW: W - 30 });
    y += 38;
    const rem = p.reminders.length ? p.reminders.slice().sort((a, b) => b - a).map(r => r + ' Tage').join(', ') + ' vorher' : 'Keine';
    const fields = [
      ['Kaufdatum', DateUtil.format(p.purchaseDate)], ['Kaufpreis', p.price != null ? Money.format(p.price) : '–'],
      ['Händler', p.retailer || '–'], ['Garantiezeit', durationLabel(p)],
      ['Garantie ab', DateUtil.format(p.warrantyStart)], ['Garantie bis', DateUtil.format(p.warrantyEnd)],
      ['Seriennummer', p.serialNumber || '–'], ['Modellnummer', p.modelNumber || '–'],
      ['Erinnerungen', rem]
    ];
    const colW = (W - 20) / 2;
    d.roundRect(M, y, W, Math.ceil(fields.length / 2) * 40 + 12, 8, C.zebra, C.line, 0.6);
    fields.forEach(([l, v], i) => {
      const x = M + 14 + (i % 2) * (colW + 20), yy = y + 18 + Math.floor(i / 2) * 40;
      d.text(x, yy, l, { size: 8, color: C.muted });
      d.text(x, yy + 15, v, { size: 11, font: l === 'Garantie bis' ? 'b' : 'r', color: C.ink, maxW: colW - 20 });
    });
    y += Math.ceil(fields.length / 2) * 40 + 30;
    if (p.notes) {
      d.text(M, y, 'Notizen', { size: 8, color: C.muted });
      y += 14;
      for (const l of d.wrap(p.notes, 10, 'r', W)) {
        if (y > bottom - 10) { d.addPage(); y = PdfReport.header(d, docTitle, today); }
        d.text(M, y, l, { size: 10, color: C.ink2 }); y += 14;
      }
      y += 10;
    }
    // Rechnung
    if (y + 40 > bottom) { d.addPage(); y = PdfReport.header(d, docTitle, today); }
    d.text(M, y, 'Rechnung', { size: 12, font: 'b', color: C.ink });
    y += 16;
    if (!p.receipt) { d.text(M, y, 'Keine Rechnung gespeichert.', { size: 10, color: C.muted }); return; }
    if (p.receipt.type === 'application/pdf') {
      d.text(M, y, `PDF-Rechnung „${p.receipt.name}“ ist in der App gespeichert und kann dort geöffnet werden.`, { size: 10, color: C.ink2, maxW: W });
      return;
    }
    let rec = null;
    try { rec = await Store.getReceipt(p.receipt.id); } catch (e) { rec = null; }
    if (!rec || !rec.blob) { d.text(M, y, 'Die Rechnungsdatei konnte nicht geladen werden.', { size: 10, color: C.muted }); return; }
    let img;
    try { img = await PdfReport.jpeg(rec.blob); } catch (e) { d.text(M, y, 'Das Rechnungsbild konnte nicht eingebunden werden.', { size: 10, color: C.muted }); return; }
    let avail = bottom - y;
    if (avail < 260) { d.addPage(); y = PdfReport.header(d, docTitle + ' – Rechnung', today); avail = bottom - y; }
    const sc = Math.min(W / img.w, avail / img.h);
    const iw = img.w * sc, ih = img.h * sc, ix = M + (W - iw) / 2;
    d.image(d.addJpeg(img.u8, img.w, img.h), ix, y, iw, ih);
    d.roundRect(ix, y, iw, ih, 0.01, null, C.line, 0.6);
  },
  slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'produkt'; },
  async overviewPdf(withDetails) {
    const today = App.today, list = PdfReport.sorted(App.products, today);
    const d = new PdfWriter.Doc();
    PdfReport.overview(d, list, today);
    if (withDetails) for (const p of list) await PdfReport.detail(d, p, today, 'Produktdatenblatt');
    PdfReport.footers(d, today);
    return { blob: await d.build({ title: 'Garantieübersicht', author: APP_NAME }), file: `belegwaechter-${withDetails ? 'uebersicht-details' : 'uebersicht'}-${today}.pdf` };
  },
  async productPdf(p) {
    const today = App.today, d = new PdfWriter.Doc();
    await PdfReport.detail(d, p, today, 'Produktdatenblatt');
    PdfReport.footers(d, today);
    return { blob: await d.build({ title: p.name, author: APP_NAME }), file: `belegwaechter-${PdfReport.slug(p.name)}-${today}.pdf` };
  },
  async run(make) {
    UI.toast('PDF wird erstellt …');
    try { const { blob, file } = await make(); downloadBlob(blob, file); UI.toast('PDF heruntergeladen'); }
    catch (e) { console.error('PDF', e); UI.toast('Die PDF konnte nicht erstellt werden.', 'error'); }
  },
  async askAndExport() {
    if (!App.products.length) { UI.toast('Es sind noch keine Produkte gespeichert.'); return; }
    const v = await UI.modal({
      title: 'PDF erstellen',
      html: '<p>Zum Ausdrucken oder Weitergeben, z. B. an die Versicherung.</p>',
      actions: [
        { label: 'Übersicht', value: 'overview', kind: 'primary', icon: 'pdf' },
        { label: 'Übersicht mit Details und Rechnungen', value: 'details', kind: 'secondary' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (v) PdfReport.run(() => PdfReport.overviewPdf(v === 'details'));
  }
};

/* ===================== 6e. KALENDER-ERINNERUNG ===================== */
/**
 * Erinnerung über den Kalender des Handys – funktioniert auch, wenn Belegwächter geschlossen ist.
 * Kalenderdatei (.ics) mit Termin am Garantieende und Erinnerungen 7/14/30/… Tage vorher um 9 Uhr.
 * Hinweis: Eine Web-App (auch in Chrome/TWA) darf die Kalender-App nicht direkt öffnen – Chrome startet aus
 * Webseiten nur Apps, die sich ausdrücklich dafür freigeben; der Kalender tut das nicht. Daher der Weg über die Datei.
 */
const CalendarExport = {
  title(p) { return `Garantie endet: ${p.name}`; },
  details(p) {
    return [
      `Die Garantie für „${p.name}“ endet am ${DateUtil.format(p.warrantyEnd)}.`,
      `Kaufdatum: ${DateUtil.format(p.purchaseDate)}`,
      p.retailer ? `Händler: ${p.retailer}` : '',
      p.price != null ? `Kaufpreis: ${Money.format(p.price)}` : '',
      p.serialNumber ? `Seriennummer: ${p.serialNumber}` : '',
      p.modelNumber ? `Modellnummer: ${p.modelNumber}` : '',
      'Rechnung und Details findest du in Belegwächter.'
    ].filter(Boolean).join('\n');
  },
  /** iCalendar-Text (RFC 5545): Zeilenumbrüche CRLF, lange Zeilen gefaltet, Sonderzeichen maskiert. */
  ics(list, today) {
    const esc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const date = iso => iso.replace(/-/g, '');
    const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const enc = new TextEncoder();
    const fold = line => {
      const out = []; let cur = '', len = 0;
      for (const ch of line) {
        const b = enc.encode(ch).length;
        if (len + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; len = 0; }
        cur += ch; len += b;
      }
      out.push(cur);
      return out.join('\r\n ');
    };
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Belegwaechter//DE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Garantien'];
    for (const p of list) {
      if (p.warrantyEnd < today) continue;
      const next = DateUtil.addDays(p.warrantyEnd, 1);
      lines.push('BEGIN:VEVENT', `UID:${p.id}@belegwaechter`, `DTSTAMP:${now}`,
        `DTSTART;VALUE=DATE:${date(p.warrantyEnd)}`, `DTEND;VALUE=DATE:${date(next)}`,
        `SUMMARY:${esc(CalendarExport.title(p))}`, `DESCRIPTION:${esc(CalendarExport.details(p))}`,
        'TRANSP:TRANSPARENT', 'CATEGORIES:Garantie');
      // Erinnerungen um 9 Uhr am jeweiligen Tag (relativ zu Mitternacht des Garantieendes)
      for (const d of (p.reminders || []).slice().sort((a, b) => b - a)) {
        if (DateUtil.addDays(p.warrantyEnd, -d) < today) continue;
        lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc(`Garantie endet in ${d} Tagen: ${p.name}`)}`, `TRIGGER:-P${d - 1}DT15H`, 'END:VALARM');
      }
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc(`Garantie endet heute: ${p.name}`)}`, 'TRIGGER:PT9H', 'END:VALARM');
      lines.push('END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.map(fold).join('\r\n') + '\r\n';
  },
  download(p) {
    const text = CalendarExport.ics([p], App.today);
    downloadBlob(new Blob([text], { type: 'text/calendar;charset=utf-8' }), `belegwaechter-${PdfReport.slug(p.name)}.ics`);
    UI.toast('Kalenderdatei heruntergeladen. Öffne sie, um den Termin zu übernehmen.', 'info', 6000);
  },
  async ask(p) {
    if (p.warrantyEnd < App.today) { UI.toast('Diese Garantie ist bereits abgelaufen.'); return; }
    const days = (p.reminders || []).filter(d => DateUtil.addDays(p.warrantyEnd, -d) >= App.today).sort((a, b) => b - a);
    const rem = days.length ? `Erinnerung ${days.join(', ').replace(/, (\d+)$/, ' und $1')} Tage vorher` : 'Erinnerung am Tag des Garantieendes';
    const v = await UI.modal({
      title: 'In Kalender eintragen',
      html: `<p>Dein Kalender erinnert dich an das Garantieende, auch wenn Belegwächter geschlossen ist.</p>
        <div class="cal-preview"><span class="pt-ico">${ico('calendar', '')}</span><span><strong>${esc(CalendarExport.title(p))}</strong>
        <span>Am ${DateUtil.format(p.warrantyEnd)}, ${esc(rem)}</span></span></div>
        <p class="small muted">Öffne danach die heruntergeladene Datei, z. B. über die Download-Benachrichtigung. Dein Kalender übernimmt den Termin dann mit einem Tipp.</p>`,
      actions: [
        { label: 'Kalenderdatei herunterladen', value: 'ics', kind: 'primary', icon: 'calendar' },
        { label: 'Abbrechen', value: null, kind: 'ghost' }
      ]
    });
    if (v === 'ics') CalendarExport.download(p);
  }
};

/* ===================== 6f. CLOUD-SICHERUNG (Firebase) ===================== */
/**
 * Freiwillige, automatische Sicherung im eigenen Google-Konto – Prinzip wie beim WhatsApp-Backup.
 *  - Einmal mit Google anmelden (Firebase Authentication). Die Anmeldung bleibt gespeichert.
 *  - Nach jeder Änderung wird die Cloud-Kopie aktualisiert (Cloud Storage for Firebase):
 *      users/<uid>/data.json            Produktliste
 *      users/<uid>/receipts/<id>        jede Rechnung einzeln, wird nur einmal hochgeladen
 *  - Neues Handy / neu installiert: anmelden → „Sicherung gefunden – wiederherstellen?“
 *  - Schutz: Ein leeres Gerät überschreibt nie eine gefüllte Sicherung. Hat ein anderes Gerät
 *    zwischenzeitlich gesichert, wird gefragt, statt still zu überschreiben.
 * Einrichtung: siehe FIREBASE-ANLEITUNG.md. Ohne Konfiguration bleibt die Funktion unsichtbar.
 */
const FIREBASE_CONFIG = window.GM_FIREBASE_CONFIG || null; // ← hier die Konfiguration aus der Firebase-Konsole einsetzen
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/12.18.0/';

const Cloud = {
  fb: null, user: null, ready: null, timer: null, busy: false, again: false,
  state: 'idle', error: '',
  enabled() { return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && /^https?:$/.test(location.protocol)); },
  deviceId() { let id = Prefs.get('cloudDevice', null); if (!id) { id = newId(); Prefs.set('cloudDevice', id); } return id; },
  /** Firebase-Bibliothek erst laden, wenn sie gebraucht wird. */
  load() {
    if (Cloud.ready) return Cloud.ready;
    Cloud.ready = (async () => {
      const [appM, authM, stM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-storage.js'].map(f => import(FIREBASE_SDK + f)));
      const app = appM.initializeApp(FIREBASE_CONFIG);
      const auth = authM.getAuth(app);
      auth.languageCode = 'de';
      Cloud.fb = { authM, stM, auth, storage: stM.getStorage(app) };
      try { await authM.getRedirectResult(auth); } catch (e) { Cloud.fail(e); }
      await new Promise(res => {
        let first = true;
        authM.onAuthStateChanged(auth, u => { Cloud.user = u; if (first) { first = false; res(); } else Cloud.refreshUI(); });
      });
      return Cloud.fb;
    })().catch(e => { Cloud.ready = null; throw e; });
    return Cloud.ready;
  },
  /** App-Start: nur laden, wenn die Cloud-Sicherung schon einmal eingeschaltet wurde. */
  async init() {
    if (!Cloud.enabled() || !Prefs.get('cloudOn', false)) return;
    try {
      await Cloud.load();
      if (Cloud.user) await Cloud.check(false);
      else if (Prefs.get('cloudPendingRedirect', false)) { Prefs.set('cloudPendingRedirect', false); }
    } catch (e) { Cloud.fail(e); }
    Cloud.refreshUI();
  },
  base() { return `users/${Cloud.user.uid}/`; },
  ref(path) { return Cloud.fb.stM.ref(Cloud.fb.storage, Cloud.base() + path); },
  sig() { return App.products.map(p => `${p.id}:${p.updatedAt}:${p.receipt ? p.receipt.id : ''}`).sort().join('|'); },

  async signIn() {
    Prefs.set('cloudOn', true);
    try {
      const { authM, auth } = await Cloud.load();
      const provider = new authM.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      // Liegt die App auf derselben Domain wie die Anmeldung (Firebase Hosting), ist die Weiterleitung am zuverlässigsten.
      if (location.hostname === FIREBASE_CONFIG.authDomain) { Prefs.set('cloudPendingRedirect', true); await authM.signInWithRedirect(auth, provider); return; }
      try { await authM.signInWithPopup(auth, provider); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e && e.code)) { Prefs.set('cloudPendingRedirect', true); await authM.signInWithRedirect(auth, provider); return; }
        throw e;
      }
      Cloud.user = auth.currentUser;
      UI.toast('Angemeldet als ' + (Cloud.user.email || 'Google-Konto'));
      await Cloud.check(true);
    } catch (e) {
      if (e && ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(e.code)) { if (!Cloud.user) Prefs.set('cloudOn', false); }
      else { Cloud.fail(e); UI.toast(Cloud.errorText(e), 'error'); }
    }
    Cloud.refreshUI();
  },
  /** Nach der Anmeldung / beim Start: gibt es eine Sicherung? Wiederherstellen oder sichern? */
  async check(interactive) {
    let remote = null;
    try { remote = await Cloud.fetchData(); } catch (e) { Cloud.fail(e); return; }
    const local = App.products.length;
    const remoteCount = remote ? remote.products.length : 0;
    if (remoteCount && !local) {
      const v = await UI.modal({
        title: 'Sicherung gefunden',
        html: `<p>In deinem Konto liegt eine Sicherung vom <strong>${esc(Cloud.when(remote.savedAt))}</strong> mit <strong>${remoteCount} ${plural(remoteCount, 'Produkt', 'Produkten')}</strong>.</p>`,
        actions: [{ label: 'Wiederherstellen', value: 'restore', kind: 'primary', icon: 'upload' }, { label: 'Später', value: null, kind: 'ghost' }]
      });
      if (v === 'restore') await Cloud.restore(remote);
      else Cloud.setState('paused-empty');
      return;
    }
    const foreign = remote && remoteCount && remote.deviceId !== Cloud.deviceId() && remote.savedAt > Prefs.get('cloudLastUpload', '');
    if (foreign && local) {
      const v = await UI.modal({
        title: 'Andere Sicherung gefunden',
        html: `<p>Ein anderes Gerät hat am <strong>${esc(Cloud.when(remote.savedAt))}</strong> gesichert (${remoteCount} ${plural(remoteCount, 'Produkt', 'Produkte')}). Auf diesem Gerät sind ${local} ${plural(local, 'Produkt', 'Produkte')}.</p>
          <p class="small muted">Die Cloud-Sicherung enthält immer den Stand eines Geräts. Wähle, welcher gelten soll.</p>`,
        actions: [
          { label: 'Sicherung übernehmen', value: 'restore', kind: 'primary' },
          { label: 'Dieses Gerät sichern', value: 'upload', kind: 'secondary' },
          { label: 'Später entscheiden', value: null, kind: 'ghost' }
        ]
      });
      if (v === 'restore') await Cloud.restore(remote);
      else if (v === 'upload') await Cloud.upload(true);
      else Cloud.setState('paused-conflict');
      return;
    }
    if (interactive || Cloud.sig() !== Prefs.get('cloudSig', '')) Cloud.schedule(interactive ? 0 : 3000);
    else Cloud.setState('ok');
  },
  /** Nach jeder Änderung (reload) aufgerufen: kurz warten, dann sichern. */
  schedule(delay = 8000) {
    if (!Cloud.user || ['paused-conflict'].includes(Cloud.state)) return;
    clearTimeout(Cloud.timer);
    Cloud.timer = setTimeout(() => Cloud.upload(false), delay);
  },
  async upload(force) {
    if (!Cloud.user) return;
    if (Cloud.busy) { Cloud.again = true; return; }
    const sig = Cloud.sig();
    if (!force && sig === Prefs.get('cloudSig', '')) { Cloud.setState('ok'); return; }
    if (navigator.onLine === false) { Cloud.setState('offline'); return; }
    Cloud.busy = true; Cloud.setState('saving');
    try {
      const { stM } = Cloud.fb;
      if (!App.products.length) {
        const remote = await Cloud.fetchData();
        if (remote && remote.products.length && !force) { Cloud.setState('paused-empty'); return; }
      }
      const have = new Set((await stM.listAll(Cloud.ref('receipts'))).items.map(i => i.name));
      const used = new Set();
      for (const p of App.products) {
        if (!p.receipt) continue;
        used.add(p.receipt.id);
        if (have.has(p.receipt.id)) continue;
        const rec = await Store.getReceipt(p.receipt.id);
        if (rec && rec.blob) await stM.uploadBytes(Cloud.ref('receipts/' + p.receipt.id), rec.blob, { contentType: rec.type || 'application/octet-stream' });
      }
      const data = { app: APP_NAME, kind: 'cloud', version: 1, savedAt: new Date().toISOString(), deviceId: Cloud.deviceId(), products: App.products };
      await stM.uploadString(Cloud.ref('data.json'), JSON.stringify(data), 'raw', { contentType: 'application/json' });
      for (const name of have) if (!used.has(name)) { try { await stM.deleteObject(Cloud.ref('receipts/' + name)); } catch (e) { /* egal */ } }
      Prefs.set('cloudSig', sig); Prefs.set('cloudLastUpload', data.savedAt);
      Cloud.setState('ok');
    } catch (e) { Cloud.fail(e); }
    finally {
      Cloud.busy = false;
      if (Cloud.again) { Cloud.again = false; Cloud.schedule(2000); }
      Cloud.refreshUI();
    }
  },
  async fetchData() {
    try {
      const bytes = await Cloud.fb.stM.getBytes(Cloud.ref('data.json'));
      const obj = JSON.parse(new TextDecoder().decode(bytes));
      return obj && APP_IDS.includes(obj.app) && Array.isArray(obj.products) ? obj : null;
    } catch (e) {
      if (e && e.code === 'storage/object-not-found') return null;
      throw e;
    }
  },
  async restore(remote) {
    Cloud.setState('restoring');
    UI.toast('Sicherung wird geladen …');
    try {
      remote = remote || await Cloud.fetchData();
      if (!remote) { UI.toast('In deinem Konto gibt es noch keine Sicherung.'); Cloud.setState('ok'); return; }
      const receipts = [];
      for (const p of remote.products) {
        if (!p.receipt) continue;
        try {
          const blob = await Cloud.fb.stM.getBlob(Cloud.ref('receipts/' + p.receipt.id));
          receipts.push({ id: p.receipt.id, productId: p.id, name: p.receipt.name, type: p.receipt.type, size: p.receipt.size, addedAt: remote.savedAt, dataUrl: await Receipts.blobToDataURL(blob) });
        } catch (e) { console.warn('Rechnung fehlt in der Sicherung', p.receipt.id, e); }
      }
      const parsed = Backup.parse({ app: APP_NAME, kind: 'backup', version: 1, createdAt: remote.savedAt, products: remote.products, receipts });
      await Store.replaceAll(parsed.products, parsed.receipts);
      await Draft.clear();
      await reload();
      Prefs.set('cloudSig', Cloud.sig()); Prefs.set('cloudLastUpload', remote.savedAt);
      Cloud.setState('ok');
      UI.toast(`${parsed.products.length} ${plural(parsed.products.length, 'Produkt', 'Produkte')} wiederhergestellt`);
      go('dashboard');
    } catch (e) { Cloud.fail(e); UI.toast(Cloud.errorText(e), 'error'); }
    Cloud.refreshUI();
  },
  async signOut() {
    clearTimeout(Cloud.timer);
    try { await Cloud.fb.authM.signOut(Cloud.fb.auth); } catch (e) { /* egal */ }
    Cloud.user = null; Prefs.set('cloudOn', false); Prefs.set('cloudSig', ''); Prefs.set('cloudLastUpload', '');
    Cloud.setState('idle');
    UI.toast('Abgemeldet. Deine Daten auf diesem Gerät bleiben erhalten.');
    Cloud.refreshUI();
  },
  /** Cloud-Sicherung und Konto vollständig löschen (Pflicht bei Apps mit Konto, siehe Google-Play-Richtlinien). */
  async deleteAll() {
    const ok = await UI.confirm({
      title: 'Cloud-Sicherung löschen?',
      html: '<p>Alle Produkte und Rechnungen in deinem Konto und das Konto selbst werden gelöscht. Die Daten auf diesem Gerät bleiben erhalten.</p>',
      confirmLabel: 'Endgültig löschen', danger: true
    });
    if (!ok) return;
    try {
      const { stM, authM, auth } = Cloud.fb;
      const del = async () => {
        const list = await stM.listAll(Cloud.ref('receipts'));
        for (const it of list.items) await stM.deleteObject(it).catch(() => {});
        await stM.deleteObject(Cloud.ref('data.json')).catch(e => { if (!e || e.code !== 'storage/object-not-found') throw e; });
        await auth.currentUser.delete();
      };
      try { await del(); }
      catch (e) {
        if (e && e.code === 'auth/requires-recent-login') { await authM.reauthenticateWithPopup(auth.currentUser, new authM.GoogleAuthProvider()); await del(); }
        else throw e;
      }
      Cloud.user = null; Prefs.set('cloudOn', false); Prefs.set('cloudSig', ''); Prefs.set('cloudLastUpload', '');
      Cloud.setState('idle');
      UI.toast('Cloud-Sicherung und Konto gelöscht');
    } catch (e) { Cloud.fail(e); UI.toast(Cloud.errorText(e), 'error'); }
    Cloud.refreshUI();
  },
  when(iso) { const d = new Date(iso); return isNaN(d) ? '–' : new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(d); },
  setState(s) { Cloud.state = s; if (s !== 'error') Cloud.error = ''; Cloud.refreshUI(); },
  fail(e) { console.warn('Cloud', e); Cloud.state = 'error'; Cloud.error = Cloud.errorText(e); Cloud.refreshUI(); },
  errorText(e) {
    const c = (e && e.code) || '';
    if (/network|unavailable|retry-limit/.test(c) || navigator.onLine === false) return 'Keine Internetverbindung. Die Sicherung wird nachgeholt.';
    if (/unauthorized|unauthenticated|permission/.test(c)) return 'Kein Zugriff auf die Sicherung. Bitte melde dich neu an.';
    if (/quota/.test(c)) return 'Der Cloud-Speicher ist voll.';
    if (/unauthorized-domain/.test(c)) return 'Anmeldung von dieser Adresse aus nicht erlaubt (Firebase-Einstellungen prüfen).';
    if (/popup-blocked/.test(c)) return 'Das Anmeldefenster wurde blockiert.';
    return 'Die Cloud-Sicherung hat nicht funktioniert.';
  },
  statusText() {
    switch (Cloud.state) {
      case 'saving': return 'Wird gesichert …';
      case 'restoring': return 'Wird wiederhergestellt …';
      case 'offline': return 'Offline, wird nachgeholt';
      case 'paused-empty': return 'Pausiert: Auf diesem Gerät sind keine Produkte';
      case 'paused-conflict': return 'Pausiert: Bitte wählen, welcher Stand gilt';
      case 'error': return Cloud.error || 'Fehler';
      default: { const t = Prefs.get('cloudLastUpload', ''); return t ? 'Gesichert am ' + Cloud.when(t) : 'Noch nicht gesichert'; }
    }
  },
  section() {
    if (!Cloud.enabled()) return '';
    const u = Cloud.user;
    const body = u ? `
        <div class="kv"><span class="muted">Konto</span><strong class="cloud-mail">${esc(u.email || 'Google-Konto')}</strong></div>
        <div class="kv"><span class="muted">Status</span><strong class="cloud-state cloud-${esc(Cloud.state)}">${esc(Cloud.statusText())}</strong></div>
        <div class="btn-row">
          <button class="btn btn-secondary" type="button" data-action="cloud-now" ${Cloud.busy ? 'disabled' : ''}>${ico('upload')}Jetzt sichern</button>
          <button class="btn btn-secondary" type="button" data-action="cloud-restore" ${Cloud.busy ? 'disabled' : ''}>Wiederherstellen</button>
        </div>
        <button class="btn btn-ghost btn-block" type="button" data-action="cloud-signout">Abmelden</button>
        <button class="btn btn-ghost btn-block danger-text" type="button" data-action="cloud-delete">Cloud-Sicherung und Konto löschen</button>`
      : `
        <p>Sichert deine Produkte und Rechnungen automatisch in deinem Google-Konto. Auf einem neuen Handy anmelden, und alles ist wieder da.</p>
        <button class="btn btn-primary btn-block" type="button" data-action="cloud-signin">${ico('shield')}Mit Google anmelden</button>
        <p class="hint" style="margin-top:-6px">Freiwillig. Ohne Anmeldung bleiben alle Daten nur auf diesem Gerät.</p>`;
    return `<section class="section"><h2 class="form-section-title">Cloud-Sicherung</h2><div class="card stack" id="cloud-card">${body}</div></section>`;
  },
  refreshUI() {
    const card = $('#cloud-card');
    if (!card) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = Cloud.section();
    const fresh = tmp.querySelector('#cloud-card');

  }
};

/* ===================== 6g. BENACHRICHTIGUNGEN ===================== */
/**
 * Erinnerungen als Android-Benachrichtigung – ohne Server.
 * Die installierte App (GitHub Pages / Play Store) meldet beim Browser eine regelmäßige Hintergrundprüfung an
 * (Periodic Background Sync, ca. alle 12 Stunden; wann genau, entscheidet Chrome). Der Service Worker (sw.js)
 * liest dabei die Produkte direkt aus dem Gerätespeicher und zeigt fällige Erinnerungen an.
 * Es werden keine Daten an einen Server gesendet. In der heruntergeladenen HTML-Datei ist die Funktion unsichtbar.
 */
const Notify = {
  TAG: 'belegwaechter-reminders',
  available() { return 'Notification' in window && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol); },
  background() { return typeof ServiceWorkerRegistration !== 'undefined' && 'periodicSync' in ServiceWorkerRegistration.prototype; },
  permission() { return Notify.available() ? Notification.permission : 'unsupported'; },
  on() { return Notify.available() && Prefs.get('notifyOn', false) && Notification.permission === 'granted'; },
  reg() {
    return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('Service Worker nicht bereit')), 8000))]);
  },
  async enable() {
    if (!Notify.available()) { UI.toast('Benachrichtigungen sind hier nicht möglich.', 'error'); return false; }
    let perm = Notification.permission;
    if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (e) { perm = 'denied'; } }
    if (perm !== 'granted') {
      Prefs.set('notifyOn', false);
      UI.toast(perm === 'denied' ? 'Benachrichtigungen sind blockiert. Erlaube sie in den Android-Einstellungen der App.' : 'Benachrichtigungen wurden nicht erlaubt.', 'error', 6000);
      return false;
    }
    Prefs.set('notifyOn', true);
    await Notify.sync();
    return true;
  },
  async disable() {
    Prefs.set('notifyOn', false);
    try { const r = await Notify.reg(); if (r.periodicSync) await r.periodicSync.unregister(Notify.TAG); } catch (e) { /* egal */ }
  },
  /** Hintergrundprüfung anmelden bzw. erneuern. */
  async sync() {
    if (!Notify.on() || !Notify.background()) return false;
    try {
      const r = await Notify.reg();
      if (navigator.permissions) {
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => null);
        if (st && st.state === 'denied') return false;
      }
      await r.periodicSync.register(Notify.TAG, { minInterval: 12 * 60 * 60 * 1000 });
      return true;
    } catch (e) { console.warn('Hintergrundprüfung', e); return false; }
  },
  async test() {
    try {
      const r = await Notify.reg();
      await r.showNotification('Belegwächter', { body: 'So sehen deine Erinnerungen aus, bevor eine Garantie abläuft.', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'bw-test', data: { url: './#/dashboard' } });
    } catch (e) { UI.toast('Die Test-Benachrichtigung konnte nicht angezeigt werden.', 'error'); }
  },
  /** Einmal nach dem ersten gespeicherten Produkt fragen – nicht gleich beim Start. */
  async maybeAsk() {
    if (!Notify.available() || Prefs.get('notifyAsked', false) || Notification.permission === 'denied') return;
    Prefs.set('notifyAsked', true);
    if (Notification.permission === 'granted') { Prefs.set('notifyOn', true); Notify.sync(); return; }
    const v = await UI.modal({
      title: 'Rechtzeitig erinnert werden?',
      html: '<p>Belegwächter kann dir eine Benachrichtigung schicken, bevor eine Garantie abläuft, auch wenn die App geschlossen ist.</p>',
      actions: [
        { label: 'Ja, benachrichtigen', value: 'yes', kind: 'primary', icon: 'bell' },
        { label: 'Später', value: null, kind: 'ghost' }
      ]
    });
    if (v === 'yes' && await Notify.enable()) UI.toast('Benachrichtigungen sind aktiv.');
  },
  settingsHtml() {
    if (!Notify.available()) return '';
    const perm = Notify.permission(), on = Notify.on();
    const status = perm === 'denied' ? 'Blockiert' : on ? 'Aktiv' : 'Aus';
    const hint = perm === 'denied' ? 'Benachrichtigungen sind für die App blockiert. Erlaube sie in den Android-Einstellungen unter Apps → Belegwächter → Benachrichtigungen.'
      : !Notify.background() ? 'Dieser Browser kann nicht im Hintergrund prüfen. Nutze zusätzlich „In Kalender eintragen“ beim Produkt.'
      : 'Die App prüft ungefähr einmal am Tag im Hintergrund. Den genauen Zeitpunkt bestimmt Android.';
    return `<section class="section"><h2 class="form-section-title">Benachrichtigungen</h2>
      <div class="card stack">
        <div class="kv"><span class="muted">Erinnerungen als Benachrichtigung</span><strong>${status}</strong></div>
        ${perm === 'denied' ? '' : `<button class="btn ${on ? 'btn-secondary' : 'btn-primary'} btn-block" type="button" data-action="notify-toggle">${ico('bell')}${on ? 'Ausschalten' : 'Einschalten'}</button>`}
        ${on ? `<button class="btn btn-ghost btn-block" type="button" data-action="notify-test">Test-Benachrichtigung senden</button>` : ''}
        <p class="hint" style="margin-top:-6px">${esc(hint)}</p>
      </div>
    </section>`;
  }
};

/* ===================== 6h. LIVE-SCANNER ===================== */
/**
 * Rechnung direkt in der App scannen: Kamera-Vorschau mit Rahmen, automatische Aufnahme,
 * sobald das Bild ruhig, scharf und hell genug ist (manueller Auslöser und Taschenlampe zusätzlich).
 * Nur über https:// (GitHub Pages / installierte App) – in der heruntergeladenen HTML-Datei bleibt es beim Hochladen.
 */
const LiveScan = {
  available() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false && /^https?:$/.test(location.protocol);
  },
  open() {
    return new Promise(async resolve => {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 } } });
      } catch (e) {
        UI.toast(e && e.name === 'NotAllowedError'
          ? 'Kamera-Zugriff wurde nicht erlaubt. Du kannst die Rechnung stattdessen als Foto oder PDF hochladen.'
          : 'Die Kamera konnte nicht gestartet werden. Lade die Rechnung stattdessen als Foto oder PDF hoch.', 'error', 6000);
        resolve(null); return;
      }
      const el = document.createElement('div');
      el.className = 'scanner';
      el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Rechnung scannen');
      el.innerHTML = `<video playsinline autoplay muted></video>
        <div class="scan-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="scan-top">
          <button class="scan-btn" type="button" data-scan="close" aria-label="Schließen">${ICON.close || '✕'}</button>
          <button class="scan-btn" type="button" data-scan="torch" aria-label="Licht" hidden>${ICON.torch}</button>
        </div>
        <div class="scan-bottom">
          <p class="scan-msg" aria-live="polite">Halte die Rechnung in den Rahmen</p>
          <button class="scan-shutter" type="button" data-scan="shot" aria-label="Jetzt aufnehmen"></button>
          <p class="scan-sub">Wird automatisch aufgenommen, sobald das Bild ruhig und scharf ist</p>
        </div>`;
      const video = el.querySelector('video');
      video.srcObject = stream;
      const track = stream.getVideoTracks()[0];
      let done = false, result = null, timer = null, torchOn = false;
      const stop = () => { clearInterval(timer); document.removeEventListener('visibilitychange', onHide); stream.getTracks().forEach(t => t.stop()); };
      const onHide = () => { if (document.hidden && !done) { done = true; Overlay.closeTop(); } };
      document.addEventListener('visibilitychange', onHide);
      Overlay.open(el, () => { done = true; stop(); resolve(result); });
      // Schließen sofort bedienbar machen, noch bevor die Kamera läuft
      el.querySelector('[data-scan="close"]').onclick = () => { done = true; Overlay.closeTop(); };
      try { await video.play(); } catch (e) { /* Autoplay: läuft trotzdem an */ }
      if (done) return;
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps && caps.torch) {
          const tb = el.querySelector('[data-scan="torch"]'); tb.hidden = false;
          tb.onclick = async () => { torchOn = !torchOn; try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); tb.classList.toggle('on', torchOn); } catch (e) { torchOn = !torchOn; } };
        }
      } catch (e) { /* kein Licht verfügbar */ }
      const msg = el.querySelector('.scan-msg'), sub = el.querySelector('.scan-sub');
      const capture = async () => {
        if (done) return;
        done = true; clearInterval(timer);
        el.classList.add('flash');
        msg.textContent = 'Aufgenommen';
        let blob = null;
        try { if ('ImageCapture' in window) blob = await new ImageCapture(track).takePhoto(); } catch (e) { blob = null; }
        if (!blob || !blob.size) {
          const c = document.createElement('canvas');
          c.width = video.videoWidth || 1280; c.height = video.videoHeight || 720;
          c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
          blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
        }
        result = blob && blob.size ? new File([blob], `Rechnung-${App.today}.jpg`, { type: blob.type || 'image/jpeg' }) : null;
        Overlay.closeTop();
      };
      el.querySelector('[data-scan="shot"]').onclick = capture;
      // Automatische Aufnahme: kleine Kopie des Kamerabilds auf Ruhe, Schärfe und Helligkeit prüfen
      const W = 160, H = 120, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      let prev = null, steady = 0, maxSharp = 0;
      const startAt = Date.now();
      timer = setInterval(() => {
        if (done || video.readyState < 2) return;
        cx.drawImage(video, 0, 0, W, H);
        const d = cx.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
        let bright = 0;
        for (let i = 0, j = 0; i < d.length; i += 4, j++) { g[j] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; bright += g[j]; }
        bright /= g.length;
        let s1 = 0, s2 = 0, n = 0;
        for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
          const k = y * W + x, l = 4 * g[k] - g[k - 1] - g[k + 1] - g[k - W] - g[k + W];
          s1 += l; s2 += l * l; n++;
        }
        const sharp = s2 / n - (s1 / n) * (s1 / n);
        let motion = 99;
        if (prev) { motion = 0; for (let k = 0; k < g.length; k++) motion += Math.abs(g[k] - prev[k]); motion /= g.length; }
        prev = g;
        maxSharp = Math.max(maxSharp, sharp);
        const warm = Date.now() - startAt > 1200;
        const sharpOk = sharp > Math.max(40, maxSharp * 0.65);
        let text;
        if (bright < 45) text = 'Zu dunkel – mehr Licht oder Taschenlampe';
        else if (bright > 240) text = 'Zu hell – Spiegelung vermeiden';
        else if (motion > 5) text = 'Halte das Handy ruhig';
        else if (!sharpOk) text = 'Etwas näher heran, bis die Schrift scharf ist';
        else text = 'Gleich wird aufgenommen …';
        msg.textContent = text;
        steady = warm && bright >= 45 && bright <= 240 && motion <= 5 && sharpOk ? steady + 1 : 0;
        if (Date.now() - startAt > 8000) sub.textContent = 'Klappt es nicht automatisch? Tippe auf den Auslöser.';
        if (steady >= 4) capture();
      }, 250);
    });
  }
};

/* ===================== 7. UI-BAUSTEINE ===================== */
/**
 * Overlays (Bottom-Sheets, Belegansicht) legen einen History-Eintrag an.
 * So schließt die Android-Zurück-Taste zuerst das Overlay statt die Seite zu verlassen.
 */
const Overlay = {
  stack: [],
  open(el, onRemoved) {
    const entry = { el, onRemoved, pushed: false, closing: false };
    Overlay.stack.push(entry);
    document.body.appendChild(el);
    document.body.classList.add('no-scroll');
    try { history.pushState({ gbOverlay: true }, '', location.href); entry.pushed = true; } catch (e) {}
    return entry;
  },
  closeTop() {
    const top = Overlay.stack[Overlay.stack.length - 1];
    if (!top || top.closing) return;
    top.closing = true;
    if (top.pushed) {
      history.back();
      setTimeout(() => { if (Overlay.stack.includes(top)) Overlay._remove(top); }, 700);
    } else Overlay._remove(top);
  },
  _remove(entry) {
    const i = Overlay.stack.indexOf(entry);
    if (i < 0) return;
    Overlay.stack.splice(i, 1);
    entry.el.remove();
    if (!Overlay.stack.length) document.body.classList.remove('no-scroll');
    try { entry.onRemoved && entry.onRemoved(); } catch (e) { console.error(e); }
  },
  onPopState() { const top = Overlay.stack[Overlay.stack.length - 1]; if (top) Overlay._remove(top); },
  removeAll() { [...Overlay.stack].reverse().forEach(Overlay._remove); }
};

const UI = {
  /** Bottom-Sheet mit Aktionen. Liefert den value der gewählten Aktion oder null (abgebrochen). */
  /**
   * Optional check(value, el): wird beim Tippen auf eine Aktion ausgeführt (darf async sein).
   * Rückgabe { error } lässt das Sheet offen und zeigt den Fehler, { data } schließt es.
   * Mit check liefert das Promise { value, data } statt nur value.
   */
  modal({ title, html = '', actions = [], check = null }) {
    return new Promise(resolve => {
      const el = document.createElement('div');
      el.className = 'overlay';
      el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
          <div class="sheet-grip" aria-hidden="true"></div>
          <h2 class="sheet-title" id="sheet-title">${esc(title)}</h2>
          ${html ? `<div class="sheet-body">${html}</div>` : ''}
          ${check ? '<p class="err sheet-err" role="alert" hidden></p>' : ''}
          <div class="sheet-actions">${actions.map((a, i) => `<button type="button" class="btn btn-block btn-${a.kind || 'secondary'}" data-i="${i}">${a.icon ? ico(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div>
        </div>`;
      let chosen = null, data = null, running = false;
      const buttons = () => el.querySelectorAll('.sheet-actions button');
      el.addEventListener('click', async ev => {
        if (ev.target === el) { if (!running) Overlay.closeTop(); return; }
        const b = ev.target.closest('button[data-i]');
        if (!b || running) return;
        const a = actions[+b.dataset.i];
        if (check && a.value != null) {
          running = true;
          buttons().forEach(x => { x.disabled = true; });
          const label = b.innerHTML;
          if (a.busy) b.textContent = a.busy;
          let res;
          try { res = await check(a.value, el); } catch (e) { res = { error: e instanceof UserError ? e.message : 'Das hat nicht funktioniert.' }; }
          running = false;
          b.innerHTML = label;
          if (res && res.error) {
            const er = el.querySelector('.sheet-err');
            er.textContent = res.error; er.hidden = false;
            buttons().forEach(x => { x.disabled = false; });
            return;
          }
          data = res ? res.data : null;
        }
        chosen = a.value;
        buttons().forEach(x => { x.disabled = true; });
        Overlay.closeTop();
      });
      el.addEventListener('keydown', ev => {
        // Enter in einem Passwortfeld löst die erste Aktion aus.
        if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); const b = el.querySelector('.sheet-actions button[data-i="0"]'); b && b.click(); }
      });
      Overlay.open(el, () => resolve(check ? { value: chosen, data } : chosen));
      setTimeout(() => { const s = el.querySelector('.sheet'); s && s.focus({ preventScroll: true }); }, 30);
    });
  },
  confirm({ title, html, confirmLabel = 'OK', danger = false }) {
    return UI.modal({ title, html, actions: [
      { label: confirmLabel, value: true, kind: danger ? 'danger' : 'primary' },
      { label: 'Abbrechen', value: false, kind: 'ghost' }
    ] }).then(v => v === true);
  },
  toast(msg, type = 'info', ms = 0) {
    const host = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' toast-error' : '');
    t.setAttribute('role', type === 'error' ? 'alert' : 'status');
    t.textContent = msg;
    host.appendChild(t);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms || (type === 'error' ? 5000 : 2800));
  }
};

/** Dateiauswahl über versteckte Inputs. Liefert die Datei oder bleibt bei Abbruch offen (kein Effekt). */
const Picker = {
  pick(kind) {
    const input = document.getElementById('pick-' + kind);
    return new Promise(resolve => {
      input.value = '';
      input.onchange = () => { const f = input.files && input.files[0]; input.onchange = null; resolve(f || null); };
      input.click();
    });
  },
  pickMany(kind) {
    const input = document.getElementById('pick-' + kind);
    return new Promise(resolve => {
      input.value = '';
      input.onchange = () => { const f = input.files ? [...input.files] : []; input.onchange = null; resolve(f); };
      input.click();
    });
  }
};

/** Rechnung anzeigen: Bilder direkt, PDFs am Desktop eingebettet, auf dem Smartphone zum Öffnen/Herunterladen. */
async function openReceiptViewer(meta) {
  let rec;
  try { rec = await Store.getReceipt(meta.id); } catch (e) { rec = null; }
  if (!rec || !rec.blob) { UI.toast('Die Rechnungsdatei wurde nicht gefunden.', 'error'); return; }
  const url = URL.createObjectURL(rec.blob);
  const isPdf = rec.type === 'application/pdf';
  const inlinePdf = isPdf && window.matchMedia('(min-width: 900px)').matches && !/Android|iPhone|iPad/i.test(navigator.userAgent);
  const el = document.createElement('div');
  el.className = 'viewer';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', 'Rechnung ' + rec.name);
  el.innerHTML = `

      !isPdf ? `<img src="${url}" alt="Rechnung">`

function countStatus(list, today) {
  const c = { active: 0, soon: 0, critical: 0, expired: 0 };
  list.forEach(p => { c[Status.of(p, today).key]++; });
  return c;
}
/** Anteil der bereits verstrichenen Garantiezeit (0–1) → Restlaufzeit-Balken. */
function remainingRatio(p, today) {
  const total = DateUtil.diffDays(p.warrantyStart || p.purchaseDate, p.warrantyEnd);
  const left = DateUtil.diffDays(today, p.warrantyEnd);
  if (left < 0) return 0;
  if (total <= 0) return 1;
  return Math.max(0, Math.min(1, left / total));
}
function lifeBar(p, today, key) {
  const pct = Math.round(remainingRatio(p, today) * 100);
  return `<div class="life s-${key}" role="img" aria-label="Restlaufzeit ${pct} Prozent"><span style="width:${key === 'expired' ? 100 : Math.max(pct, 2)}%"></span></div>`;
}

function filterProducts(list, { query = '', status = 'all', category = '', sort = 'end' }, today) {
  const terms = norm(query).split(/\s+/).filter(Boolean);
  const out = list.map(p => ({ p, s: Status.of(p, today) })).filter(({ p, s }) => {
    if (terms.length) {
      const hay = norm([p.name, p.retailer, p.category, p.serialNumber, p.modelNumber].join(' '));
      if (!terms.every(t => hay.includes(t))) return false;
    }
    if (category && p.category !== category) return false;
    if (status === 'active' && s.key !== 'active') return false;
    if (status === 'soon' && s.key !== 'soon' && s.key !== 'critical') return false;
    if (status === 'expired' && s.key !== 'expired') return false;
    return true;
  });
  const byName = (a, b) => a.p.name.localeCompare(b.p.name, 'de', { sensitivity: 'base' });
  const sorters = {
    // Laufende Garantien: nächstes Ende zuerst. Abgelaufene danach, zuletzt abgelaufene zuerst.
    end: (a, b) => {
      const ea = a.s.days < 0, eb = b.s.days < 0;
      if (ea !== eb) return ea ? 1 : -1;
      return (ea ? b.s.days - a.s.days : a.s.days - b.s.days) || byName(a, b);
    },
    purchase: (a, b) => (a.p.purchaseDate < b.p.purchaseDate ? 1 : a.p.purchaseDate > b.p.purchaseDate ? -1 : 0) || byName(a, b),
    price: (a, b) => {
      if (a.p.price == null && b.p.price == null) return byName(a, b);
      if (a.p.price == null) return 1;
      if (b.p.price == null) return -1;
      return (b.p.price - a.p.price) || byName(a, b);
    },
    name: byName
  };
  out.sort(sorters[sort] || sorters.end);
  return out;
}

function productCard({ p, s }) {
  const cat = catInfo(p.category);
  const price = Money.format(p.price);
  return `<a class="pcard" href="#/product/${encodeURIComponent(p.id)}">
    <div class="pcard-top">
      <span class="cat-badge" aria-hidden="true">${cat.icon}</span>
      <div style="min-width:0">
        <h3 class="pcard-name">${esc(p.name)}</h3>
        <p class="pcard-sub">${esc(p.category)}${p.retailer ? ', ' + esc(p.retailer) : ''}</p>
      </div>
      ${p.receipt ? `<span class="pcard-receipt" title="Rechnung gespeichert" aria-label="Rechnung gespeichert">${ico('clip', '')}</span>` : ''}
    </div>
    <div class="pcard-mid">
      <span class="status s-${s.key}"><span class="dot"></span>${esc(s.text)}</span>
      ${price ? `<span class="pcard-price">${price}</span>` : ''}
    </div>
    ${lifeBar(p, App.today, s.key)}
    <div class="pcard-foot"><span>Garantie bis ${DateUtil.format(p.warrantyEnd)}</span></div>
  </a>`;
}

/** Icon als Inline-SVG mit eigener Klasse (z. B. für Buttons). */
function ico(name, cls = 'btn-ico') { return ICON[name].replace('<svg', `<svg class="${cls}"`); }
/** Dashboard ohne Produkte: Begrüßung mit den wichtigsten Funktionen. */
function welcomeState() {
  return `<div class="empty welcome">
    ${ICON.emptyBox}
    <h2>Willkommen bei Belegwächter</h2>
    <p>Alle Garantien und Rechnungen an einem Ort.</p>
    <ul class="welcome-points">
      <li><span class="pt-ico">${ico('scan', '')}</span><span>Rechnung scannen, die Angaben werden automatisch ausgefüllt</span></li>
      <li><span class="pt-ico">${ico('bell', '')}</span><span>Rechtzeitig erinnert, bevor eine Garantie abläuft</span></li>
      <li><span class="pt-ico">${ico('shield', '')}</span><span>${Cloud.enabled() ? 'Ohne Konto nutzbar, Cloud-Sicherung freiwillig' : 'Alles bleibt auf deinem Gerät'}</span></li>

}
/** Kleiner Leerzustand für Produkte und Statistiken. */
function emptyState(kind) {
  const t = kind === 'stats'
    ? ['Noch keine Statistiken', 'Sobald du Produkte gespeichert hast, siehst du hier Gesamtwert, Kategorien und Garantiestatus.']
    : ['Noch keine Produkte', 'Hier erscheinen alle gespeicherten Produkte mit Garantiestatus und Suche.'];
  return `<div class="empty empty-sm">
    ${ICON.emptyBox}
    <h2>${t[0]}</h2>
    <p>${t[1]}</p>
    <p class="start-hint">Tippe unten auf <strong>Hinzufügen</strong></p>

}
function noResults(withReset) {
  return `<div class="card flat no-results"><strong>Keine Treffer</strong><p class="muted small">Prüfe die Schreibweise oder suche nach Händler, Seriennummer oder Modellnummer.</p>
    ${withReset ? '<button class="btn btn-secondary btn-sm" type="button" data-action="reset-filters">Filter zurücksetzen</button>' : ''}</div>`;
}

/* ---------- Startseite: Liste aller Produkte ---------- */
function fab() { return `<a class="fab" href="#/add">${ico('plus')}Rechnung hinzufügen</a>`; }
function viewDashboard() {
  const list = App.products, today = App.today;
  if (!list.length) return welcomeState() + fab();
  const c = countStatus(list, today);
  const due = Reminders.due(list, today);
  const soonN = c.soon + c.critical;
  const summary = soonN
    ? `<span class="dot s-soon"></span><span><strong>${soonN} ${soonN === 1 ? 'Garantie läuft' : 'Garantien laufen'}</strong> in den nächsten 90 Tagen ab</span>`
    : c.active ? `<span class="dot s-active"></span><span>Alle Garantien laufen noch länger als 90 Tage</span>`
      : `<span class="dot s-expired"></span><span>Alle gespeicherten Garantien sind abgelaufen</span>`;
  return `
    ${due.length ? `<section class="card reminders" aria-label="Fällige Erinnerungen">
      <h2 class="card-title">${ico('bell')}${due.length === 1 ? 'Eine Erinnerung' : due.length + ' Erinnerungen'}</h2>
      ${due.map(d => `<div class="rem-item">
          <a href="#/product/${encodeURIComponent(d.product.id)}"><strong>${esc(d.product.name)}</strong><span>${esc(Status.endsText(d.days))}</span></a>
          <button class="btn btn-secondary btn-sm" type="button" data-action="ack" data-id="${esc(d.product.id)}">Erledigt</button>
        </div>`).join('')}
    </section>` : ''}
    <p class="home-summary">${summary}</p>
    <div class="search">${ICON.search}<label class="sr-only" for="dash-search">Suchen</label>
      <input class="input" id="dash-search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Suchen" value="${esc(App.dashQuery)}">
    </div>
    <div id="dash-results">${dashResults()}</div>
    ${fab()}`;
}
function dashResults() {
  const res = filterProducts(App.products, { query: App.dashQuery.trim() }, App.today);
  if (!res.length) return noResults(false);
  return `<div class="grid home-list">${res.map(productCard).join('')}</div>`;
}

/* ---------- Produktliste ---------- */
function viewProducts() {
  if (!App.products.length) return emptyState('products');
  const st = App.listState, c = countStatus(App.products, App.today);
  const chips = [['all', 'Alle', App.products.length], ['active', 'Aktiv', c.active], ['soon', 'Läuft bald ab', c.soon + c.critical], ['expired', 'Abgelaufen', c.expired]];
  return `
    <div class="search">${ICON.search}<label class="sr-only" for="list-search">Produkte durchsuchen</label>
      <input class="input" id="list-search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Name, Händler, Kategorie, Seriennummer …" value="${esc(st.query)}">

    </div>
    <div id="list-results">${listResults()}</div>`;

function listResults() {
  const st = App.listState;
  const res = filterProducts(App.products, st, App.today);
  const filtered = st.query.trim() || st.status !== 'all' || st.category;
  if (!res.length) return noResults(filtered);
  return `<p class="result-count" style="margin-bottom:10px">${res.length} ${plural(res.length, 'Produkt', 'Produkte')}</p><div class="grid">${res.map(productCard).join('')}</div>`;
}

/* ---------- Produktdetails ---------- */
function viewDetail(id) {
  const p = App.products.find(x => x.id === id);
  if (!p) return `<div class="empty"><h2>Produkt nicht gefunden</h2><p>Das Produkt wurde gelöscht oder existiert nicht mehr.</p><a class="btn btn-primary" href="#/dashboard">Zur Übersicht</a></div>`;
  const s = Status.of(p, App.today), cat = catInfo(p.category);
  const n = Math.abs(s.days);
  const unit = s.days >= 0
    ? `<strong>${plural(n, 'Tag', 'Tage')} übrig</strong><span>${esc(s.text)}</span>`
    : `<strong>${plural(n, 'Tag', 'Tage')} abgelaufen</strong><span>${esc(s.text)}</span>`;
  const row = (dt, dd, cls = '') => `<div class="info-row ${cls}"><dt>${dt}</dt><dd>${dd}</dd></div>`;
  const dash = '<span class="muted">–</span>';
  const rem = p.reminders.length ? p.reminders.slice().sort((a, b) => b - a).map(r => r + ' Tage').join(', ') + ' vorher' : 'Keine';
  return `
    <article class="card hero">
      <div class="hero-cat"><span class="cat-badge" aria-hidden="true">${cat.icon}</span>${esc(p.category)}</div>
      <h2 class="hero-name">${esc(p.name)}</h2>
      <span class="status s-${s.key}"><span class="dot"></span>${esc(s.label)}</span>
      <div class="countdown"><span class="countdown-num">${n}</span><span class="countdown-unit">${unit}</span></div>
      ${lifeBar(p, App.today, s.key)}
      <div class="life-legend"><span>${DateUtil.format(p.warrantyStart)}</span><span>${DateUtil.format(p.warrantyEnd)}</span></div>
    </article>

    <section class="card" aria-label="Produktdaten"><dl class="info">
      ${row('Kategorie', esc(p.category))}
      ${row('Kaufpreis', p.price != null ? `<span class="num">${Money.format(p.price)}</span>` : dash)}
      ${row('Gekauft am', DateUtil.format(p.purchaseDate))}
      ${row('Händler', p.retailer ? esc(p.retailer) : dash)}
      ${row('Seriennummer', p.serialNumber ? esc(p.serialNumber) : dash)}
      ${row('Modellnummer', p.modelNumber ? esc(p.modelNumber) : dash)}
      ${row('Garantiezeit', esc(durationLabel(p)))}

/**
 * Datumsfelder zum Tippen: Text „TT.MM.JJJJ“ (Punkte werden beim Tippen automatisch gesetzt),
 * daneben ein Kalender-Button, der den Datumsauswähler des Geräts öffnet.
 * Akzeptiert beim Tippen/Einfügen auch 12.8.26, 12082026, 12/08/2026 und 2026-08-12.
 * Intern wird weiter mit ISO-Daten (JJJJ-MM-TT) gerechnet.
 */
const DateInput = {
  parse(text) {
    const t = String(text || '').trim();
    if (!t) return '';
    const y2 = y => y < 100 ? y + (y <= +App.today.slice(2, 4) + 20 ? 2000 : 1900) : y;
    const ok = (y, m, d) => { const iso = DateUtil.toISO(y, m, d); return DateUtil.isValid(iso) ? iso : t; };
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
    if (m) return ok(+m[1], +m[2], +m[3]);
    m = /^(\d{1,2})\s*[.\/\-,]\s*(\d{1,2})\s*[.\/\-,]\s*(\d{2}|\d{4})$/.exec(t);
    if (m) return ok(y2(+m[3]), +m[2], +m[1]);
    m = /^(\d{2})(\d{2})(\d{4}|\d{2})$/.exec(t);
    if (m) return ok(y2(+m[3]), +m[2], +m[1]);
    return t; // ungültig → Rohtext, die Prüfung meldet den Fehler
  },
  format(iso) { return DateUtil.isValid(iso) ? DateUtil.format(iso) : (iso || ''); },
  get(id) { const el = $('#' + id); return el ? DateInput.parse(el.value) : ''; },
  set(id, iso) { const el = $('#' + id); if (el) el.value = DateInput.format(iso); },
  /** Beim Tippen von Ziffern die Punkte ergänzen: 1208 → 12.08., 12082026 → 12.08.2026 */
  onInput(el, e) {
    if (e && e.inputType && !e.inputType.startsWith('insert')) return;
    const raw = el.value;
    if (!(/^\d{1,8}$/.test(raw) || /^\d{2}\.\d{0,2}$/.test(raw) || /^\d{2}\.\d{2}\.\d{0,4}$/.test(raw) || /^\d{2}\.\d{3,}$/.test(raw))) return;
    if (el.selectionStart !== raw.length) return;
    const d = raw.replace(/\D/g, '').slice(0, 8);
    let out = d.slice(0, 2);
    if (d.length >= 2) out += '.';
    out += d.slice(2, 4);
    if (d.length >= 4) out += '.';
    out += d.slice(4, 8);
    if (out !== raw) el.value = out;
  },
  /** Beim Verlassen des Feldes einheitlich als TT.MM.JJJJ schreiben. */

};

/**
 * Formular-Entwurf: Android beendet Browser-Tabs im Hintergrund manchmal, z. B. während die Kamera-App offen ist.
 * Damit Eingaben dabei nicht verloren gehen, wird das offene Formular laufend gesichert:
 * Textfelder in localStorage, eine bereits gewählte Rechnung als Blob in IndexedDB (feste ID, keinem Produkt zugeordnet,
 * erscheint deshalb weder in Listen noch in Backups). Beim nächsten Öffnen desselben Formulars wird der Entwurf eingesetzt.
 * Gelöscht wird er beim Speichern, beim Abbrechen, über "Verwerfen" und nach 7 Tagen.
 */
const Draft = {
  KEY: 'formDraft', RECEIPT_ID: '__draft__', MAX_AGE: 7 * 864e5, timer: null,
  load() {
    const d = Prefs.get(Draft.KEY, null);
    if (!d || typeof d !== 'object' || !d.values || typeof d.values !== 'object') return null;
    const age = Date.now() - Date.parse(d.savedAt);
    if (!(age >= 0 && age < Draft.MAX_AGE)) { Draft.clear(); return null; }
    return d;
  },
  /** Passt der Entwurf zu diesem Formular? Bei "Bearbeiten" nur, wenn das Produkt seitdem nicht geändert wurde. */
  match(mode, src) {
    const d = Draft.load();
    if (!d || d.mode !== mode) return null;
    if (mode === 'add') return d;
    return src && d.productId === src.id && (mode !== 'edit' || d.baseUpdatedAt === src.updatedAt) ? d : null;
  },
  schedule() { clearTimeout(Draft.timer); Draft.timer = setTimeout(Draft.saveNow, 400); },
  saveNow() {
    clearTimeout(Draft.timer); Draft.timer = null;
    const F = App.form;
    if (!F || F.saving || !$('#product-form')) return;
    Prefs.set(Draft.KEY, {
      mode: F.mode, productId: F.srcId, baseUpdatedAt: F.baseUpdatedAt,
      values: readForm(), removeExisting: F.removeExisting,
      receipt: F.pending ? (F.pendingFromDraft ? 'draft' : 'copy') : (F.loading || 'none'),
      savedAt: new Date().toISOString()
    });
  },
  /** Neu gewählte Rechnung mitsichern. Fehler (z. B. Speicher voll) sind hier nicht kritisch. */
  saveReceipt(p) {
    return Store.putReceipt({ id: Draft.RECEIPT_ID, productId: Draft.RECEIPT_ID, name: p.name, type: p.type, size: p.size, addedAt: new Date().toISOString(), blob: p.blob })
      .then(() => true, () => false);
  },
  dropReceipt() { return Store.deleteReceipt(Draft.RECEIPT_ID).catch(() => {}); },
  clear() {
    clearTimeout(Draft.timer); Draft.timer = null;
    Prefs.set(Draft.KEY, null);
    return Draft.dropReceipt();
  }
};

function applyDraft(d) {
  const md = $('#more-fields'); if (md) md.open = true;
  const v = d.values, set = (id, val) => { const el = $('#' + id); if (el && typeof val === 'string') el.value = val; };
  ['name', 'price', 'retailer', 'serialNumber', 'modelNumber', 'notes'].forEach(k => set('f-' + k, v[k]));
  ['purchaseDate', 'customEnd'].forEach(k => { if (typeof v[k] === 'string') DateInput.set('f-' + k, v[k]); });
  const selSet = (id, val) => { const el = $('#' + id); if (el && [...el.options].some(o => o.value === val)) el.value = val; };
  selSet('f-category', v.category); selSet('f-duration', v.duration);
  if (Array.isArray(v.reminders)) document.querySelectorAll('#product-form input[name="reminder"]').forEach(i => { i.checked = v.reminders.includes(+i.value); });
  const when = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(d.savedAt));
  const note = document.createElement('div');
  note.className = 'notice notice-info';
  note.id = 'draft-notice';
  note.innerHTML = `Nicht gespeicherte Eingaben vom ${esc(when)} Uhr wurden wiederhergestellt. <button class="link-btn" type="button" data-action="draft-discard">Verwerfen</button>`;
  $('#product-form').prepend(note);
}

function mountForm(mode, src) {
  App.form = {
    mode, productId: mode === 'edit' ? src.id : null,
    srcId: src ? src.id : null, baseUpdatedAt: mode === 'edit' ? src.updatedAt : null,
    existing: mode === 'edit' ? src.receipt : null,

    lastEnd: null

  const draft = Draft.match(mode, src);
  if (draft) {
    F.catTouched = true;
    applyDraft(draft);
    if (mode === 'edit') F.removeExisting = !!draft.removeExisting && !!src.receipt;
    if (draft.receipt === 'draft') {
      F.busy = true; F.loading = 'draft';
      Store.getReceipt(Draft.RECEIPT_ID).then(rec => {
        if (App.form !== F) return;
        if (rec && rec.blob) { F.pending = { blob: rec.blob, name: rec.name, type: rec.type, size: rec.size }; F.pendingFromDraft = true; }
        else UI.toast('Die zuvor gewählte Rechnung konnte nicht wiederhergestellt werden. Bitte füge sie erneut hinzu.', 'error');
      }).catch(() => {}).finally(() => { F.busy = false; F.loading = null; if (App.form === F) renderFormReceipt(); });
    }
  }
  updateWarrantyPreview();
  if (!F.busy) renderFormReceipt(); else renderFormReceipt('Rechnung wird wiederhergestellt …');
  // Beim Duplizieren wird die Rechnung als Kopie übernommen (außer der Entwurf sagt etwas anderes).
  if (mode === 'duplicate' && src.receipt && (!draft || draft.receipt === 'copy')) {
    F.busy = true; F.loading = 'copy'; renderFormReceipt('Rechnung wird übernommen …');
    Store.getReceipt(src.receipt.id).then(rec => {
      if (App.form !== F) return;
      if (rec && rec.blob) F.pending = { blob: rec.blob, name: rec.name, type: rec.type, size: rec.size };
    }).catch(() => {}).finally(() => { F.busy = false; F.loading = null; if (App.form === F) renderFormReceipt(); });

function readForm() {
  const v = id => ($('#' + id) ? $('#' + id).value : '');

    retailer: v('f-retailer'), serialNumber: v('f-serialNumber'), modelNumber: v('f-modelNumber'),

/** Live-Berechnung: Kaufdatum + Garantiezeit → "Garantie endet am …". */
function updateWarrantyPreview() {

  if (ceProxy) { if (DateUtil.isValid(pd)) ceProxy.min = pd; else ceProxy.removeAttribute('min'); }

  if (dur === 'custom') end = DateUtil.isValid(ce) ? ce : null;

function renderFormReceipt(busyText) {

function buildProduct(v, cents, base) {

    id: base ? base.id : newId(),
    name: v.name.trim().slice(0, 200),

    purchaseDate: v.purchaseDate,

    warrantyStart: v.purchaseDate,

    reminders: v.reminders,

    reminderAcks: base && base.warrantyEnd === warrantyEnd ? (base.reminderAcks || []).filter(r => v.reminders.includes(r)) : [],

  const md = $('#more-fields');
  if (md && Object.keys(errors).some(k => md.querySelector('#err-' + k))) md.open = true;
  showFormErrors(errors);
  if (Object.keys(errors).length) return;
  const base = F.mode === 'edit' ? App.products.find(p => p.id === F.productId) : null;

    if (F.mode !== 'edit' && App.products.length === 1) setTimeout(() => Notify.maybeAsk(), 900);
    if (F.mode === 'edit' && App.stack.length > 1) history.back();
    else go('product/' + encodeURIComponent(product.id), { replace: true });
  } catch (e) {
    console.error(e);
    UI.toast(storageErrorMessage(e), 'error');
    F.saving = false; btn.disabled = false; btn.textContent = F.mode === 'edit' ? 'Änderungen speichern' : 'Produkt speichern';
  }
}
async function formPick(kind) {
  const F = App.form;
  if (!F || F.busy) return;
  Draft.saveNow();
  const file = await Picker.pick(kind);
  if (!file || App.form !== F) return;
  await Scan.upload(F, file);
}

function viewStats() {
  const list = App.products, today = App.today;
  if (!list.length) return emptyState('stats');
  const c = countStatus(list, today);
  const total = list.reduce((s, p) => s + Money.cents(p.price), 0);
  const validValue = list.filter(p => Status.of(p, today).days >= 0).reduce((s, p) => s + Money.cents(p.price), 0);
  const next30 = list.filter(p => { const d = Status.of(p, today).days; return d >= 0 && d <= 30; }).length;
  const tile = (label, value, sub) => `<div class="stat"><span class="stat-label">${label}</span><strong class="stat-num">${value}</strong>${sub ? `<span class="stat-sub">${sub}</span>` : ''}</div>`;
  const segs = [
    ['active', 'Aktiv, mehr als 90 Tage', c.active, 'var(--ok)'],
    ['soon', 'Läuft bald ab, 30 bis 90 Tage', c.soon, 'var(--warn)'],
    ['critical', 'Läuft sehr bald ab, unter 30 Tagen', c.critical, 'var(--soon)'],
    ['expired', 'Abgelaufen', c.expired, 'var(--bad)']
  ];
  const cats = CATEGORIES.map(cat => {
    const items = list.filter(p => p.category === cat.id);
    return { cat, n: items.length, value: items.reduce((s, p) => s + Money.cents(p.price), 0) };
  }).filter(x => x.n).sort((a, b) => b.n - a.n || b.value - a.value);
  const maxN = Math.max(...cats.map(x => x.n));
  return `
    <section class="stat-list" aria-label="Kennzahlen">
      ${tile('Produkte gesamt', list.length)}
      ${tile('Gesamtwert', `<span style="font-size:22px">${Money.formatCents(total)}</span>`)}
      ${tile('<span class="dot s-active"></span>Aktive Garantien', c.active, 'mehr als 90 Tage')}
      ${tile('<span class="dot s-soon"></span>Läuft bald ab', c.soon + c.critical, '90 Tage oder weniger')}
      ${tile('<span class="dot s-expired"></span>Abgelaufen', c.expired)}
      ${tile('<span class="dot s-critical"></span>Nächste 30 Tage', next30, 'enden bis ' + DateUtil.format(DateUtil.addDays(today, 30)))}
    </section>
    <section class="card">
      <h2 class="card-title">Garantiestatus</h2>
      <div class="stack-bar" role="img" aria-label="Verteilung der Garantiestatus">
        ${segs.filter(s => s[2]).map(s => `<span style="flex:${s[2]};background:${s[3]}"></span>`).join('')}
      </div>
      <div class="legend">${segs.map(s => `<div class="legend-row"><span class="dot s-${s[0]}"></span><span class="lbl">${s[1]}</span><span class="val">${s[2]}</span></div>`).join('')}</div>
      <div class="divider"></div>
      <div class="kv"><span class="muted">Wert mit laufender Garantie</span><strong class="num">${Money.formatCents(validValue)}</strong></div>
    </section>
    <section class="card">
      <h2 class="card-title">Nach Kategorie</h2>
      <div class="bars">${cats.map(x => `<div class="bar-row">
          <div class="bar-head"><strong>${x.cat.icon} ${esc(x.cat.id)}</strong><span class="muted num">${x.n} ${plural(x.n, 'Produkt', 'Produkte')}${x.value ? ', ' + Money.formatCents(x.value) : ''}</span></div>
          <div class="bar-track"><span style="width:${Math.round(x.n / maxN * 100)}%"></span></div></div>`).join('')}</div>
    </section>`;
}
